<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#06070a">
<title>Rainy Night on Main Street</title>
<style>
  html,body{margin:0;height:100%;background:#06070a;overflow:hidden;overscroll-behavior:none}
  body{font-family:Georgia,'Times New Roman',serif;color:#ead9bd;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;opacity:0;transition:opacity 1.8s ease}

  #c.drag{cursor:grabbing}
  #hint{position:fixed;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#f1e2c6;text-shadow:0 1px 10px rgba(0,0,0,.9);opacity:0;transition:opacity 1.2s ease;pointer-events:none}
  #hint.on{opacity:.82}
  #snd{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;font:13px Georgia,serif;letter-spacing:.06em;color:#ead9bd;background:rgba(18,14,10,.5);border:1px solid rgba(234,217,189,.28);border-radius:20px;padding:8px 14px;cursor:pointer;opacity:.75;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
  #snd:hover{opacity:1}
  #msg{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:17px;line-height:1.5}
</style>

<body>
<canvas id="c"></canvas>
<div id="hint">drag to look around</div>

<div id="msg"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
'use strict';
const msgEl=document.getElementById('msg');
function fail(t){msgEl.textContent=t;msgEl.style.display='flex';}
if(!window.THREE){fail('The 3D library could not load. This page needs an internet connection the first time it opens.');return;}
const T=THREE, OPTS=window.__MS_OPTS||{};
const canvas=document.getElementById('c');
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:false,alpha:false,depth:false,stencil:false,powerPreference:'high-performance'});}
catch(e){fail('This browser could not start WebGL.');return;}
if(!renderer.capabilities.isWebGL2){fail('This scene needs WebGL 2.');return;}
renderer.outputColorSpace=T.LinearSRGBColorSpace;
renderer.setPixelRatio(1);
const HDR=!!(renderer.extensions.get('EXT_color_buffer_float')||renderer.extensions.get('EXT_color_buffer_half_float'));
const RTTYPE=HDR?T.HalfFloatType:T.UnsignedByteType;
const TOUCH=matchMedia('(pointer:coarse)').matches;
const MAXANI=Math.min(8,renderer.capabilities.getMaxAnisotropy());

/* ---------------------------------------------------------------- utils */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=mulberry(1946);
const rr=(a,b)=>a+(b-a)*rnd();
const pick=arr=>arr[Math.floor(rnd()*arr.length)];
const mkC=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const R_=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
function vgrad(g,x,y,w,h,c0,c1){const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,c0);gr.addColorStop(1,c1);g.fillStyle=gr;g.fillRect(x,y,w,h);}
function glow(g,x,y,r,c,a){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba('+c+',1)');gr.addColorStop(.35,'rgba('+c+',.42)');gr.addColorStop(1,'rgba('+c+',0)');g.save();g.globalAlpha=a==null?1:a;g.globalCompositeOperation='lighter';g.fillStyle=gr;g.fillRect(x-r,y-r,2*r,2*r);g.restore();}
function circ(g,x,y,r,c,ry){g.fillStyle=c;g.beginPath();g.ellipse(x,y,r,ry||r,0,0,6.2832);g.fill();}

/* ---------------------------------------------------------------- noise + brick textures */
function makeNoise(){
  const N=256,h=new Float32Array(N*N),h2=new Float32Array(N*N),r=mulberry(77);
  function layer(dst,per,amp){
    const gv=new Float32Array(per*per);for(let i=0;i<gv.length;i++)gv[i]=r();
    for(let y=0;y<N;y++){const fy=y/N*per,y0=Math.floor(fy),y1=(y0+1)%per;let ty=fy-y0;ty=ty*ty*(3-2*ty);
      for(let x=0;x<N;x++){const fx=x/N*per,x0=Math.floor(fx),x1=(x0+1)%per;let tx=fx-x0;tx=tx*tx*(3-2*tx);
        const a=gv[y0*per+x0],b=gv[y0*per+x1],c=gv[y1*per+x0],d=gv[y1*per+x1];
        dst[y*N+x]+=amp*(a+(b-a)*tx+(c-a)*ty+(a-b-c+d)*tx*ty);}}
  }
  layer(h,4,.36);layer(h,8,.26);layer(h,16,.17);layer(h,32,.11);layer(h,64,.06);layer(h,128,.04);
  layer(h2,3,.4);layer(h2,7,.3);layer(h2,17,.18);layer(h2,41,.12);
  const d=new Uint8Array(N*N*4),st=v=>Math.max(0,Math.min(1,(v-.5)*2.2+.5)),cl=v=>Math.max(0,Math.min(255,v));
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x;
    const xl=h[y*N+((x+N-1)%N)],xr=h[y*N+((x+1)%N)],yu=h[((y+N-1)%N)*N+x],yd=h[((y+1)%N)*N+x];
    d[i*4]=cl(128+(xr-xl)*900);d[i*4+1]=cl(128+(yd-yu)*900);d[i*4+2]=st(h[i])*255;d[i*4+3]=st(h2[i])*255;}
  const t=new T.DataTexture(d,N,N,T.RGBAFormat);t.wrapS=t.wrapT=T.RepeatWrapping;t.minFilter=T.LinearMipmapLinearFilter;t.magFilter=T.LinearFilter;t.generateMipmaps=true;t.needsUpdate=true;return t;
}
function makeBrick(){
  const S=512,cols=8,rows=24,bw=S/cols,bh=S/rows,r=mulberry(1905),bc=[];
  for(let i=0;i<rows*cols;i++){let l=.52+r()*.26;if(r()<.13)l*=.62;if(r()<.06)l*=1.22;bc.push([l*(1+.12*(r()-.5)),l*(1+.08*(r()-.5)),l*(1+.1*(r()-.5)),.75+r()*.25]);}
  const c=mkC(S,S),g=c.getContext('2d'),im=g.createImageData(S,S),hgt=new Float32Array(S*S),mask=new Float32Array(S*S);
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){
    const row=Math.min(rows-1,Math.floor(y/bh)),fy=y-row*bh,off=(row%2)*bw*.5,xx=(x-off+S)%S,col=Math.min(cols-1,Math.floor(xx/bw)),fx=xx-col*bw;
    const dd=Math.min(fx,bw-fx,fy,bh-fy);let m=Math.max(0,Math.min(1,(dd-1.1)/1.6));m=m*m*(3-2*m);
    const b=bc[row*cols+col],n=.88+r()*.24,i=(y*S+x)*4,mr=.56*n;
    im.data[i]=255*Math.min(1,mr+(b[0]*n-mr)*m);im.data[i+1]=255*Math.min(1,mr+(b[1]*n-mr)*m);im.data[i+2]=255*Math.min(1,mr+(b[2]*n-mr)*m);im.data[i+3]=255;
    mask[y*S+x]=m;hgt[y*S+x]=m*b[3]+(n-1)*.35;}
  g.putImageData(im,0,0);
  const tex=new T.CanvasTexture(c);tex.flipY=false;tex.colorSpace=T.SRGBColorSpace;tex.wrapS=tex.wrapT=T.RepeatWrapping;tex.anisotropy=MAXANI;
  const nd=new Uint8Array(S*S*4),cl=v=>Math.max(0,Math.min(255,v));
  for(let y=0;y<S;y++)for(let x=0;x<S;x++){const i=y*S+x;
    const dx=hgt[y*S+((x+1)%S)]-hgt[y*S+((x+S-1)%S)],dy=hgt[((y+1)%S)*S+x]-hgt[((y+S-1)%S)*S+x];
    nd[i*4]=cl(128-dx*180);nd[i*4+1]=cl(128-dy*180);nd[i*4+2]=mask[i]*255;nd[i*4+3]=255;}
  const nt=new T.DataTexture(nd,S,S,T.RGBAFormat);nt.wrapS=nt.wrapT=T.RepeatWrapping;nt.minFilter=T.LinearMipmapLinearFilter;nt.magFilter=T.LinearFilter;nt.generateMipmaps=true;nt.anisotropy=MAXANI;nt.needsUpdate=true;
  return [tex,nt];
}
const noiseTex=makeNoise();
const brickTex=makeBrick();

/* ---------------------------------------------------------------- ground light map (shop glow spilling on the pavement) */
const LMC=mkC(1024,128),lmg=LMC.getContext('2d');lmg.fillStyle='#000';lmg.fillRect(0,0,1024,128);lmg.globalCompositeOperation='lighter';
const LMS=1024/208;
function lmSpot(x,z,r,c,a){const px=(x+104)*LMS,pz=(z+13)*LMS,pr=r*LMS,gr=lmg.createRadialGradient(px,pz,0,px,pz,pr);
  gr.addColorStop(0,'rgba('+c+','+a+')');gr.addColorStop(.5,'rgba('+c+','+(a*.38)+')');gr.addColorStop(1,'rgba('+c+',0)');lmg.fillStyle=gr;lmg.fillRect(px-pr,pz-pr,pr*2,pr*2);}
const c255=c=>Math.round(c[0]*255)+','+Math.round(c[1]*255)+','+Math.round(c[2]*255);

/* ---------------------------------------------------------------- atlas (everything that glows) */
const AT=2048,ATH=3072,PAD=6,atlasC=mkC(AT,ATH),ag=atlasC.getContext('2d');ag.fillStyle='#000';ag.fillRect(0,0,AT,ATH);
const reqs=[];
function req(w,h,draw,bleed,clear){const r={w,h,draw,bleed,clear,u0:0,v0:0,u1:1,v1:1};reqs.push(r);return r;}
function packAtlas(){
  const order=reqs.slice().sort((a,b)=>b.h-a.h);let x=0,y=0,sh=0;
  for(const r of order){const W=r.w+PAD*2,H=r.h+PAD*2;if(x+W>AT){x=0;y+=sh;sh=0;}
    const px=x+PAD,py=y+PAD;ag.save();
    if(r.clear)ag.clearRect(x,y,W,H);else if(r.bleed){ag.fillStyle=r.bleed;ag.fillRect(x,y,W,H);}
    ag.translate(px,py);ag.beginPath();ag.rect(0,0,r.w,r.h);ag.clip();r.draw(ag,r.w,r.h);ag.restore();
    r.u0=(px+.5)/AT;r.v0=(py+.5)/ATH;r.u1=(px+r.w-.5)/AT;r.v1=(py+r.h-.5)/ATH;x+=W;sh=Math.max(sh,H);}
  if(y+sh>ATH)console.warn('atlas overflow',y+sh);
}
const sub=(R,a,b,c,d)=>({u0:R.u0+(R.u1-R.u0)*a,v0:R.v0+(R.v1-R.v0)*b,u1:R.u0+(R.u1-R.u0)*c,v1:R.v0+(R.v1-R.v0)*d});

/* --- neon: single-stroke tube lettering */
const GLY={A:[10,'M0 14L5 0L10 14M2 9L8 9'],B:[10,'M0 14L0 0L5.5 0Q9.5 0 9.5 3.4Q9.5 6.8 5.5 6.8L0 6.8M5.5 6.8Q10 6.8 10 10.4Q10 14 5.5 14L0 14'],
C:[10,'M10 2.6Q8.5 0 5.5 0Q0 0 0 7Q0 14 5.5 14Q8.5 14 10 11.4'],D:[10,'M0 14L0 0L4 0Q10 0 10 7Q10 14 4 14L0 14'],E:[10,'M10 0L0 0L0 14L10 14M0 7L7 7'],
F:[10,'M10 0L0 0L0 14M0 7L7 7'],G:[10,'M10 2.6Q8.5 0 5.5 0Q0 0 0 7Q0 14 5.5 14Q10 14 10 9L10 7.6L5.5 7.6'],I:[2,'M1 0L1 14'],K:[10,'M0 0L0 14M10 0L0 8.2M3.4 5.6L10 14'],
L:[9,'M0 0L0 14L9 14'],N:[10,'M0 14L0 0L10 14L10 0'],O:[10,'M5 0Q0 0 0 7Q0 14 5 14Q10 14 10 7Q10 0 5 0Z'],P:[10,'M0 14L0 0L5.5 0Q10 0 10 3.8Q10 7.6 5.5 7.6L0 7.6'],
R:[10,'M0 14L0 0L5.5 0Q10 0 10 3.6Q10 7.2 5.5 7.2L0 7.2M5 7.2L10 14'],S:[10,'M9.6 2.6Q8.5 0 5 0Q.5 0 .5 3.5Q.5 6.5 5 7Q10 7.5 10 10.5Q10 14 5 14Q1 14 0 11.4'],
T:[10,'M0 0L10 0M5 0L5 14'],U:[10,'M0 0L0 9Q0 14 5 14Q10 14 10 9L10 0'],X:[10,'M0 0L10 14M10 0L0 14'],Y:[10,'M0 0L5 7L10 0M5 7L5 14'],Z:[10,'M0 0L10 0L0 14L10 14']};
function neonW(str,H,track){let u=0;for(const ch of str)u+=(ch===' '?6:GLY[ch][0])+track;return (u-track)*H/14;}
function neonH(str,x,y,H,track){const s=H/14,out=[];let cx=x;for(const ch of str){if(ch===' '){cx+=(6+track)*s;continue;}const G=GLY[ch];out.push([cx,y,s,G[1]]);cx+=(G[0]+track)*s;}return out;}
function neonV(str,cx,y,H,gap){const s=H/14,out=[];let cy=y;for(const ch of str){const G=GLY[ch];out.push([cx-G[0]*s/2,cy,s,G[1]]);cy+=H+gap;}return out;}
function neonDraw(g,items,col,lw){
  const all=w=>{for(const it of items){g.save();g.translate(it[0],it[1]);g.scale(it[2],it[2]);g.lineWidth=w/it[2];g.stroke(new Path2D(it[3]));g.restore();}};
  g.save();g.globalCompositeOperation='lighter';g.lineCap='round';g.lineJoin='round';
  g.strokeStyle=col;g.shadowColor=col;g.shadowBlur=lw*4.5;g.globalAlpha=.5;all(lw*1.5);
  g.shadowBlur=lw*1.6;g.globalAlpha=.9;all(lw);
  g.shadowBlur=0;g.globalAlpha=1;g.strokeStyle='rgba(255,255,255,.8)';all(lw*.4);g.restore();
}
const rrect=(x,y,w,h,r)=>'M'+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+h-r)+'Q'+(x+w)+' '+(y+h)+' '+(x+w-r)+' '+(y+h)+'H'+(x+r)+'Q'+x+' '+(y+h)+' '+x+' '+(y+h-r)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'Z';

const REG={};
REG.flat=req(8,8,(g,w,h)=>R_(g,0,0,w,h,'#fff'),'#fff');
REG.glow=req(128,128,(g,w,h)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'#fff');gr.addColorStop(.07,'rgb(226,226,226)');gr.addColorStop(.2,'rgb(128,128,128)');gr.addColorStop(.45,'rgb(58,58,58)');gr.addColorStop(.75,'rgb(18,18,18)');gr.addColorStop(1,'#000');g.fillStyle=gr;g.fillRect(0,0,w,h);},'#000');
REG.drops=req(256,256,(g,w,h)=>{const r=mulberry(31);for(let i=0;i<520;i++){const x=r()*w,y=r()*h,s=.7+r()*1.7,a=.25+r()*.7;
  if(r()<.3){g.fillStyle='rgba(255,255,255,'+(a*.14)+')';g.fillRect(x-.5,y,1,6+r()*22);}
  const gr=g.createRadialGradient(x,y,0,x,y,s*1.6);gr.addColorStop(0,'rgba(255,255,255,'+a+')');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(x-4,y-4,8,8);}},'#000');
REG.pole=req(32,128,(g,w,h)=>{R_(g,0,0,w,h,'#f4f0e6');g.lineWidth=11;for(let i=-3;i<9;i++){g.strokeStyle=i%2?'#c8202a':'#2440a8';g.beginPath();g.moveTo(-6,i*30);g.lineTo(w+6,i*30-40);g.stroke();}},'#f4f0e6');

/* --- upstairs windows */
function wframe(g,w,h){const c='#08080a';R_(g,0,0,w,4,c);R_(g,0,h-4,w,4,c);R_(g,0,0,4,h,c);R_(g,w-4,0,4,h,c);R_(g,0,h*.48,w,4,c);}
const WINP=[
 (g,w,h)=>{vgrad(g,0,0,w,h,'#0b1019','#05070a');g.fillStyle='rgba(130,150,180,.07)';g.beginPath();g.moveTo(0,h*.22);g.lineTo(w,0);g.lineTo(w,h*.24);g.lineTo(0,h*.5);g.fill();wframe(g,w,h);},
 (g,w,h)=>{vgrad(g,0,0,w,h,'#0c0b0b','#060505');for(let i=0;i<6;i++)R_(g,i*w/6,0,w/14,h,'rgba(60,50,40,.16)');wframe(g,w,h);},
 (g,w,h)=>{vgrad(g,0,0,w,h,'#ffd696','#eea458');for(let i=0;i<7;i++)R_(g,i*w/7,0,w/15,h,'rgba(150,70,20,.2)');R_(g,w*.43,0,w*.14,h,'rgba(255,242,205,.4)');wframe(g,w,h);},
 (g,w,h)=>{R_(g,0,0,w,h,'#f2c688');for(let y=0;y<h;y+=5)R_(g,0,y,w,2,'rgba(90,50,20,.45)');wframe(g,w,h);},
 (g,w,h)=>{R_(g,0,0,w,h,'#170e08');glow(g,w*.68,h*.76,w*.95,'255,168,80',.95);R_(g,w*.58,h*.68,w*.22,h*.08,'#ffdca4');wframe(g,w,h);},
 (g,w,h)=>{R_(g,0,0,w,h,'#090c13');glow(g,w*.3,h*.82,w*1.1,'110,150,255',.75);wframe(g,w,h);},
 (g,w,h)=>{vgrad(g,0,0,w,h*.55,'#f6dcae','#e9c48c');R_(g,0,h*.55,w,h*.45,'#241509');glow(g,w*.4,h*.8,w*.7,'255,170,90',.6);wframe(g,w,h);}
];
REG.win=WINP.map((p,i)=>req(64,112,p,i>1?'#b8824a':'#06080b'));

/* --- shop interiors, seen through the glass */
const BOOKC=['#6a2620','#243c58','#2c4c3c','#94743a','#b8ab8e','#4a3454','#784222','#1f2a33','#8a3428','#a89a74','#35565f','#5a2a1c','#3a3a2a'];
const INTP={
 diner(g,w,h){vgrad(g,0,0,w,h,'#dcb680','#a47444');R_(g,0,h*.3,w,h*.035,'#a8322c');
  for(let i=0;i<5;i++){const x=w*(.07+i*.18);R_(g,x,h*.06,w*.14,h*.18,'#2a2420');for(let j=0;j<4;j++)R_(g,x+w*.01,h*.085+j*h*.036,w*(.05+rnd()*.07),h*.012,'rgba(255,240,210,.55)');}
  R_(g,0,h*.5,w,h*.5,'#6d5a48');R_(g,0,h*.48,w,h*.03,'#dcd7ca');
  R_(g,w*.12,h*.34,w*.045,h*.14,'#c9c9c4');R_(g,w*.18,h*.37,w*.035,h*.11,'#b4b4b0');R_(g,w*.55,h*.36,w*.16,h*.12,'rgba(255,250,230,.85)');R_(g,w*.8,h*.35,w*.07,h*.13,'#9fb7bd');
  R_(g,0,h*.67,w,h*.33,'#8c2f2a');R_(g,0,h*.645,w,h*.03,'#e8e3d6');
  for(let i=0;i<9;i++){const x=w*(.06+i*.11);R_(g,x-w*.004,h*.8,w*.008,h*.2,'#bdbdb8');circ(g,x,h*.79,w*.026,'#a12a26',h*.03);}
  for(let i=0;i<6;i++)glow(g,w*(.09+i*.165),h*.03,h*.5,'255,226,172',.3);R_(g,w*.36,h*.34,w*.14,h*.13,'#fff0cf');R_(g,w*.37,h*.36,w*.12,h*.1,'#e9c98f');},
 coffee(g,w,h){vgrad(g,0,0,w,h,'#7d5838','#4a2f1c');R_(g,w*.05,h*.1,w*.3,h*.3,'#1d2420');
  for(let j=0;j<6;j++)R_(g,w*.07,h*(.14+j*.04),w*(.1+rnd()*.15),h*.012,'rgba(240,240,230,.5)');
  for(let i=0;i<2;i++){const y=h*(.24+i*.15);R_(g,w*.42,y,w*.52,h*.016,'#2a1a10');for(let j=0;j<14;j++){const bh=h*.07*(.5+rnd()*.5);R_(g,w*(.43+j*.036),y-bh,w*.022,bh,pick(['#d9c7a8','#b5653a','#e8e0d0','#7d8f6a','#c0a060']));}}
  R_(g,0,h*.62,w,h*.38,'#3b2416');R_(g,0,h*.6,w,h*.028,'#c9a877');R_(g,w*.62,h*.44,w*.14,h*.16,'#c8c8c4');R_(g,w*.2,h*.5,w*.1,h*.1,'rgba(255,240,210,.7)');
  for(let i=0;i<7;i++){const x=w*(.08+i*.14);glow(g,x,h*.15,h*.45,'255,190,110',.5);glow(g,x,h*.15,h*.06,'255,240,205',1);}},
 books(g,w,h){R_(g,0,0,w,h,'#5c3f27');
  for(let r=0;r<5;r++){const y0=h*(.05+r*.185),sh=h*.15;R_(g,0,y0+sh,w,h*.022,'#2e1d10');let x=w*.008;
   while(x<w*.99){const bw=w*(.006+rnd()*.011),bh=sh*(.7+rnd()*.3);if(rnd()<.05){x+=bw*2.5;continue;}R_(g,x,y0+sh-bh,Math.max(1,bw-.7),bh,pick(BOOKC));if(rnd()<.4)R_(g,x+bw*.2,y0+sh-bh*.8,Math.max(.6,bw*.45),bh*.08,'rgba(235,215,160,.7)');x+=bw;}}

const SAMPLES=(!TOUCH&&HDR)?4:0;
const rtOpt={type:RTTYPE,minFilter:T.LinearFilter,magFilter:T.LinearFilter,depthBuffer:false};
const mainRT=new T.WebGLRenderTarget(4,4,Object.assign({},rtOpt,{depthBuffer:true,samples:SAMPLES}));
const reflRT=new T.WebGLRenderTarget(4,4,Object.assign({},rtOpt,{depthBuffer:true,minFilter:T.LinearMipmapLinearFilter,generateMipmaps:true}));
U.uRefl.value=reflRT.texture;
const NB=5,bD=[],bU=[];for(let i=0;i<NB;i++){bD.push(new T.WebGLRenderTarget(4,4,rtOpt));if(i<NB-1)bU.push(new T.WebGLRenderTarget(4,4,rtOpt));}
const fsScene=new T.Scene(),fsCam=new T.OrthographicCamera(-1,1,1,-1,0,1),fsMesh=new T.Mesh(new T.PlaneGeometry(2,2),null);fsMesh.frustumCulled=false;fsScene.add(fsMesh);
const FSV='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
const fsm=(u,f)=>new T.ShaderMaterial({uniforms:u,vertexShader:FSV,fragmentShader:f,depthTest:false,depthWrite:false});
const mPre=fsm({t:{value:null},px:{value:new T.Vector2()}},`uniform sampler2D t;uniform vec2 px;varying vec2 vUv;
void main(){vec3 c=(texture2D(t,vUv+px*vec2(-1.,-1.)).rgb+texture2D(t,vUv+px*vec2(1.,-1.)).rgb+texture2D(t,vUv+px*vec2(-1.,1.)).rgb+texture2D(t,vUv+px*vec2(1.,1.)).rgb)*.25;
c=min(c,vec3(20.));float b=max(c.r,max(c.g,c.b));float k=clamp((b-0.5)/0.9,0.,1.);k=k*k*(3.-2.*k);gl_FragColor=vec4(c*k,1.);}`);
const mDown=fsm({t:{value:null},px:{value:new T.Vector2()}},`uniform sampler2D t;uniform vec2 px;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb*4.+texture2D(t,vUv+px*vec2(-1.,-1.)).rgb+texture2D(t,vUv+px*vec2(1.,-1.)).rgb+texture2D(t,vUv+px*vec2(-1.,1.)).rgb+texture2D(t,vUv+px*vec2(1.,1.)).rgb;gl_FragColor=vec4(c/8.,1.);}`);
const mUp=fsm({t:{value:null},c:{value:null},px:{value:new T.Vector2()}},`uniform sampler2D t,c;uniform vec2 px;varying vec2 vUv;
void main(){vec3 s=texture2D(t,vUv+px*vec2(-1.,0.)).rgb+texture2D(t,vUv+px*vec2(1.,0.)).rgb+texture2D(t,vUv+px*vec2(0.,-1.)).rgb+texture2D(t,vUv+px*vec2(0.,1.)).rgb
 +(texture2D(t,vUv+px*vec2(-.5,-.5)).rgb+texture2D(t,vUv+px*vec2(.5,-.5)).rgb+texture2D(t,vUv+px*vec2(-.5,.5)).rgb+texture2D(t,vUv+px*vec2(.5,.5)).rgb)*2.;
 gl_FragColor=vec4(s/12.+texture2D(c,vUv).rgb,1.);}`);
const mFinal=fsm({t:{value:null},b:{value:null},uTime:U.uTime,uRes:U.uRes},`uniform sampler2D t,b;uniform float uTime;uniform vec2 uRes;varying vec2 vUv;
void main(){vec3 c=texture2D(t,vUv).rgb+texture2D(b,vUv).rgb*0.26;
 vec2 q=vUv-0.5;c*=1.0-dot(q,q)*0.75;
 c=1.0-exp(-c*1.5);
 c=pow(c,vec3(1./2.2));
 c=mix(c,c*c*(3.-2.*c),0.3);
 float l=dot(c,vec3(.299,.587,.114));c=mix(vec3(l),c,1.08);
 vec3 p3=fract(vec3(vUv.xyx*uRes.xyx)*.1031+fract(uTime)*7.31);p3+=dot(p3,p3.yzx+33.33);float n=fract((p3.x+p3.y)*p3.z);
 c+=(n-0.5)*0.022;gl_FragColor=vec4(c,1.);}`);
function pass(m,target){fsMesh.material=m;renderer.setRenderTarget(target);renderer.render(fsScene,fsCam);}

let quality=1,RW=4,RH=4;
function resize(){
  const w=Math.max(1,innerWidth),h=Math.max(1,innerHeight),dpr=Math.min(window.devicePixelRatio||1,2);
  let W=w*dpr,H=h*dpr;const s=Math.min(1,Math.sqrt((TOUCH?1.5e6:2.8e6)/(W*H)))*quality;W=Math.max(8,Math.round(W*s));H=Math.max(8,Math.round(H*s));RW=W;RH=H;
  renderer.setSize(W,H,false);
  camera.aspect=w/h;camera.fov=(w/h<.8?74:w/h<1.25?64:56)*zoom;camera.updateProjectionMatrix();
  mainRT.setSize(W,H);reflRT.setSize(Math.max(4,W>>1),Math.max(4,H>>1));
  for(let i=0;i<NB;i++){const bw=Math.max(2,W>>(i+1)),bh=Math.max(2,H>>(i+1));bD[i].setSize(bw,bh);if(i<NB-1)bU[i].setSize(bw,bh);}
  U.uRes.value.set(W,H);
}
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

const _f=new T.Vector3(),_u=new T.Vector3();
function updateRefl(){
  const cp=camera.position;_f.set(0,0,-1).applyQuaternion(camera.quaternion);_u.set(0,1,0).applyQuaternion(camera.quaternion);
  reflCam.position.set(cp.x,-cp.y,cp.z);reflCam.up.set(_u.x,-_u.y,_u.z);reflCam.lookAt(cp.x+_f.x,-cp.y-_f.y,cp.z+_f.z);
  reflCam.projectionMatrix.copy(camera.projectionMatrix);reflCam.projectionMatrixInverse.copy(camera.projectionMatrixInverse);reflCam.updateMatrixWorld(true);
  texMat.set(.5,0,0,.5,0,.5,0,.5,0,0,.5,.5,0,0,0,1).multiply(reflCam.projectionMatrix).multiply(reflCam.matrixWorldInverse);
}

/* ---------------------------------------------------------------- sound (off until asked for) */
let actx=null,master=null,carGain=null,sndOn=false;
const sndBtn=document.getElementById('snd');
function startAudio(){
  actx=new (window.AudioContext||window.webkitAudioContext)();const sr=actx.sampleRate,buf=actx.createBuffer(1,sr*3,sr),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  master=actx.createGain();master.gain.value=0;master.connect(actx.destination);
  const chain=(type,freq,q,gain)=>{const s=actx.createBufferSource();s.buffer=buf;s.loop=true;const f=actx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;const g=actx.createGain();g.gain.value=gain;s.connect(f);f.connect(g);g.connect(master);s.start(0,Math.random()*2);return g;};
  chain('highpass',2600,.5,.07);chain('bandpass',900,.35,.16);chain('lowpass',220,.5,.3);carGain=chain('lowpass',520,.6,0);
}
sndBtn.addEventListener('click',()=>{if(!actx)startAudio();if(actx.state==='suspended')actx.resume();sndOn=!sndOn;master.gain.cancelScheduledValues(actx.currentTime);master.gain.linearRampToValueAtTime(sndOn?.9:0,actx.currentTime+1.2);sndBtn.textContent='rain sound: '+(sndOn?'on':'off');});

/* ---------------------------------------------------------------- loop */
let time=0,last=performance.now(),ema=16,frames=0;
if(OPTS.warp){for(let i=0;i<OPTS.warp*20;i++)stepCars(.05);time=OPTS.warp;}
window.__ms={setView(y,p){yaw=y;pitch=p;touched=true;},get fps(){return 1000/ema;},get size(){return [RW,RH,quality];}};
function frame(now){
  requestAnimationFrame(frame);
  const raw=(now-last)/1000;last=now;const dt=Math.min(Math.max(raw,0),.1);
  if(!OPTS.freeze){time+=dt;stepCars(dt);}else stepCars(0);
  U.uTime.value=time;
  if(!dragging){yaw+=vyaw*dt;pitch=Math.max(-.62,Math.min(.95,pitch+vpitch*dt));const dm=Math.exp(-dt*4.5);vyaw*=dm;vpitch*=dm;}
  const idle=touched||OPTS.freeze?0:Math.sin(time*.13)*.05;
  camera.rotation.set(pitch+Math.sin(time*.5)*.0015,yaw+idle,0);camera.updateMatrixWorld(true);
  updateRefl();
  ground.visible=false;rain.visible=false;splash.visible=false;
  renderer.setRenderTarget(reflRT);renderer.render(scene,reflCam);
  ground.visible=true;rain.visible=true;splash.visible=true;
  renderer.setRenderTarget(mainRT);renderer.render(scene,camera);
  mPre.uniforms.t.value=mainRT.texture;mPre.uniforms.px.value.set(1/RW,1/RH);pass(mPre,bD[0]);
  for(let i=1;i<NB;i++){mDown.uniforms.t.value=bD[i-1].texture;mDown.uniforms.px.value.set(1/bD[i-1].width,1/bD[i-1].height);pass(mDown,bD[i]);}
  let src=bD[NB-1];
  for(let i=NB-2;i>=0;i--){mUp.uniforms.t.value=src.texture;mUp.uniforms.c.value=bD[i].texture;mUp.uniforms.px.value.set(1/src.width,1/src.height);pass(mUp,bU[i]);src=bU[i];}
  mFinal.uniforms.t.value=mainRT.texture;mFinal.uniforms.b.value=src.texture;pass(mFinal,null);
  if(carGain&&sndOn){let g=0;for(const c of cars)if(c.wait<=0){const d=Math.hypot(c.x-camera.position.x,c.z-camera.position.z);g=Math.max(g,.6/(1+d*d/70));}carGain.gain.value+=(g-carGain.gain.value)*.1;}
  // keep it smooth: drop internal resolution a step if frames run long
  if(raw>0&&raw<.5)ema+=(raw*1000-ema)*.06;frames++;
  if(!OPTS.fixed&&frames>80&&frames%45===0&&ema>26&&quality>.5){quality=Math.max(.5,quality*.84);ema=18;resize();}
}
renderer.setClearColor(new T.Color().setRGB(.017,.019,.028),1);
requestAnimationFrame(t=>{last=t;frame(t);canvas.classList.add('on');setTimeout(()=>{if(!touched)hint.classList.add('on');},1400);setTimeout(()=>hint.classList.remove('on'),9000);});
document.addEventListener('visibilitychange',()=>{last=performance.now();});
})();
</script>
</body>
</html>
