<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Main Street, 11:42 PM, Rain</title>
<style>
  html,body{margin:0;height:100%;background:#05070a;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
  canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
  canvas:active{cursor:grabbing}
  #hint{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;color:#d8cdb8;
    font:13px/1.4 Georgia,"Times New Roman",serif;letter-spacing:.14em;text-transform:uppercase;opacity:.0;transition:opacity 1.6s;pointer-events:none;text-shadow:0 1px 8px #000}
  #hint b{font-weight:normal;color:#ff9db8}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;color:#ccc;font:16px Georgia,serif;padding:24px;text-align:center}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Main Street &middot; <b>drag to look around</b></div>
<div id="err">This scene needs WebGL. Try a newer browser.</div>
<script>
(function(){
'use strict';
const TAU = Math.PI*2;
const canvas = document.getElementById('c');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance', alpha:false, stencil:false});
}catch(e){ document.getElementById('err').style.display='flex'; return; }
const isMobile = Math.min(innerWidth, innerHeight) < 700 || /Mobi|Android|iPhone|iPad/.test(navigator.userAgent);
const gl2 = renderer.capabilities.isWebGL2;
const hasHalf = renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float');
const RTTYPE = hasHalf ? THREE.HalfFloatType : THREE.UnsignedByteType;
renderer.setClearColor(0x0b0d12, 1);

/* ---------------------------------------------------------------- utils */
const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const mkc = (w,h) => { const c = document.createElement('canvas'); c.width = Math.max(2,Math.round(w)); c.height = Math.max(2,Math.round(h)); return c; };
const rgb = (c,k=1,a=1) => `rgba(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0},${a})`;
const lin = v => Math.pow(v/255, 2.2);

/* ------------------------------------------------------- shared uniforms */
const NL = 24;
const U = {
  uTime:{value:0}, uSkip:{value:0},
  uLP:{value:Array.from({length:NL},()=>new THREE.Vector4(0,-50,0,1))},
  uLC:{value:Array.from({length:NL},()=>new THREE.Vector3(0,0,0))},
  uAmb:{value:new THREE.Vector3(0.012,0.017,0.032)},
  uFogCol:{value:new THREE.Vector3(0.024,0.029,0.042)},
  uFogD:{value:0.0125},
};
const FOGC = new THREE.Color(0.024,0.029,0.042);

const GL_COMMON = `
#define NL 24
uniform vec4 uLP[NL]; uniform vec3 uLC[NL];
uniform vec3 uAmb; uniform vec3 uFogCol; uniform float uFogD; uniform float uTime;
const vec3 LAMP = vec3(1.0,0.60,0.28)*3.0;
float hash12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 hash22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1.,0.)),f.x),mix(hash12(i+vec2(0.,1.)),hash12(i+vec2(1.,1.)),f.x),f.y); }
float fbm(vec2 p){ float a=.5,s=0.; for(int i=0;i<4;i++){ s+=a*vnoise(p); p=p*2.03+vec2(17.1,9.2); a*=.5; } return s; }
uniform float uSkip;
vec3 lightAt(vec3 p, vec3 n, int cnt){
  vec3 a=vec3(0.);
  for(int i=0;i<NL;i++){ if(i>=cnt) break; if(float(i)<uSkip) continue;
    vec3 d=uLP[i].xyz-p; float d2=dot(d,d); float r=uLP[i].w;
    float att=1./(1.+d2/(r*r));
    float nl=dot(n,d*inversesqrt(d2+1e-4)); nl=max(nl,0.)*0.75+0.25;
    a+=uLC[i]*att*nl; }
  return a; }
vec3 lampLight(vec3 p, vec3 n){
  vec3 a=vec3(0.);
  for(int s=0;s<2;s++){
    float side = s==0 ? -1. : 1.; float z0 = s==0 ? 3. : -5.;
    float k0=floor((p.z-z0)/16.+.5);
    for(int j=-1;j<=1;j++){
      vec3 lp=vec3(side*5.15,5.2,z0+(k0+float(j))*16.);
      vec3 d=lp-p; float d2=dot(d,d);
      float att=1./(1.+d2/20.);
      float nl=dot(n,d*inversesqrt(d2+1e-4)); nl=max(nl,0.)*0.8+0.2;
      a+=LAMP*att*nl; } }
  return a; }
vec3 specLights(vec3 p, vec3 R, float shin){
  vec3 a=vec3(0.);
  for(int s=0;s<2;s++){
    float side = s==0 ? -1. : 1.; float z0 = s==0 ? 3. : -5.;
    float k0=floor((p.z-z0)/16.+.5);
    for(int j=-1;j<=1;j++){
      vec3 lp=vec3(side*5.15,5.2,z0+(k0+float(j))*16.);
      vec3 d=lp-p; float d2=dot(d,d);
      a+=LAMP*pow(max(dot(R,d*inversesqrt(d2)),0.),shin)/(1.+d2/60.); } }
  for(int i=0;i<8;i++){
    vec3 d=uLP[i].xyz-p; float d2=dot(d,d);
    a+=uLC[i]*pow(max(dot(R,d*inversesqrt(d2+1e-4)),0.),shin)/(1.+d2/30.); }
  return a; }
vec3 applyFog(vec3 c, float d){ float f=1.-exp(-uFogD*uFogD*d*d); return mix(c,uFogCol,f); }
`;

function shader(vs, fs, extra={}, opts={}){
  return new THREE.ShaderMaterial(Object.assign({
    uniforms: Object.assign({}, U, extra),
    vertexShader: vs, fragmentShader: fs
  }, opts));
}

const VS_STD = `
varying vec3 vW; varying vec3 vN; varying vec2 vUv;
void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vN=normalize(mat3(modelMatrix)*normal); vUv=uv; gl_Position=projectionMatrix*viewMatrix*w; }`;

/* ---- lit material for props (poles, cars, furniture) */
const FS_LIT = GL_COMMON + `
varying vec3 vW; varying vec3 vN; varying vec2 vUv;
uniform vec3 uCol; uniform float uSpec; uniform float uShin;
void main(){
  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
  vec3 V=normalize(cameraPosition-vW);
  vec3 lit=uAmb+lightAt(vW,N,8)+lampLight(vW,N);
  vec3 col=uCol*lit;
  if(uSpec>0.){
    vec3 R=reflect(-V,N);
    float fr=0.04+0.96*pow(1.-max(dot(N,V),0.),5.);
    vec3 env=mix(uFogCol*1.6,vec3(0.01,0.014,0.025),clamp(R.y,0.,1.));
    col+=uSpec*(fr*3.0+0.12)*env + uSpec*specLights(vW,R,uShin)*(0.12+fr);
  }
  col=applyFog(col,length(vW-cameraPosition));
  gl_FragColor=vec4(col,1.);
}`;
function litMat(r,g,b,spec=0,shin=40,skip=0){
  return shader(VS_STD, FS_LIT, {uCol:{value:new THREE.Vector3(r,g,b)}, uSpec:{value:spec}, uShin:{value:shin}, uSkip:{value:skip}});
}
const litHex = (hex,spec,shin) => { const c=new THREE.Color(hex); return litMat(c.r,c.g,c.b,spec,shin); };

/* ---- facade material: albedo texture + emissive window boost + light bleed map */
const FS_FACADE = GL_COMMON + `
varying vec3 vW; varying vec3 vN; varying vec2 vUv;
uniform sampler2D tMap; uniform sampler2D tGlow; uniform float uEmit;
void main(){
  vec3 alb=texture2D(tMap,vUv).rgb;
  vec3 N=normalize(vN); if(!gl_FrontFacing) N=-N;
  float mx=max(alb.r,max(alb.g,alb.b));
  float m=smoothstep(0.15,0.55,mx)*step(0.01,uEmit);
  vec3 g=texture2D(tGlow,vUv).rgb;
  vec3 lit=uAmb+lightAt(vW,N,8)+lampLight(vW,N);
  vec3 col=alb*lit*(1.-m)+alb*uEmit*m;
  col+=g*(0.12+alb*4.0)*1.6;
  col=applyFog(col,length(vW-cameraPosition));
  gl_FragColor=vec4(col,1.);
}`;
const BLACK = (()=>{ const c=mkc(2,2); const x=c.getContext('2d'); x.fillStyle='#000'; x.fillRect(0,0,2,2); const t=new THREE.CanvasTexture(c); return t; })();
function facadeMat(map, glow, emit, side){
  return shader(VS_STD, FS_FACADE, {tMap:{value:map}, tGlow:{value:glow||BLACK}, uEmit:{value:emit}}, side?{side}:{});
}
function canvasTex(cv, srgb=true, aniso=4){
  const t = new THREE.CanvasTexture(cv);
  if(srgb) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = aniso; t.wrapS = t.wrapT = THREE.ClampToEdgeWrapping;
  t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter;
  return t;
}

/* ---------------------------------------------------------------- scene */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(FOGC, U.uFogD.value);
const camera = new THREE.PerspectiveCamera(66, 1, 0.08, 420);
camera.rotation.order = 'YXZ';
const reflCam = new THREE.PerspectiveCamera(66, 1, 0.08, 420);
const CAM = {x:-7.1, y:1.62, z:6.5};
let yaw = 0.62, pitch = -0.035, tyaw = yaw, tpitch = pitch;

/* ----------------------------------------------------- glow sprite texture */
const glowTex = (()=>{ const c=mkc(128,128), x=c.getContext('2d'); const g=x.createRadialGradient(64,64,0,64,64,64);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.12,'rgba(255,255,255,.55)'); g.addColorStop(.35,'rgba(255,255,255,.13)'); g.addColorStop(.7,'rgba(255,255,255,.03)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c); })();
function glowSprite(col, size, opacity=1){
  const m = new THREE.SpriteMaterial({map:glowTex, color:new THREE.Color(col[0],col[1],col[2]), blending:THREE.AdditiveBlending, depthWrite:false, transparent:true, opacity, fog:true});
  const s = new THREE.Sprite(m); s.scale.set(size,size,1); return s;
}

/* ================================================================ FACADE PAINTER */
const SCRIPT = '"Brush Script MT","Segoe Script","Snell Roundhand","Apple Chancery",cursive';
const BLOCK  = '"Arial Black","Impact","Helvetica Neue",Arial,sans-serif';
const SERIF  = 'Georgia,"Times New Roman",serif';

function text(c,str,x,y,size,font,fill,align,stroke,lw){
  c.save(); c.translate(x,y); const s=size/100; c.scale(s,s); c.font=`100px ${font}`; c.textAlign=align||'center'; c.textBaseline='alphabetic';
  if(fill){ c.fillStyle=fill; c.fillText(str,0,0); }
  if(stroke){ c.strokeStyle=stroke; c.lineWidth=lw/s; c.lineJoin='round'; c.strokeText(str,0,0); }
  c.restore();
}
function fitSize(c,str,font,maxW,maxS){ c.save(); c.font=`100px ${font}`; const w=c.measureText(str).width/100; c.restore(); return Math.min(maxS, maxW/Math.max(w,0.01)); }

function neonText(c,gc,str,x,y,size,font,col,ppm){
  c.save();
  c.shadowColor = rgb(col,1,0.9); c.shadowBlur = Math.max(6,size*ppm*0.28);
  text(c,str,x,y,size,font,null,'center',rgb(col),size*0.075);
  text(c,str,x,y,size,font,null,'center',rgb(col),size*0.075);
  c.shadowBlur = 0;
  const core=[col[0]*0.4+150,col[1]*0.4+150,col[2]*0.4+150];
  text(c,str,x,y,size,font,null,'center',rgb(core),size*0.028);
  c.restore();
  if(gc){ gc.save(); gc.globalCompositeOperation='lighter';
    for(let k=0;k<3;k++) text(gc,str,x,y,size,font,null,'center',rgb(col,1,0.05+0.02*k),size*(0.35+0.4*k));
    gc.restore(); }
}

const SHOPS = {
  diner:     {name:'Diner',   font:SCRIPT, neon:[255,70,130],  open:[255,70,70],   blade:'EAT', bcol:[255,90,110], panel:[24,14,18], tone:[255,205,140], k:1.0, awn:[150,36,36]},
  bar:       {name:'TAVERN',  font:BLOCK,  neon:[70,150,255],  open:[255,60,60],   blade:'BAR', bcol:[80,160,255], panel:[16,18,26], tone:[255,150,80],  k:0.62},
  books:     {name:'PAGE & SPINE', sub:'BOOKS', font:SERIF, paint:[104,92,60], panel:[26,42,34], tone:[255,190,110], k:0.9, awn:[30,70,55]},
  bakery:    {name:'Rose Bakery', font:SCRIPT, neon:[255,150,190], open:[255,120,160], blade:'BAKERY', bcol:[255,140,190], panel:[36,22,28], tone:[255,225,190], k:1.0, awn:[200,110,140]},
  hardware:  {name:'HOLLIS HARDWARE', font:BLOCK, paint:[100,92,56], panel:[26,40,32], tone:[222,236,205], k:0.78},
  pizza:     {name:"TONY'S PIZZA", font:BLOCK, neon:[90,255,150], open:[255,70,60], blade:'PIZZA', bcol:[100,255,160], panel:[14,22,18], tone:[255,190,120], k:0.95, awn:[40,110,60]},
  laundromat:{name:'SUDS LAUNDRY', font:BLOCK, neon:[110,220,255], open:[110,220,255], panel:[12,20,30], tone:[215,235,255], k:1.0},
  barber:    {name:'BARBER',  font:SERIF,  neon:[255,70,70],   blade:'BARBER', bcol:[255,90,90], panel:[14,18,30], tone:[255,232,200], k:0.95, awn:[40,60,110]},
  vacant:    {name:'AVAILABLE', font:BLOCK, paint:[96,90,80], panel:[22,22,24], tone:null, k:0},
  florist:   {name:'Bloom & Co.', font:SCRIPT, neon:[255,120,220], panel:[22,26,24], tone:[255,215,225], k:0.95, awn:[90,140,90]},
  pharmacy:  {name:'PHARMACY', font:BLOCK, neon:[70,255,130], cross:true, panel:[16,22,20], tone:[232,250,240], k:1.0},
  cafe:      {name:'Corner Cafe', font:SCRIPT, neon:[255,190,90], open:[255,190,90], blade:'CAFE', bcol:[255,200,100], panel:[28,20,14], tone:[255,205,150], k:0.95, awn:[110,70,40]},
};

function paintBuilding(spec){
  const {w,h,ppm,seed,key,brick,ghost} = spec; const S = SHOPS[key]; const R = rng(seed);
  const cv = mkc(w*ppm, h*ppm), g = cv.getContext('2d'); g.scale(cv.width/w, cv.height/h);
  const GP = 6; const gcv = mkc(w*GP, h*GP), gg = gcv.getContext('2d'); gg.fillStyle='#000'; gg.fillRect(0,0,gcv.width,gcv.height); gg.scale(gcv.width/w, gcv.height/h);
  const B = (c,x,yb,ww,hh,f)=>{ c.fillStyle=f; c.fillRect(x,h-yb-hh,ww,hh); };
  const glowRect = (x,yb,ww,hh,col,amt)=>{ gg.save(); gg.globalCompositeOperation='lighter';
    for(let i=0;i<7;i++){ const e=i*0.22; gg.fillStyle=rgb(col,1,amt*(1-i/8)); gg.fillRect(x-e,h-yb-hh-e,ww+2*e,hh+2*e); } gg.restore(); };
  const stone=[98,92,84], stoneDk=[70,66,62];

  // ---- brick wall
  g.fillStyle = 'rgb(62,56,52)'; g.fillRect(0,0,w,h);
  const bh=0.077, bl=0.225;
  for(let r=0;r<Math.ceil(h/bh);r++){
    const off=(r%2)*bl/2;
    for(let x=-off;x<w;x+=bl){
      const v=0.72+R()*0.5; const dk=R()<0.06?0.7:1;
      g.fillStyle=`rgb(${brick[0]*v*dk|0},${brick[1]*v*dk|0},${brick[2]*v*dk|0})`;
      g.fillRect(x+0.007,r*bh+0.007,bl-0.014,bh-0.012);
    }
  }
  // rain staining and wet base
  for(let i=0;i<46;i++){
    const x=R()*w, y=R()*h*0.85, len=0.8+R()*3.2, wd=0.03+R()*0.1;
    const gr=g.createLinearGradient(0,y,0,y+len); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(0.3,`rgba(0,0,0,${0.1+R()*0.14})`); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(x,y,wd,len);
  }
  const wet=g.createLinearGradient(0,h-2.2,0,h); wet.addColorStop(0,'rgba(0,0,0,0)'); wet.addColorStop(1,'rgba(4,6,10,0.5)'); g.fillStyle=wet; g.fillRect(0,h-2.2,w,2.2);
  // ghost sign
  if(ghost){ g.save(); g.globalAlpha=0.22; text(g,ghost,w/2,h-6.3,Math.min(1.3,fitSize(g,ghost,SERIF,w*0.8,1.3)),SERIF,'rgb(120,112,100)','center'); g.restore(); }

  // ---- upper floors
  const gh=4.0, nfl=Math.max(1,Math.floor((h-gh-0.9)/3.1)), nwin=Math.max(2,Math.round((w-0.6)/2.15));
  const wwid=1.05, whei=1.75;
  for(let f=0;f<nfl;f++){
    const yb=gh+0.78+f*3.1;
    for(let k=0;k<nwin;k++){
      const cx=(k+0.5)*w/nwin, x=cx-wwid/2;
      B(g,x-0.14,yb+whei,wwid+0.28,0.17,rgb(stone,0.95)); // lintel
      B(g,x-0.1,yb-0.1,wwid+0.2,0.1,rgb(stone,0.8));       // sill
      B(g,x-0.05,yb-0.03,wwid+0.1,whei+0.06,'rgb(54,50,46)'); // frame
      const lit=R()<0.42; const tones=[[255,196,112],[255,224,164],[255,172,92],[255,205,140],[170,205,255]];
      const tn=R()<0.14?tones[4]:tones[R()*4|0];
      g.save(); g.beginPath(); g.rect(x,h-yb-whei,wwid,whei); g.clip();
      if(lit){
        const gr=g.createLinearGradient(0,h-yb-whei,0,h-yb); gr.addColorStop(0,rgb(tn,1)); gr.addColorStop(1,rgb(tn,0.62)); g.fillStyle=gr; g.fillRect(x,h-yb-whei,wwid,whei);
        // curtains / interior
        if(R()<0.7){ g.fillStyle=rgb([150,70,60],1,0.9); g.fillRect(x,h-yb-whei,0.22,whei); g.fillRect(x+wwid-0.2,h-yb-whei,0.2,whei); }
        if(R()<0.5){ g.fillStyle='rgba(30,22,20,0.85)'; g.beginPath(); g.ellipse(x+wwid*(0.3+R()*0.4),h-yb-0.35,0.18,0.3,0,0,TAU); g.fill(); }
        if(R()<0.35){ g.fillStyle='rgba(30,22,20,0.8)'; g.fillRect(x+wwid*0.55,h-yb-1.0,0.32,1.0); g.beginPath(); g.arc(x+wwid*0.55+0.16,h-yb-1.12,0.12,0,TAU); g.fill(); }
        glowRect(x,yb,wwid,whei,tn,0.045);
      } else {
        const gr=g.createLinearGradient(x,h-yb-whei,x+wwid,h-yb); gr.addColorStop(0,'rgb(18,24,34)'); gr.addColorStop(0.5,'rgb(30,38,52)'); gr.addColorStop(1,'rgb(14,18,26)'); g.fillStyle=gr; g.fillRect(x,h-yb-whei,wwid,whei);
      }
      g.restore();
      // mullions
      B(g,x+wwid/2-0.025,yb,0.05,whei,'rgb(46,42,40)'); B(g,x,yb+whei*0.52,wwid,0.045,'rgb(46,42,40)');
    }
  }
  // cornice
  B(g,0,h-0.62,w,0.62,rgb(stone,0.9)); B(g,-0.05,h-0.16,w+0.1,0.16,rgb(stone,1.1));
  for(let x=0.1;x<w;x+=0.3) B(g,x,h-0.5,0.14,0.2,rgb(stoneDk,1));
  B(g,0,h-0.64,w,0.04,'rgb(30,28,28)');

  // ---- storefront
  const sh = S;
  B(g,0,0,0.5,gh,rgb(stoneDk,1)); B(g,w-0.5,0,0.5,gh,rgb(stoneDk,1));
  B(g,0,gh-0.03,w,0.06,'rgb(28,26,26)');
  const wx0=0.55, wx1=w-0.55, doorW=1.05, doorLeft=R()<0.5;
  const doorX = doorLeft ? wx0 : wx1-doorW;
  const winX = doorLeft ? wx0+doorW+0.14 : wx0, winW = (wx1-wx0)-doorW-0.14;
  // bulkhead
  B(g,winX-0.05,0,winW+0.1,0.82,'rgb(34,30,30)');
  for(let x=winX+0.15;x<winX+winW-0.4;x+=0.7){ g.strokeStyle='rgba(120,110,100,0.25)'; g.lineWidth=0.02; g.strokeRect(x,h-0.7,0.55,0.5); }
  // glass interior
  const wy=0.82, wh=2.2;
  if(sh.tone){
    interior(g,gg,h,key,winX,wy,winW,wh,sh.tone,sh.k,R);
    glowRect(winX,wy,winW,wh,sh.tone,0.05*sh.k+0.02);
  } else interior(g,gg,h,key,winX,wy,winW,wh,[40,44,52],0,R);
  // door
  B(g,doorX-0.05,0,doorW+0.1,3.05,'rgb(28,26,28)');

const VS_GROUND = `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`;
const FS_GROUND = GL_COMMON + `
varying vec3 vW;
uniform sampler2D tRefl; uniform mat4 uReflVP; uniform vec3 uPud;
vec3 ripples(vec2 p){
  const float CS=0.8;
  vec2 cell=floor(p/CS); vec2 g=vec2(0.); float ring=0.;
  for(int j=-1;j<=1;j++){ for(int i=-1;i<=1;i++){
    vec2 c=cell+vec2(float(i),float(j));
    vec2 h=hash22(c); float ph=hash12(c+11.3);
    float per=0.75+ph*0.9;
    float tt=uTime/per+ph*7.0; float age=fract(tt);
    vec2 ctr=(c+0.15+0.7*h)*CS;
    vec2 d=p-ctr; float dist=length(d)+1e-4;
    float x=dist-age*0.42;
    float amp=(1.-age); amp*=amp;
    float w=sin(x*38.)*exp(-x*x*420.)*amp;
    w*=step(0.22,hash12(c+floor(tt)*3.7));
    g+=d/dist*w; ring+=abs(w); } }
  return vec3(g,ring);
}
void main(){
  vec3 p=vW; vec2 xz=p.xz; float ax=abs(xz.x);
  float n1=fbm(xz*2.5), n2=fbm(xz*14.), n3=vnoise(xz*80.);
  float fw=fwidth(xz.y)+fwidth(xz.x);
  // ---- zones
  float isRoad=1.-smoothstep(5.4,5.46,ax);
  float isWalk=smoothstep(5.55,5.62,ax)*(1.-smoothstep(9.95,10.02,ax));
  float curb=smoothstep(5.4,5.46,ax)*(1.-smoothstep(5.55,5.62,ax));
  float beyond=smoothstep(9.95,10.02,ax);
  // ---- albedo
  vec3 alb=vec3(0.052)*(0.62+0.75*n1)*(0.82+0.36*n3);
  alb*=1.-0.28*smoothstep(5.0,5.4,ax);                                  // gutter grime
  float track=smoothstep(0.32,0.0,abs(abs(ax-2.75)-0.78));               // tyre tracks
  alb*=1.-0.22*track;
  float pch=step(0.66,vnoise(floor(xz*vec2(0.42,0.2))*1.7)); alb*=mix(1.,0.62,pch);
  float crack=smoothstep(0.03,0.0,abs(vnoise(xz*vec2(2.3,0.9))-0.5))*0.4; alb*=1.-crack*0.5;
  // markings
  float yl=1.-smoothstep(0.034,0.05,abs(ax-0.11)); alb=mix(alb,vec3(0.34,0.25,0.02),yl*(0.55+0.4*n2));
  float edge=1.-smoothstep(0.03,0.05,abs(ax-3.62)); alb=mix(alb,vec3(0.3),edge*0.8*(0.5+0.5*n2));
  float cw=step(-16.5,xz.y)*step(xz.y,-13.5)*step(ax,5.3)*step(fract(xz.x/0.95),0.5); alb=mix(alb,vec3(0.36),cw*(0.5+0.5*n2));
  float stopl=step(-12.9,xz.y)*step(xz.y,-12.6)*step(0.3,xz.x)*step(xz.x,5.3); alb=mix(alb,vec3(0.34),stopl*0.8);
  float mh=length(xz-vec2(1.6,-4.5)); alb=mix(alb,vec3(0.02),smoothstep(0.42,0.38,mh)); alb+=vec3(0.025)*smoothstep(0.04,0.0,abs(mh-0.4));
  // concrete sidewalk
  vec3 conc=vec3(0.10,0.097,0.092)*(0.7+0.6*n1)*(0.85+0.3*n3);
  float jz=abs(fract(xz.y/1.8+.5)-.5)*1.8, jx=abs(fract((ax-5.6)/1.75+.5)-.5)*1.75;
  float joint=1.-smoothstep(0.008,0.02+fw,min(jz,jx)); conc*=1.-0.65*joint;
  alb=mix(alb,conc,isWalk); alb=mix(alb,vec3(0.2,0.19,0.18)*(0.8+0.4*n1),curb*1.);
  alb=mix(alb,vec3(0.02),beyond);
  // ---- puddles
  float pm=fbm(xz*vec2(0.26,0.2)+3.1);
  float pud=smoothstep(0.50,0.60,pm);
  pud*=mix(1.,1.0,isWalk);
  float fp=length(xz-uPud.xy); pud=clamp(pud+exp(-fp*fp/(uPud.z*uPud.z)),0.,1.);
  pud*=1.-beyond;
  float wetN=0.4+0.6*pud;
  alb*=mix(1.,0.5,0.7+0.3*pud);
  // ---- ripples
  vec3 rp=ripples(xz);
  vec2 rg=rp.xy*(0.28+0.72*pud);
  vec3 N=normalize(vec3(-rg.x*0.5,1.,-rg.y*0.5));
  // ---- light
  vec3 V=normalize(cameraPosition-p);
  float dist=length(cameraPosition-p);
  vec3 lit=uAmb+(lightAt(p,vec3(0.,1.,0.),NL)+lampLight(p,vec3(0.,1.,0.)));
  vec3 col=alb*lit;
  // ---- reflection
  vec4 cl=uReflVP*vec4(p,1.);
  vec2 uv=cl.xy/cl.w*0.5+0.5;
  float cosv=max(dot(N,V),0.);
  float F=0.02+0.98*pow(1.-cosv,5.);
  float rough=(1.-pud)*(1.-0.5*isWalk);
  vec2 off=rg*0.03+(vec2(n2,fbm(xz*14.+9.))-0.5)*0.006*(1.+rough*2.);
  float spread=mix(0.0035,0.0007,pud)*(0.5+1.2*rough)*clamp(8./dist+0.4,0.4,2.2);
  vec3 rf=vec3(0.); float ws=0.;
  float jit=hash12(gl_FragCoord.xy);
  for(int i=-TAPSN;i<=TAPSN;i++){
    float fi=float(i)+jit-0.5; float w=exp(-fi*fi*0.09);
    vec2 uo=vec2((hash12(vec2(float(i),jit))-0.5)*spread*1.6, fi*spread*(1.+rough*2.2));
    rf+=texture2D(tRefl,clamp(uv+off+uo,0.001,0.999)).rgb*w; ws+=w; }
  rf/=ws;
  float R=mix(0.11+0.8*F, 0.42+0.58*F, pud);
  R*=mix(1.,0.45,isWalk); R*=1.-beyond; R+=0.1*track*(1.-pud)*F;
  col=col*(1.-0.6*R)+rf*R*vec3(0.92,0.96,1.0);
  // splash sparkle from rain hits near lit areas
  col+=rp.z*0.09*(lit+0.1)*(0.3+0.7*pud)*step(0.02,pud);
  col=applyFog(col,dist);
  gl_FragColor=vec4(col,1.);
}`;

const BRICKS = [[104,50,38],[92,44,36],[108,70,50],[84,62,56],[112,88,62],[78,42,38],[100,56,44]];
const GHOSTS = ['FEED & SEED','DRY GOODS','HOTEL','CIGARS','MERCANTILE'];

const bldgs = []; const texCache = [];
const spillCands = [], neonCands = [];

let seedC = 11;

function buildSide(side, list){
  let z = 26; let idx = 0;
  const makeOne = (key,w,h,near,ppm)=>{
    seedC += 7;
    const br = BRICKS[(seedC*3)%BRICKS.length];
    const painted = paintBuilding({w,h,ppm,seed:seedC,key,brick:br,ghost:(seedC%3===0&&key!=='diner')?GHOSTS[seedC%GHOSTS.length]:null});
    const alb = canvasTex(painted.albedo,true,8); const glw = canvasTex(painted.glow,false,2);
    return {key,w:painted.w,h:painted.h,alb,glw};
  };
  const place = (T, zTop)=>{
    const {w,h,key} = T; const zc = zTop - w/2; const x = side*10;
    const grp = new THREE.Group(); grp.position.set(x,0,zc); scene.add(grp);
    const fm = facadeMat(T.alb,T.glw,2.4);
    const pl = new THREE.Mesh(new THREE.PlaneGeometry(w,h), fm); pl.position.set(0,h/2,0); pl.rotation.y = side>0 ? -Math.PI/2 : Math.PI/2; grp.add(pl);
    const box = new THREE.Mesh(new THREE.BoxGeometry(14,h-0.02,w-0.02), litMat(0.03,0.026,0.025)); box.position.set(side*7.02,h/2-0.01,0); grp.add(box);
    // cornice
    const cor = new THREE.Mesh(new THREE.BoxGeometry(0.42,0.5,w+0.04), litMat(0.1,0.095,0.085)); cor.position.set(-side*0.2,h-0.28,0); grp.add(cor);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.62,0.12,w+0.1), litMat(0.12,0.115,0.1)); cap.position.set(-side*0.3,h-0.02,0); grp.add(cap);
    const S = SHOPS[key];
    // awning
    if(S.awn){
      const aw = awning(S.awn, w-1.4, side); aw.position.set(0,0,0); grp.add(aw);
    }
    // blade sign
    if(S.blade){
      const bz = (T.bladeZ===undefined? (idx%2? w*0.32 : -w*0.32): T.bladeZ);
      const b = bladeSign(S.blade, S.bcol, side); b.position.set(-side*0.75, 3.55, bz); grp.add(b);
    }
    // spill + neon lights
    if(S.tone){ spillCands.push({x:side*9.1,y:1.5,z:zc,col:S.tone.map(v=>v/255*0.9*S.k),r:w*0.58}); }
    if(S.neon){ neonCands.push({x:side*9.3,y:3.1,z:zc,col:S.neon.map(v=>v/255*4.2),r:3.4,key}); }
    return zTop - w;
  };
  // near buildings: unique paintings
  const near = [];
  for(const [key,w,h] of list){
    const ppm = (side<0 && z<14 && z>-6) ? (isMobile?100:150) : (isMobile?58:76);
    const T = makeOne(key,w,h,true,ppm); near.push(T); texCache.push(T);
    z = place(T,z); idx++;
  }
  // far buildings: reuse
  let fi = side>0?2:5;
  while(z > -92){
    const T = near[(fi++*5)%near.length];
    const T2 = {...T, bladeZ:undefined};
    z = place(T2,z); idx++;
  }
}

function awning(col, wd, side){
  // local: +X = outward from facade (toward street) ; build then flip for east side
  const hw = wd/2, y0=3.05, y1=2.55, out=1.25, val=0.28;
  const cv = mkc(256,64), x=cv.getContext('2d'); const nstr=14;
  for(let i=0;i<nstr;i++){ x.fillStyle = i%2? rgb([col[0]*0.82,col[1]*0.82,col[2]*0.82]) : 'rgb(120,116,108)'; x.fillRect(i*256/nstr,0,256/nstr+1,64); }
  const tx = canvasTex(cv,true,4);
  const pos = [ 0,y0,-hw,  0,y0,hw,  out,y1,hw,  out,y1,-hw,
                out,y1,-hw, out,y1,hw, out,y1-val,hw, out,y1-val,-hw ];
  const uv = [0,1, 1,1, 1,0.5, 0,0.5,   0,0.5, 1,0.5, 1,0, 0,0];
  const idx = [0,2,1, 0,3,2, 4,6,5, 4,7,6];
  const g = new THREE.BufferGeometry(); g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2)); g.setIndex(idx);
  // normals
  const nrm=[]; const n1=new THREE.Vector3(out,0.5,0).normalize(); for(let i=0;i<4;i++) nrm.push(n1.x,n1.y,n1.z); for(let i=0;i<4;i++) nrm.push(1,0,0);
  g.setAttribute('normal',new THREE.Float32BufferAttribute(nrm,3));
  const m = new THREE.Mesh(g, facadeMat(tx,null,0.0,THREE.DoubleSide));
  const grp = new THREE.Group(); grp.add(m);
  grp.rotation.y = side>0 ? Math.PI : 0;
  return grp;
}

function bladeSign(txt, col, side){
  const cv = mkc(256,128), x = cv.getContext('2d'); x.fillStyle='rgb(10,10,14)'; x.fillRect(0,0,256,128);
  x.save(); x.scale(256/2,128/1); // 2 x 1 unit

  x.shadowBlur=0; text(x,txt,1,0.66,sz,BLOCK,null,'center',rgb([col[0]*0.4+150,col[1]*0.4+150,col[2]*0.4+150]),sz*0.025);
  x.strokeStyle=rgb(col); x.lineWidth=0.035; x.strokeRect(0.07,0.08,1.86,0.84); x.restore();
  const tx = canvasTex(cv,true,4);

  const a = new THREE.Mesh(new THREE.PlaneGeometry(1.0,0.5), m); grp.add(a);

}

    float l=dot(t,vec3(.2126,.7152,.0722));
    t=mix(t*vec3(.9,1.0,1.1),t*vec3(1.06,1.0,.92),smoothstep(.1,.6,l));       // cool shadows, warm lights
    t=mix(vec3(l),t,1.08);
    t=pow(t,vec3(1./2.2));
    vec2 q=vUv-.5; q.x*=uRes.x/uRes.y; float v=1.-smoothstep(.35,1.05,length(q)*1.15); t*=mix(.45,1.,v);
    t+=(h(gl_FragCoord.xy+fract(uTime)*91.)-.5)*.022;
    gl_FragColor=vec4(t,1.); }`,{tScene:{value:null},tB0:{value:null},tB1:{value:null},tB2:{value:null},tB3:{value:null},uBloom:{value:0.32},uTime:U.uTime,uRes:{value:new THREE.Vector2(1,1)}});
function pass(mat,target){ fsMesh.material=mat; renderer.setRenderTarget(target); renderer.render(fsScene,fsCam); }
function mkRT(w,h,depth,samples){ const r=new THREE.WebGLRenderTarget(Math.max(2,w|0),Math.max(2,h|0),{type:RTTYPE,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:!!depth,samples:samples||0,generateMipmaps:false});
  r.texture.wrapS=r.texture.wrapT=THREE.ClampToEdgeWrapping; return r; }

let W=1,H=1,PR=1,quality=1;
function resize(){
  const maxPR = isMobile ? 1.5 : 2;
  PR = Math.min(window.devicePixelRatio||1, maxPR)*quality;
  W = Math.max(2,Math.floor(innerWidth*PR)); H = Math.max(2,Math.floor(innerHeight*PR));
  renderer.setPixelRatio(1); renderer.setSize(W,H,false);
  canvas.style.width='100%'; canvas.style.height='100%';
  const aspect = W/H;
  // horizontal fov >= ~68deg; clamp vertical for portrait
  let vfov = 54; const hf = 2*Math.atan(Math.tan(vfov*Math.PI/360)*aspect)*180/Math.PI;
  if(hf<66) vfov = Math.min(92, 2*Math.atan(Math.tan(66*Math.PI/360)/aspect)*180/Math.PI);
  camera.fov = vfov; camera.aspect = aspect; camera.updateProjectionMatrix();
  reflCam.fov = vfov; reflCam.aspect = aspect; reflCam.updateProjectionMatrix();
  if(sceneRT) sceneRT.dispose(); if(reflRT) reflRT.dispose(); bl.forEach(o=>{o.a.dispose();o.b.dispose();});
  sceneRT = mkRT(W,H,true,isMobile?0:4);
  const rs = isMobile?0.4:0.55; reflRT = mkRT(W*rs,H*rs,true,0);
  bl = []; let bw=W/2, bh=H/2;
  for(let i=0;i<4;i++){ bl.push({a:mkRT(bw,bh,false),b:mkRT(bw,bh,false),w:Math.max(2,bw|0),h:Math.max(2,bh|0)}); bw/=2; bh/=2; }
  matComp.uniforms.uRes.value.set(W,H);
  groundMat.uniforms.tRefl.value = reflRT.texture;
}
addEventListener('resize', resize);

function postProcess(){
  matBright.uniforms.tSrc.value = sceneRT.texture; matBright.uniforms.uTx.value.set(1/W,1/H);
  pass(matBright, bl[0].a);
  for(let i=0;i<4;i++){
    const L=bl[i];
    if(i>0){ matCopy.uniforms.tSrc.value = bl[i-1].a.texture; matCopy.uniforms.uTx.value.set(1/bl[i-1].w,1/bl[i-1].h); pass(matCopy, L.a); }
    matBlur.uniforms.tSrc.value = L.a.texture; matBlur.uniforms.uDir.value.set(1.2/L.w,0); pass(matBlur, L.b);
    matBlur.uniforms.tSrc.value = L.b.texture; matBlur.uniforms.uDir.value.set(0,1.2/L.h); pass(matBlur, L.a);
  }
  const u=matComp.uniforms; u.tScene.value=sceneRT.texture; u.tB0.value=bl[0].a.texture; u.tB1.value=bl[1].a.texture; u.tB2.value=bl[2].a.texture; u.tB3.value=bl[3].a.texture;
  pass(matComp, null);
}

/* ================================================================ INPUT */
let dragging=false, lx=0, ly=0, lastInput=0, interacted=false;
const hint = document.getElementById('hint');
canvas.addEventListener('pointerdown',e=>{ dragging=true; lx=e.clientX; ly=e.clientY; canvas.setPointerCapture(e.pointerId); interacted=true; hint.style.opacity=0; });
canvas.addEventListener('pointermove',e=>{ if(!dragging) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
  const k = (camera.fov*Math.PI/180)/innerHeight; tyaw -= dx*k*1.05; tpitch += dy*k*1.05; tpitch=Math.max(-0.8,Math.min(1.0,tpitch)); lastInput=performance.now(); });
const endDrag=()=>{ dragging=false; };
canvas.addEventListener('pointerup',endDrag); canvas.addEventListener('pointercancel',endDrag);
addEventListener('keydown',e=>{ if(e.key==='ArrowLeft') tyaw-=0.08; if(e.key==='ArrowRight') tyaw+=0.08; if(e.key==='ArrowUp') tpitch=Math.min(1,tpitch+0.05); if(e.key==='ArrowDown') tpitch=Math.max(-0.8,tpitch-0.05); });
canvas.addEventListener('wheel',e=>{ e.preventDefault(); tyaw += e.deltaX*0.002; tpitch=Math.max(-0.8,Math.min(1,tpitch - e.deltaY*0.0015)); },{passive:false});
// optional gyro on phones once the user has touched
window.__dbg = {carState}; window.__look = (y,p)=>{ yaw=tyaw=y; pitch=tpitch=p; };

/* ================================================================ UPDATE */
const tmpV = new THREE.Vector3(), fwd = new THREE.Vector3();
function updateCar(dt){
  const s = carState;
  const mv = movers[s.i];
  if(s.wait>0){ s.wait-=dt; mv.visible=false; U.uLC.value[0].set(0,0,0); U.uLC.value[1].set(0,0,0); if(s.wait<=0){ s.i=(s.i+1)%movers.length; s.dir=-s.dir; s.t=0; movers.forEach(m=>m.visible=false); movers[s.i].visible=true; s.speed=6.5+Math.random()*3; } return; }
  s.t += dt*s.speed;
  const z0 = s.dir>0 ? -75 : 28;
  const z = z0 + s.dir*s.t;
  const x = s.dir>0 ? -2.75 : 2.75;
  mv.position.set(x,0,z); mv.rotation.y = s.dir>0 ? -Math.PI/2 : Math.PI/2; mv.visible=true;
  const L = mv.userData.L;
  const hz = z + s.dir*(L/2+2.5), tz = z - s.dir*(L/2+0.3);
  U.uLP.value[0].set(x, 0.9, hz, 6.0); U.uLC.value[0].set(6,5.6,4.6);
  U.uLP.value[1].set(x, 0.8, tz, 2.2); U.uLC.value[1].set(2.6,0.14,0.08);
  if(Math.abs(z0 + s.dir*s.t - (s.dir>0?28:-75)) < 0.5 || (s.dir>0 ? z>30 : z<-78)){ s.wait = 5 + Math.random()*5; mv.visible=false; }
}
function updateTraffic(t){
  const c = (t % 22);
  const st = c<9 ? 'red' : c<10 ? 'amber_r' : c<18 ? 'green' : 'amber';
  const on = {red: st==='red'||st==='amber_r', amber: st==='amber', green: st==='green'};
  for(const k of ['red','amber','green']) sigState[k].forEach((s,i)=>{ s.material.opacity = on[k] ? 1 : 0.0; });
}
function updatePeds(dt,t){
  for(const p of peds){ p.z += p.v*dt; if(p.z< -75) p.z=14; if(p.z>16) p.z=-70;
    p.m.position.set(p.x, Math.abs(Math.sin(t*5.5+p.x))*0.025, p.z);
    p.m.children.forEach(ch=>{ if(ch.name==='leg'){ const s=Math.sign(ch.position.z)||1; ch.rotation.z = Math.sin(t*5.5)*0.35*s; } }); }
}

/* ================================================================ LOOP */
let last = performance.now(), tm = 0, frames = 0, accum = 0, qualityLocked = false;
const hintTimer = setTimeout(()=>{ if(!interacted) hint.style.opacity=0.85; }, 1800);
setTimeout(()=>{ hint.style.opacity=0; }, 11000);
function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05,(now-last)/1000); last=now; tm+=dt; U.uTime.value=tm;
  // adaptive resolution
  frames++; accum+=dt;
  if(frames===90 && !qualityLocked){ const avg=accum/90; if(avg>0.026 && quality>0.6){ quality=Math.max(0.6,quality*0.78); resize(); } frames=0; accum=0; if(avg<=0.026) qualityLocked=true; }
  // camera
  const sm = 1-Math.pow(0.0008,dt);
  yaw += (tyaw-yaw)*sm; pitch += (tpitch-pitch)*sm;
  if(!dragging && performance.now()-lastInput>5000 && !interacted){ tyaw += Math.sin(tm*0.08)*0.00025; }
  const sx = Math.sin(tm*0.31)*0.012, sy = Math.sin(tm*0.9)*0.004;
  camera.position.set(CAM.x+sx, CAM.y+sy, CAM.z);
  camera.rotation.set(pitch + Math.sin(tm*0.5)*0.002, -yaw, 0);
  camera.updateMatrixWorld();
  updateCar(dt); updateTraffic(tm); updatePeds(dt,tm);
  // flicker neon blades
  for(const b of bladeList){ let f=1; if(b.flick){ const q=Math.sin(tm*23+b.ph)*Math.sin(tm*7.3+b.ph*2); f = (Math.sin(tm*0.7+b.ph)>0.93 && q>0.2) ? 0.35 : 1; } b.mat.uniforms.uEmit.value=1.7*f; }
  sky.position.set(camera.position.x,0,camera.position.z); skyMat.uniforms.uCtr.value.copy(sky.position);
  rainMat.uniforms.uCam.value.copy(camera.position);
  // reflection camera
  camera.getWorldDirection(fwd);
  reflCam.position.set(camera.position.x,-camera.position.y,camera.position.z);
  reflCam.up.set(0,-1,0);
  reflCam.lookAt(camera.position.x+fwd.x,-camera.position.y-fwd.y,camera.position.z+fwd.z);
  reflCam.updateMatrixWorld();
  groundMat.uniforms.uReflVP.value.multiplyMatrices(reflCam.projectionMatrix,reflCam.matrixWorldInverse);
  // passes
  ground.visible=false; rain.visible=false;
  renderer.setRenderTarget(reflRT); renderer.render(scene,reflCam);
  ground.visible=true; rain.visible=true;
  renderer.setRenderTarget(sceneRT); renderer.render(scene,camera);
  postProcess();
}
resize();
// intro: initial yaw starts a touch wider and settles
yaw = 0.7; pitch = (innerHeight>innerWidth) ? -0.1 : -0.02; tyaw=yaw; tpitch=pitch;
// test hook for headless captures
window.__ready = false;
requestAnimationFrame(t=>{ last=t; frame(t); setTimeout(()=>{ window.__ready=true; }, 600); });
})();
</script>
