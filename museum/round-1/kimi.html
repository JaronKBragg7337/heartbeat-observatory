<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08121b">
<title>Maple Street — After the Rain</title>
<style>
  *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#08121b;color:#f4e8d2;font-family:Georgia,'Times New Roman',serif;touch-action:none}
  canvas{display:block;width:100%;height:100%;cursor:grab}canvas:active{cursor:grabbing}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 43%,transparent 38%,rgba(1,6,12,.16) 70%,rgba(1,5,10,.58) 115%);z-index:2}
  #mist{position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.2;background:linear-gradient(180deg,rgba(60,88,110,.16),transparent 38%,transparent 78%,rgba(3,9,15,.3))}
  #place{position:fixed;left:28px;top:25px;z-index:3;pointer-events:none;text-shadow:0 2px 12px #000;transition:opacity 1.5s}
  #place .name{font-size:12px;letter-spacing:.32em;font-family:Arial,sans-serif;font-weight:600;color:#eadfc9}
  #place .time{margin-top:7px;font-size:11px;font-style:italic;letter-spacing:.06em;color:#aab8c1}
  #hint{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:3;pointer-events:none;white-space:nowrap;font:10px Arial,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#d5dde0;background:rgba(5,13,20,.38);border:1px solid rgba(213,221,224,.13);border-radius:30px;padding:11px 17px;backdrop-filter:blur(6px);transition:opacity 1.5s}
  #sound{position:fixed;right:22px;top:22px;z-index:4;width:36px;height:36px;padding:0;border:1px solid rgba(231,225,208,.2);border-radius:50%;background:rgba(6,14,21,.35);color:#d8d7ce;cursor:pointer;backdrop-filter:blur(5px);font:15px Arial,sans-serif}
  #sound:focus-visible{outline:2px solid #e9c485;outline-offset:3px}
  #loading{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#08121b;transition:opacity 1.2s;pointer-events:none}
  #loading div{text-align:center;font-size:12px;letter-spacing:.25em;color:#c8bda9}#loading span{display:block;margin-top:12px;font:italic 12px Georgia,serif;letter-spacing:.03em;color:#758793}
  @media(max-width:600px){#place{left:18px;top:20px}#place .name{font-size:10px}#place .time{font-size:10px}#sound{right:16px;top:16px}#hint{font-size:9px;bottom:max(18px,env(safe-area-inset-bottom));padding:10px 14px}}
</style>
</head>
<body>
<div id="loading"><div>MAPLE STREET<span>a little after midnight</span></div></div>
<div id="vignette"></div><div id="mist"></div>
<div id="place"><div class="name">MAPLE STREET</div><div class="time">November rain · 11:47 pm</div></div>
<button id="sound" aria-label="Turn rain sound on" title="Rain sound">♩</button>
<div id="hint">Drag to look around</div>

renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;targetYaw-=dx*.0032;targetPitch-=dy*.0028;targetPitch=Math.max(-.48,Math.min(.55,targetPitch));if(Math.abs(dx)+Math.abs(dy)>2)moved=true;});
const endDrag=()=>{dragging=false;if(moved){hint.style.opacity='0';document.getElementById('place').style.opacity='.55';}};
renderer.domElement.addEventListener('pointerup',endDrag);renderer.domElement.addEventListener('pointercancel',endDrag);
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<600?62:55;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,innerWidth<600?1.45:1.7));splashMat.uniforms.uDpr.value=renderer.getPixelRatio();});
let audioCtx=null,audioGain=null,soundOn=false;
const soundButton=document.getElementById('sound');
soundButton.addEventListener('click',()=>{
  if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();const length=audioCtx.sampleRate*3,buffer=audioCtx.createBuffer(2,length,audioCtx.sampleRate);for(let ch=0;ch<2;ch++){const data=buffer.getChannelData(ch);let last=0;for(let i=0;i<length;i++){const white=Math.random()*2-1;last=(last+.018*white)/1.018;data[i]=white*.22+last*2.2;}}const source=audioCtx.createBufferSource();source.buffer=buffer;source.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=4300;audioGain=audioCtx.createGain();audioGain.gain.value=0;source.connect(filter).connect(audioGain).connect(audioCtx.destination);source.start();}
  audioCtx.resume();soundOn=!soundOn;audioGain.gain.cancelScheduledValues(audioCtx.currentTime);audioGain.gain.linearRampToValueAtTime(soundOn?.32:0,audioCtx.currentTime+.5);soundButton.textContent=soundOn?'♪':'♩';soundButton.setAttribute('aria-label',soundOn?'Turn rain sound off':'Turn rain sound on');
});
let first=true,frame=0;
function animate(){
  requestAnimationFrame(animate);
  const t=clock.getElapsedTime();
  if(!dragging){targetYaw+=Math.sin(t*.09)*.000035;}
  yaw+=(targetYaw-yaw)*.1;pitch+=(targetPitch-pitch)*.1;
  camera.quaternion.setFromEuler(new THREE.Euler(pitch,yaw,0,'YXZ'));camera.updateMatrixWorld();
  const phase=(t+2)%30;car.position.x=-14+phase*1.3;car.visible=phase<27;
  roadUniforms.uTime.value=t;rainMat.uniforms.uTime.value=reduced?t*.35:t;splashMat.uniforms.uTime.value=t;
  if(frame%(mobile?3:1)===0)renderReflection();
  renderer.render(scene,camera);
  if(first){first=false;loading.style.opacity='0';setTimeout(()=>loading.remove(),1400);}
  frame++;
}
animate();
setTimeout(()=>{if(!moved)hint.style.opacity='.72';},5000);
})();
</script>
</body>
</html>
