<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Main Street, after rain</title>
<style>
  html, body { margin: 0; height: 100%; background: #07090d; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; }
  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 42%, transparent 45%, rgba(0,0,0,0.32) 100%);
  }
  #hint {
    position: fixed; left: 0; right: 0;
    bottom: calc(16px + env(safe-area-inset-bottom));
    text-align: center; pointer-events: none;
    font: 500 12px/1.4 "Segoe UI", system-ui, sans-serif;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(255, 228, 200, 0.78);
    text-shadow: 0 1px 10px rgba(0,0,0,0.85);
    transition: opacity 1.4s ease;
  }
  #hint.hide { opacity: 0; }
  #err {
    display: none; position: fixed; inset: 0; padding: 28px;
    color: #f3e6d4; font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    background: #07090d;
  }
</style>
</head>
<body>
<div id="vignette"></div>
<div id="hint">Drag to look around</div>
<div id="err"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function () {
  "use strict";

  const hint = document.getElementById("hint");
  const errBox = document.getElementById("err");
  function fail(msg) {
    errBox.style.display = "block";
    errBox.textContent = msg;
    console.error(msg);
  }
  window.addEventListener("error", function (e) {
    if (!window.__frames) fail(String(e.message || e.error || "Scene failed to start"));
  });
  if (!window.THREE) { fail("Three.js did not load. Open this file with a network connection."); return; }

  const THREE = window.THREE;
  const TAU = Math.PI * 2;

  // Standing on the east sidewalk, looking down Main. +X is behind the
  // storefronts on this side; the shops we face sit on -X. -Z runs downtown.
  const FACE_FAR = -10.97;
  const FACE_NEAR = 3.64;
  const CURB_NEAR = 0.50;
  const CURB_FAR = -8.18;
  const SIDE_NEAR_X1 = 3.72;
  const SIDE_FAR_X0 = -11.06;
  const ROAD_Y = 0.012;
  const WALK_H = 0.15;
  const EYE = 1.62;

  const smallScreen = Math.min(window.innerWidth, window.innerHeight) < 540 || window.innerWidth < 700;

  const renderer = new THREE.WebGLRenderer({
    antialias: !smallScreen,
    powerPreference: "high-performance",
    stencil: false,
    alpha: false
  });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 0.88;
  renderer.setClearColor(0x10131a, 1);
  renderer.shadowMap.enabled = false;
  document.body.prepend(renderer.domElement);

  const scene = new THREE.Scene();
  const HORIZON = new THREE.Color(0x10131a);
  scene.fog = new THREE.FogExp2(HORIZON, 0.027);
  scene.background = HORIZON;

  const camera = new THREE.PerspectiveCamera(40, 1, 0.08, 220);
  camera.rotation.order = "YXZ";
  // lookX > 0 tilts the view down. lookY > 0 turns toward the far storefronts (-X).
  // Canonical: lookX = 0, lookY = 0 -> getWorldDirection (0, 0, -1).
  let lookX = 0.1;
  let lookY = 0.58;
  let velX = 0, velY = 0;
  let dragging = false;
  camera.position.set(2.02, WALK_H + EYE, 3.15);

  function applyLook() {
    const lim = 1.05;
    if (lookX > lim) lookX = lim;
    if (lookX < -0.72) lookX = -0.72;
    camera.rotation.x = lookX;
    camera.rotation.y = lookY;
    camera.rotation.z = 0;
  }
  applyLook();

  scene.add(new THREE.HemisphereLight(0x243044, 0x1a100c, 0.34));

  const aniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  const hiddenInRefl = [];
  const frameFns = [];

  function canvasTex(w, h, draw) {
    const c = document.createElement("canvas");
    c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    const t = new THREE.CanvasTexture(c);
    t.colorSpace = THREE.SRGBColorSpace;
    t.anisotropy = aniso;
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    return t;
  }

  function hash(n) {
    const s = Math.sin(n * 127.1 + 311.7) * 43758.5453;
    return s - Math.floor(s);
  }

  const brickTex = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = "#3a342f";
    g.fillRect(0, 0, w, h);
    const bw = 64, bh = 30, gap = 4;
    for (let y = 0; y < h + bh; y += bh) {
      const row = Math.floor(y / bh);
      const off = (row % 2) ? bw * 0.5 : 0;
      for (let x = -bw; x < w + bw; x += bw) {
        const n = hash(row * 19.1 + x * 0.17);
        const k = 0.72 + n * 0.38;
        const r = Math.floor(168 * k), gc = Math.floor(86 * k), b = Math.floor(72 * k);
        g.fillStyle = "rgb(" + r + "," + gc + "," + b + ")";
        const px = x + off + gap * 0.5, py = y + gap * 0.5;
        g.fillRect(px, py, bw - gap, bh - gap);
        g.fillStyle = "rgba(255,220,190," + (0.04 + n * 0.05) + ")";
        g.fillRect(px, py, (bw - gap) * 0.45, 2);
        if (n > 0.82) {
          g.fillStyle = "rgba(20,10,8,0.28)";
          g.fillRect(px + 8, py + 6, 14, 8);
        }
      }
    }
    const img = g.getImageData(0, 0, w, h);
    const d = img.data;
    for (let i = 0; i < d.length; i += 16) {
      const j = (hash(i) - 0.5) * 18;
      d[i] += j; d[i + 1] += j * 0.8; d[i + 2] += j * 0.6;
    }
    g.putImageData(img, 0, 0);
  });

  const paintedTex = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = "#c2b5a2";
    g.fillRect(0, 0, w, h);
    const bw = 64, bh = 30, gap = 3;
    for (let y = 0; y < h + bh; y += bh) {
      const row = Math.floor(y / bh);
      const off = (row % 2) ? bw * 0.5 : 0;
      for (let x = -bw; x < w + bw; x += bw) {
        const n = hash(row * 9.3 + x * 0.13);
        const k = 0.9 + n * 0.12;
        g.fillStyle = "rgb(" + Math.floor(168 * k) + "," + Math.floor(150 * k) + "," + Math.floor(128 * k) + ")";
        g.fillRect(x + off + 2, y + 2, bw - gap, bh - gap);
        if (n > 0.9) {
          g.fillStyle = "rgba(90,50,40,0.35)";
          g.fillRect(x + off + 10, y + 8, 18, 10);
        }
      }
    }
  });

  const concreteTex = canvasTex(512, 512, function (g, w, h) {
    g.fillStyle = "#8d8a84";
    g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2500; i++) {
      const x = hash(i * 1.7) * w, y = hash(i * 2.3 + 4) * h;
      const a = hash(i * 3.1);
      g.fillStyle = a > 0.5 ? "rgba(255,255,255,0.05)" : "rgba(0,0,0,0.06)";
      g.fillRect(x, y, 2, 2);
    }
    g.strokeStyle = "rgba(40,36,32,0.45)";
    g.lineWidth = 3;
    for (let y = 0; y <= h; y += 128) {
      g.beginPath(); g.moveTo(0, y + 0.5); g.lineTo(w, y + 0.5); g.stroke();
    }
    for (let x = 0; x <= w; x += 128) {
      g.beginPath(); g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, h); g.stroke();
    }
    g.fillStyle = "rgba(20,16,12,0.18)";
    g.beginPath(); g.ellipse(180, 300, 70, 40, 0.4, 0, TAU); g.fill();
    g.fillStyle = "rgba(30,40,36,0.16)";
    g.beginPath(); g.ellipse(380, 140, 50, 28, -0.3, 0, TAU); g.fill();
  });

  const awningTex = canvasTex(128, 64, function (g, w, h) {
    const cols = ["#6e1c24", "#f2efe8"];
    for (let x = 0; x < w; x += 16) {
      g.fillStyle = cols[(x / 16) % 2];
      g.fillRect(x, 0, 16, h);
    }
  });
  const awningGreen = canvasTex(128, 64, function (g, w, h) {
    const cols = ["#1d3a30", "#e7e2d4"];
    for (let x = 0; x < w; x += 16) {
      g.fillStyle = cols[(x / 16) % 2];
      g.fillRect(x, 0, 16, h);
    }
  });

  const blindsTex = canvasTex(64, 128, function (g, w, h) {
    g.fillStyle = "#e6d3b0";
    g.fillRect(0, 0, w, h);
    g.fillStyle = "rgba(70,48,30,0.35)";
    for (let y = 0; y < h; y += 7) g.fillRect(0, y, w, 2);
    g.fillStyle = "rgba(40,24,16,0.25)";
    g.fillRect(0, 0, 5, h);
  });

  const glowTex = canvasTex(128, 128, function (g) {
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, "rgba(255,250,240,1)");
    grd.addColorStop(0.18, "rgba(255,214,160,0.75)");
    grd.addColorStop(0.45, "rgba(255,170,80,0.18)");
    grd.addColorStop(1, "rgba(255,150,60,0)");
    g.fillStyle = grd;
    g.fillRect(0, 0, 128, 128);
  });

  function neonTex(text, color, w, h, font) {
    return canvasTex(w, h, function (g) {
      g.clearRect(0, 0, w, h);
      g.font = font;
      g.textAlign = "center";
      g.textBaseline = "middle";
      g.shadowColor = color;
      g.fillStyle = color;
      g.shadowBlur = 36;
      for (let i = 0; i < 5; i++) g.fillText(text, w / 2, h / 2);
      g.shadowBlur = 10;
      g.fillText(text, w / 2, h / 2);
      g.shadowBlur = 0;
      g.fillStyle = "#fff8f0";
      g.fillText(text, w / 2, h / 2);
    });
  }

  const crossTex = canvasTex(256, 256, function (g) {
    g.clearRect(0, 0, 256, 256);
    g.shadowColor = "#39f0a0";
    g.shadowBlur = 28;
    g.fillStyle = "#5dffb8";
    g.fillRect(108, 28, 40, 200);
    g.fillRect(28, 108, 200, 40);
    g.shadowBlur = 8;
    g.fillStyle = "#eafff5";
    g.fillRect(114, 34, 28, 188);
    g.fillRect(34, 114, 188, 28);
  });

  const barberTex = canvasTex(64, 256, function (g) {
    g.fillStyle = "#f3f3f3";
    g.fillRect(0, 0, 64, 256);
    g.save();
    g.translate(32, 128);
    g.rotate(-0.55);
    for (let y = -220, i = 0; y < 220; y += 26, i++) {
      g.fillStyle = (i % 2 === 0) ? "#d01818" : "#1a4c8c";
      g.fillRect(-90, y, 180, 13);
    }
    g.restore();
  });

  function std(color, rough, metal) {
    return new THREE.MeshStandardMaterial({
      color: color, roughness: rough, metalness: metal == null ? 0 : metal
    });
  }

  const matTrim = std(0x14181a, 0.55, 0.35);
  const matTrimGreen = std(0x1a2822, 0.6, 0.2);
  const matStone = std(0xc4b8a4, 0.8, 0.02);
  const matRubber = std(0x141414, 0.85, 0.05);
  const matMetal = std(0x2a3034, 0.35, 0.75);
  const matGlass = new THREE.MeshStandardMaterial({
    color: 0x9eb0be, roughness: 0.04, metalness: 0.08,
    transparent: true, opacity: 0.16, depthWrite: false
  });
  const matDarkGlass = new THREE.MeshStandardMaterial({
    color: 0x0c1016, roughness: 0.12, metalness: 0.62,
    emissive: 0x06080c, emissiveIntensity: 0.5
  });
  const matSidewalk = new THREE.MeshStandardMaterial({
    map: concreteTex, color: 0x3e3c38, roughness: 0.46, metalness: 0.1
  });
  const matConcrete = new THREE.MeshStandardMaterial({
    map: concreteTex, color: 0x9a968e, roughness: 0.84, metalness: 0.02
  });

  const WIN = {
    warm: new THREE.MeshStandardMaterial({ color: 0x1a1008, emissive: 0xffb15a, emissiveIntensity: 2.15, roughness: 0.45 }),
    warmDim: new THREE.MeshStandardMaterial({ color: 0x140e0a, emissive: 0xc47a3a, emissiveIntensity: 0.85, roughness: 0.5 }),
    blinds: new THREE.MeshStandardMaterial({ color: 0xffffff, map: blindsTex, emissive: 0xffc27a, emissiveIntensity: 1.15, roughness: 0.62 }),
    cool: new THREE.MeshStandardMaterial({ color: 0x101418, emissive: 0xd5e6ea, emissiveIntensity: 1.35, roughness: 0.4 }),
    amber: new THREE.MeshStandardMaterial({ color: 0x120c08, emissive: 0xff8a3a, emissiveIntensity: 0.7, roughness: 0.5 }),
    tv: new THREE.MeshStandardMaterial({ color: 0x0a1018, emissive: 0x7eb6ff, emissiveIntensity: 0.9, roughness: 0.35 }),
    off: matDarkGlass
  };
  frameFns.push(function (t) {
    WIN.tv.emissiveIntensity = 0.55 + Math.abs(Math.sin(t * 7.5)) * 0.5 + (Math.sin(t * 33.0) > 0.97 ? 0.6 : 0);
  });

  function darkenBase(shader) {
    shader.vertexShader = "varying float vH;\n" + shader.vertexShader.replace(
      "#include <project_vertex>",
      "vH = (modelMatrix * vec4(transformed, 1.0)).y;\n#include <project_vertex>"
    );
    shader.fragmentShader = "varying float vH;\n" + shader.fragmentShader.replace(
      "#include <color_fragment>",
      "#include <color_fragment>\n diffuseColor.rgb *= mix(0.78, 1.0, smoothstep(0.0, 1.15, vH));"
    );
  }

  function brickMat(tint, width, height, painted) {
    const map = (painted ? paintedTex : brickTex).clone();
    map.wrapS = map.wrapT = THREE.RepeatWrapping;
    map.repeat.set(Math.max(width, 1) / 2.05, Math.max(height, 1) / 1.02);
    map.colorSpace = THREE.SRGBColorSpace;
    map.anisotropy = aniso;
    map.needsUpdate = true;
    const m = new THREE.MeshStandardMaterial({
      map: map, color: tint, roughness: painted ? 0.86 : 0.93, metalness: 0.02
    });
    m.onBeforeCompile = darkenBase;
    return m;
  }

  function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
  function add(obj, x, y, z, parent) {
    obj.position.set(x, y, z);
    (parent || scene).add(obj);
    return obj;
  }

  // ---------------------------------------------------------------------------
  // Sky
  // ---------------------------------------------------------------------------
  const sky = new THREE.Mesh(
    new THREE.SphereGeometry(170, 28, 16),
    new THREE.ShaderMaterial({
      side: THREE.BackSide,
      depthWrite: false,
      uniforms: {
        uTop: { value: new THREE.Color(0x07090e) },
        uHor: { value: HORIZON.clone() },
        uTown: { value: new THREE.Color(0x2a2218) }
      },
      vertexShader: "varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }",
      fragmentShader: [
        "varying vec3 vP;",
        "uniform vec3 uTop, uHor, uTown;",
        "void main(){",
        "  vec3 d = normalize(vP);",
        "  float h = smoothstep(-0.04, 0.55, d.y);",
        "  vec3 col = mix(uHor, uTop, h);",
        "  float town = smoothstep(0.22, -0.02, d.y) * smoothstep(-0.15, 0.85, -d.z);",
        "  col += uTown * town * 0.22;",
        "  float cloud = sin(d.x * 7.0 + d.z * 4.0) * sin(d.z * 6.0 - d.x * 2.0);",
        "  col += vec3(0.015, 0.016, 0.02) * cloud * (1.0 - h);",
        "  gl_FragColor = vec4(col, 1.0);",
        "  #include <colorspace_fragment>",
        "}"
      ].join("\n")
    })
  );
  sky.renderOrder = -2;
  sky.frustumCulled = false;
  scene.add(sky);

  // ---------------------------------------------------------------------------
  // Wet road — planar reflection + puddle ripples + lamp streaks
  // ---------------------------------------------------------------------------
  const reflW = smallScreen ? 384 : 704;
  const reflH = smallScreen ? 384 : 396;
  const reflTarget = new THREE.WebGLRenderTarget(reflW, reflH, {
    minFilter: THREE.LinearFilter,
    magFilter: THREE.LinearFilter,
    depthBuffer: true,
    stencilBuffer: false
  });
  reflTarget.texture.colorSpace = THREE.SRGBColorSpace;
  reflTarget.texture.generateMipmaps = false;

  const virtualCamera = new THREE.PerspectiveCamera();
  const textureMatrix = new THREE.Matrix4();
  const reflNormal = new THREE.Vector3();
  const reflView = new THREE.Vector3();
  const reflTargetPos = new THREE.Vector3();
  const reflLook = new THREE.Vector3();
  const reflRot = new THREE.Matrix4();
  const reflWorld = new THREE.Vector3();
  const camWorld = new THREE.Vector3();
  const reflPlane = new THREE.Plane();
  const reflClip = new THREE.Vector4();
  const reflQ = new THREE.Vector4();

  const RIP_N = 12;
  const ripples = [];
  for (let i = 0; i < RIP_N; i++) ripples.push(new THREE.Vector3(0, 0, -10));

  const PUDDLES = [
    { x: -1.2, z: 1.15, rx: 1.7, rz: 2.5 },
    { x: -3.3, z: -3.6, rx: 1.55, rz: 2.35 },
    { x: -5.6, z: -1.1, rx: 1.35, rz: 2.1 },
    { x: -2.5, z: -7.2, rx: 1.4, rz: 2.15 },
    { x: -4.6, z: -11.0, rx: 1.6, rz: 2.4 },
    { x: -6.4, z: 2.4, rx: 1.2, rz: 1.9 }
  ];

  const NL = 8;
  const NN = 8;
  const NC = 4;
  const lampPos = [], lampCol = [], lampI = new Float32Array(NL);
  const neonPos = [], neonCol = [], neonI = new Float32Array(NN);
  const carPos = [], carCol = [], carI = new Float32Array(NC);
  for (let i = 0; i < NL; i++) { lampPos.push(new THREE.Vector3()); lampCol.push(new THREE.Color(0xffb060)); }
  for (let i = 0; i < NN; i++) { neonPos.push(new THREE.Vector3()); neonCol.push(new THREE.Color(0xff3030)); }
  for (let i = 0; i < NC; i++) { carPos.push(new THREE.Vector3()); carCol.push(new THREE.Color(0xfff2dd)); }

  const groundMat = new THREE.ShaderMaterial({
    transparent: false,
    depthWrite: true,
    side: THREE.DoubleSide,
    fog: true,
    toneMapped: true,
    polygonOffset: true,
    polygonOffsetFactor: 1,
    polygonOffsetUnits: 1,
    uniforms: {
      tDiffuse: { value: reflTarget.texture },
      uTexMatrix: { value: textureMatrix },
      uTime: { value: 0 },
      uRip: { value: ripples },
      uLPos: { value: lampPos },
      uLCol: { value: lampCol },
      uLI: { value: lampI },
      uNPos: { value: neonPos },
      uNCol: { value: neonCol },
      uNI: { value: neonI },
      uCPos: { value: carPos },
      uCCol: { value: carCol },
      uCI: { value: carI },
      fogColor: { value: new THREE.Color() },
      fogNear: { value: 1 },
      fogFar: { value: 2000 },
      fogDensity: { value: 0.027 }
    },
    vertexShader: [
      "varying vec3 vWorld;",
      "varying vec4 vProj;",
      "uniform mat4 uTexMatrix;",
      "#include <common>",
      "#include <fog_pars_vertex>",
      "void main() {",
      "  vec4 wp = modelMatrix * vec4(position, 1.0);",
      "  vWorld = wp.xyz;",
      "  vProj = uTexMatrix * wp;",
      "  vec4 mvPosition = viewMatrix * wp;",
      "  gl_Position = projectionMatrix * mvPosition;",
      "  #include <fog_vertex>",
      "}"
    ].join("\n"),
    fragmentShader: [
      "varying vec3 vWorld;",
      "varying vec4 vProj;",
      "uniform sampler2D tDiffuse;",
      "uniform float uTime;",
      "uniform vec3 uRip[12];",
      "uniform vec3 uLPos[8];",
      "uniform vec3 uLCol[8];",
      "uniform float uLI[8];",
      "uniform vec3 uNPos[8];",
      "uniform vec3 uNCol[8];",
      "uniform float uNI[8];",
      "uniform vec3 uCPos[4];",
      "uniform vec3 uCCol[4];",
      "uniform float uCI[4];",
      "#include <common>",
      "#include <fog_pars_fragment>",
      "float ellipse(vec2 p, vec2 c, vec2 r) {",
      "  vec2 d = (p - c) / r;",
      "  return 1.0 - smoothstep(0.55, 1.02, dot(d, d));",
      "}",
      "float puddle(vec2 p) {",
      "  float m = 0.0;",
      "  m = max(m, ellipse(p, vec2(-1.20, 1.15), vec2(1.70, 2.50)));",
      "  m = max(m, ellipse(p, vec2(-3.30, -3.60), vec2(1.55, 2.35)));",
      "  m = max(m, ellipse(p, vec2(-5.60, -1.10), vec2(1.35, 2.10)));",
      "  m = max(m, ellipse(p, vec2(-2.50, -7.20), vec2(1.40, 2.15)));",
      "  m = max(m, ellipse(p, vec2(-4.60, -11.0), vec2(1.60, 2.40)));",
      "  m = max(m, ellipse(p, vec2(-6.40, 2.40), vec2(1.20, 1.90)));",
      "  float gutter = smoothstep(0.85, 0.02, abs(p.x - 0.50));",
      "  gutter = max(gutter, smoothstep(0.85, 0.02, abs(p.x + 8.18)));",
      "  float n = sin(p.x * 1.7 + sin(p.y * 0.73)) * sin(p.y * 0.55 + 1.7);",
      "  float grain = smoothstep(-0.2, 0.85, n);",
      "  return clamp(max(max(m, gutter * 0.75), grain * 0.42), 0.0, 1.0);",
      "}",
      "vec2 rippleGrad(vec2 p) {",
      "  vec2 g = vec2(0.0);",
      "  for (int i = 0; i < 12; i++) {",
      "    float age = uTime - uRip[i].z;",
      "    if (age < 0.0 || age > 2.7) continue;",
      "    vec2 d = p - uRip[i].xy;",
      "    float dist = length(d);",
      "    float env = exp(-age * 1.55) * exp(-dist * dist * 1.55);",
      "    float phase = dist * 20.0 - age * 15.0;",
      "    g += d * (cos(phase) * 20.0 * env / max(dist, 0.08));",
      "  }",
      "  g.x += cos(p.x * 5.5 + uTime * 1.4) * sin(p.y * 4.2 - uTime * 0.8) * 0.35;",
      "  g.y += sin(p.y * 5.0 - uTime * 1.1) * cos(p.x * 3.7 + uTime * 0.6) * 0.35;",
      "  return g;",
      "}",
      "vec3 sampleRefl(vec4 proj, float blur) {",
      "  vec2 b = vec2(blur * proj.w / 420.0, blur * proj.w / 280.0);",
      "  vec3 c = texture2DProj(tDiffuse, proj).rgb * 0.42;",
      "  c += texture2DProj(tDiffuse, proj + vec4(b.x, 0.0, 0.0, 0.0)).rgb * 0.145;",
      "  c += texture2DProj(tDiffuse, proj + vec4(-b.x, 0.0, 0.0, 0.0)).rgb * 0.145;",
      "  c += texture2DProj(tDiffuse, proj + vec4(0.0, b.y, 0.0, 0.0)).rgb * 0.145;",
      "  c += texture2DProj(tDiffuse, proj + vec4(0.0, -b.y, 0.0, 0.0)).rgb * 0.145;",
      "  return c;",
      "}",
      "vec3 addLight(vec3 pos, vec3 col, float inten, vec3 N, vec3 V, vec3 world, float wet) {",
      "  if (inten < 0.001) return vec3(0.0);",
      "  vec3 Lvec = pos - world;",
      "  float dist2 = dot(Lvec, Lvec);",
      "  float dist = sqrt(dist2);",
      "  vec3 L = Lvec / max(dist, 0.001);",
      "  vec3 R = reflect(-V, N);",
      "  float ndl = max(dot(L, R), 0.0);",
      "  float spec = pow(ndl, mix(16.0, 80.0, wet));",
      "  float wide = pow(ndl, 5.5);",
      "  vec2 d = pos.xz - world.xz;",
      "  float streak = exp(-d.x * d.x * 2.1) * exp(-d.y * d.y * 0.012);",
      "  float atten = inten / (1.0 + 0.05 * dist2);",
      "  float diffuse = max(Lvec.y, 0.0) / (1.0 + 0.09 * dist2);",
      "  return col * (atten * (spec * 0.85 + wide * 0.1 + streak * 0.22) + diffuse * inten * 0.01);",
      "}",
      "void main() {",
      "  vec2 p = vWorld.xz;",
      "  float wet = mix(0.34, 1.0, puddle(p));",
      "  vec2 rg = rippleGrad(p) * (0.35 + wet);",
      "  vec3 N = normalize(vec3(-rg.x * 0.055, 1.0, -rg.y * 0.055));",
      "  vec3 V = normalize(cameraPosition - vWorld);",
      "  float fres = pow(1.0 - clamp(dot(vec3(0.0, 1.0, 0.0), V), 0.0, 1.0), 2.6);",
      "  float grit = fract(sin(dot(floor(p * 14.0), vec2(127.1, 311.7))) * 43758.5);",
      "  vec3 asphalt = vec3(0.015, 0.016, 0.02) * (0.8 + grit * 0.35);",
      "  float gutter = smoothstep(0.6, 0.0, abs(p.x - 0.50)) + smoothstep(0.6, 0.0, abs(p.x + 8.18));",
      "  asphalt *= mix(1.0, 0.62, clamp(gutter, 0.0, 1.0));",
      "  vec4 proj = vProj;",
      "  proj.xy += rg.xy * (0.004 + 0.012 * wet) * proj.w;",
      "  float blur = mix(5.5, 0.65, wet);",
      "  vec3 refl = sampleRefl(proj, blur);",
      "  vec2 uvc = proj.xy / max(proj.w, 0.0001);",
      "  float edge = smoothstep(0.0, 0.06, uvc.x) * smoothstep(1.0, 0.94, uvc.x);",
      "  edge *= smoothstep(0.0, 0.06, uvc.y) * smoothstep(1.0, 0.94, uvc.y);",
      "  refl *= edge;",
      "  float reflAmt = mix(0.1, 0.72, wet) * mix(0.34, 0.95, fres);",
      "  vec3 col = mix(asphalt, refl, clamp(reflAmt, 0.0, 0.86));",
      "  vec3 spec = vec3(0.0);",
      "  for (int i = 0; i < 8; i++) spec += addLight(uLPos[i], uLCol[i], uLI[i], N, V, vWorld, wet);",
      "  for (int i = 0; i < 8; i++) spec += addLight(uNPos[i], uNCol[i], uNI[i], N, V, vWorld, wet);",
      "  for (int i = 0; i < 4; i++) spec += addLight(uCPos[i], uCCol[i], uCI[i], N, V, vWorld, wet);",
      "  col += spec * (0.4 + 0.35 * fres) * mix(0.55, 1.0, wet);",
      "  float inRoad = step(p.x, 0.42) * step(-8.05, p.x);",
      "  float inX = step(-29.7, p.y) * step(p.y, -21.9);",
      "  float dash = step(0.5, fract(p.y * 0.11));",
      "  float center = smoothstep(0.07, 0.015, abs(p.x + 3.85));",
      "  float yellow = center * dash * inRoad * (1.0 - inX);",
      "  float stripe = step(0.52, fract(p.x * 0.42));",
      "  float band = smoothstep(0.5, 0.12, abs(p.y + 22.15)) + smoothstep(0.5, 0.12, abs(p.y + 29.35));",
      "  float walk = band * stripe * inRoad;",
      "  float edgeL = smoothstep(0.045, 0.0, abs(p.x - 0.22)) * (1.0 - inX);",
      "  float edgeR = smoothstep(0.045, 0.0, abs(p.x + 7.9)) * (1.0 - inX);",
      "  col = mix(col, vec3(0.55, 0.42, 0.12), yellow * 0.55);",
      "  col = mix(col, vec3(0.62, 0.62, 0.58), clamp(walk + edgeL + edgeR, 0.0, 1.0) * 0.42);",
      "  vec2 mh = p - vec2(-2.35, 0.85);",
      "  float md = length(mh);",
      "  col = mix(col, vec3(0.02, 0.021, 0.024), smoothstep(0.48, 0.42, md) * 0.65);",
      "  col += vec3(0.035) * smoothstep(0.025, 0.0, abs(md - 0.45));",
      "  gl_FragColor = vec4(col, 1.0);",
      "  #include <fog_fragment>",
      "  #include <tonemapping_fragment>",
      "  #include <colorspace_fragment>",
      "}"
    ].join("\n")
  });

  // Local +Y of a PlaneGeometry maps to world -Z after rotateX(-PI/2), so a tall
  // plane covers the street. Center sits under the roadway.
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(32, 96), groundMat);
  ground.rotation.x = -Math.PI / 2;
  ground.position.set(-4.0, ROAD_Y, -28);
  ground.renderOrder = 0;
  scene.add(ground);

  function renderReflection() {
    camera.updateMatrixWorld();
    ground.updateMatrixWorld();
    reflWorld.setFromMatrixPosition(ground.matrixWorld);
    camWorld.setFromMatrixPosition(camera.matrixWorld);
    reflRot.extractRotation(ground.matrixWorld);
    reflNormal.set(0, 0, 1).applyMatrix4(reflRot);
    reflView.subVectors(reflWorld, camWorld);
    if (reflView.dot(reflNormal) > 0) return;

    reflView.reflect(reflNormal).negate();
    reflView.add(reflWorld);
    reflRot.extractRotation(camera.matrixWorld);
    reflLook.set(0, 0, -1).applyMatrix4(reflRot).add(camWorld);
    reflTargetPos.subVectors(reflWorld, reflLook);
    reflTargetPos.reflect(reflNormal).negate();
    reflTargetPos.add(reflWorld);

    virtualCamera.position.copy(reflView);
    virtualCamera.up.set(0, 1, 0).applyMatrix4(reflRot).reflect(reflNormal);
    virtualCamera.lookAt(reflTargetPos);
    virtualCamera.far = camera.far;
    virtualCamera.near = camera.near;
    virtualCamera.updateMatrixWorld();
    virtualCamera.projectionMatrix.copy(camera.projectionMatrix);

    textureMatrix.set(
      0.5, 0.0, 0.0, 0.5,
      0.0, 0.5, 0.0, 0.5,
      0.0, 0.0, 0.5, 0.5,
      0.0, 0.0, 0.0, 1.0
    );
    textureMatrix.multiply(virtualCamera.projectionMatrix);
    textureMatrix.multiply(virtualCamera.matrixWorldInverse);

    reflPlane.setFromNormalAndCoplanarPoint(reflNormal, reflWorld);
    reflPlane.applyMatrix4(virtualCamera.matrixWorldInverse);
    reflClip.set(reflPlane.normal.x, reflPlane.normal.y, reflPlane.normal.z, reflPlane.constant);
    const pe = virtualCamera.projectionMatrix.elements;
    reflQ.x = (Math.sign(reflClip.x) + pe[8]) / pe[0];
    reflQ.y = (Math.sign(reflClip.y) + pe[9]) / pe[5];
    reflQ.z = -1;
    reflQ.w = (1.0 + pe[10]) / pe[14];
    reflClip.multiplyScalar(2.0 / reflClip.dot(reflQ));
    const clipBias = 0.012;
    pe[2] = reflClip.x;
    pe[6] = reflClip.y;
    pe[10] = reflClip.z + 1.0 - clipBias;
    pe[14] = reflClip.w;

    const vis = [];
    for (let i = 0; i < hiddenInRefl.length; i++) {
      vis.push(hiddenInRefl[i].visible);
      hiddenInRefl[i].visible = false;
    }
    ground.visible = false;
    const prev = renderer.getRenderTarget();
    const xr = renderer.xr.enabled;
    renderer.xr.enabled = false;
    renderer.setRenderTarget(reflTarget);
    renderer.clear();
    renderer.render(scene, virtualCamera);
    renderer.setRenderTarget(prev);
    renderer.xr.enabled = xr;
    ground.visible = true;
    for (let i = 0; i < hiddenInRefl.length; i++) hiddenInRefl[i].visible = vis[i];
  }

  function sidewalk(x0, x1, z0, z1) {
    const w = Math.abs(x1 - x0), d = Math.abs(z1 - z0);
    const m = add(box(w, WALK_H, d, matSidewalk), (x0 + x1) / 2, WALK_H / 2, (z0 + z1) / 2);
    m.receiveShadow = false;
    return m;
  }

  sidewalk(SIDE_FAR_X0, CURB_FAR, 10, -21.75);
  sidewalk(SIDE_FAR_X0, CURB_FAR, -29.75, -56);

  const trimOf = {
    green: matTrimGreen,

    stone: matStone,
    red: std(0x4a2420, 0.7, 0.08)
  };

  function placeSign(tex, x, y, z, w, h, outward, opts) {
    opts = opts || {};
    const mat = new THREE.MeshBasicMaterial({
      map: tex, transparent: true, depthWrite: false,
      toneMapped: opts.toneMapped === true,
      side: THREE.DoubleSide,
      blending: opts.additive ? THREE.AdditiveBlending : THREE.NormalBlending
    });
    const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    // Plane faces +Z. Rotate so +Z points along the street-facing normal (±X).
    mesh.rotation.y = outward > 0 ? Math.PI / 2 : -Math.PI / 2;
    if (opts.flip) mesh.scale.x = -1;
    add(mesh, x, y, z);
    return mesh;
  }

  function addWindow(x, y, z, w, h, outward, mat) {
    const yaw = outward > 0 ? Math.PI / 2 : -Math.PI / 2;
    // A larger dark plane sits just behind the lit pane so the frame is a border,
    // not a box that would swallow the glass.
    const frame = new THREE.Mesh(new THREE.PlaneGeometry(w + 0.12, h + 0.12), matTrim);
    frame.rotation.y = yaw;
    add(frame, x - outward * 0.025, y, z);
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.rotation.y = yaw;
    add(m, x, y, z);
    return m;
  }

  function lampGlow(x, y, z, scale, color) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: color || 0xffc080, transparent: true,
      blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.85
    }));
    s.scale.set(scale, scale, 1);
    s.position.set(x, y, z);
    scene.add(s);
    return s;
  }

  let neonCount = 0;
  function registerNeon(x, y, z, color, intensity) {
    if (neonCount >= NN) return;
    neonPos[neonCount].set(x, y, z);
    neonCol[neonCount].set(color);
    neonI[neonCount] = intensity;
    neonCount++;
  }

  const buildings = [];

  function addBuilding(opt) {
    const z0 = Math.min(opt.z0, opt.z1);
    const z1 = Math.max(opt.z0, opt.z1);
    const width = z1 - z0;
    const zc = (z0 + z1) * 0.5;
    const h = opt.h || 8.1;
    const depth = opt.depth || 7.3;
    const outward = opt.outward;
    const face = opt.face;
    const cx = face - outward * (depth * 0.5);
    const mat = brickMat(opt.tint || 0x7a5348, Math.max(width, depth), h, !!opt.painted);
    const mass = add(box(depth, h, width, mat), cx, h * 0.5, zc);
    const trim = trimOf[opt.trim || "black"];
    add(box(0.22, 0.16, width + 0.04, trim), face + outward * 0.06, 3.40, zc);
    add(box(depth + 0.12, 0.18, width + 0.08, trim), cx, h + 0.06, zc);
    if (opt.chimney) {
      add(box(0.46, 1.1, 0.46, matTrim), cx - outward * 1.2, h + 0.7, zc + width * 0.25);
    }

    const winY = Math.min(h - 1.15, (h + 3.55) * 0.5);
    const winH = Math.min(1.32, (h - 4.1) * 0.48);
    let wi = 0;
    for (let z = z0 + 0.95; z <= z1 - 0.95; z += 1.72) {
      const n = hash(z * 4.1 + face);
      let matW = WIN.off;
      const lit = n > (opt.dark ? 0.72 : 0.38);
      if (lit) {
        if (n > 0.93) matW = WIN.tv;
        else if (n > 0.78) matW = WIN.blinds;
        else if (opt.cool) matW = WIN.cool;
        else if (n > 0.55) matW = WIN.warm;
        else matW = WIN.warmDim;
      }
      addWindow(face + outward * 0.035, winY, z, 0.82, winH, outward, matW);
      wi++;
    }

    if (!opt.custom) {
      const gy = 1.65;
      for (let z = z0 + 1.15; z <= z1 - 1.15; z += 2.15) {
        const n = hash(z * 8.2 + 2.0);
        const matW = n > 0.62 ? WIN.warm : (n > 0.4 ? WIN.warmDim : WIN.off);
        addWindow(face + outward * 0.04, gy, z, 1.35, 1.85, outward, matW);
      }
      add(box(0.12, 2.15, 0.92, std(0x2a1c14, 0.7, 0.05)), face + outward * 0.08, 1.15, z0 + 0.7);
    }
    buildings.push({ opt: opt, z0: z0, z1: z1, zc: zc, h: h, face: face, outward: outward, width: width });
    return { z0: z0, z1: z1, zc: zc, h: h, face: face, outward: outward, width: width };
  }

  function awning(b, tex, y) {
    const w = Math.min(b.width - 0.5, b.width * 0.92);
    const mesh = box(0.95, 0.045, w, new THREE.MeshStandardMaterial({
      map: tex, roughness: 0.8, metalness: 0.0, color: 0xffffff
    }));
    mesh.rotation.z = -b.outward * 0.22;
    add(mesh, b.face + b.outward * 0.52, y || 3.05, b.zc);
    add(box(0.08, 0.08, w, matTrim), b.face + b.outward * 0.08, (y || 3.05) + 0.12, b.zc);
  }

  function diorama(b, backColor, emissive, intensity) {
    const back = new THREE.Mesh(
      new THREE.PlaneGeometry(Math.min(b.width - 0.8, b.width * 0.86), 2.35),
      new THREE.MeshStandardMaterial({ color: backColor, emissive: emissive, emissiveIntensity: intensity, roughness: 0.8 })
    );
    back.rotation.y = b.outward > 0 ? Math.PI / 2 : -Math.PI / 2;
    add(back, b.face + b.outward * 0.06, 1.72, b.zc);
    const glassW = Math.min(b.width - 1.1, b.width * 0.8);
    const glass = new THREE.Mesh(new THREE.PlaneGeometry(glassW, 2.15), matGlass);
    glass.rotation.y = b.outward > 0 ? Math.PI / 2 : -Math.PI / 2;
    glass.renderOrder = 2;
    add(glass, b.face + b.outward * 0.46, 1.68, b.zc);
    // piers
    const zL = b.zc - glassW * 0.5 - 0.18;
    const zR = b.zc + glassW * 0.5 + 0.18;
    add(box(0.5, 3.25, 0.28, matTrim), b.face + b.outward * 0.24, 1.62, zL);
    add(box(0.5, 3.25, 0.28, matTrim), b.face + b.outward * 0.24, 1.62, zR);
    return { glassW: glassW };
  }

  (function dinerInterior() {

  (function dinerSigns() {

    const sign = placeSign(tex, f + o * 0.2, 3.72, diner.zc, 3.4, 0.95, o);
    frameFns.push(function (t) {

    const pts = [];
    for (let i = 0; i <= 7; i++) {
      const t = i / 7;
      pts.push(new THREE.Vector3(
        a.x + (b.x - a.x) * t,
        y - Math.sin(Math.PI * t) * sag,
        a.z + (b.z - a.z) * t
      ));
    }
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), wireMat));
  }

  function makeWheel(parent, x, y, z) {
    const orient = new THREE.Group();
    orient.position.set(x, y, z);
    // Cylinder axis is local +Y. rotation.z = +PI/2 lays that axis along local -X,
    // which is the axle across a car whose nose points +Z.
    orient.rotation.z = Math.PI / 2;
    parent.add(orient);
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.34, 0.34, 0.2, 12), matRubber);
    orient.add(w);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.22, 10), matMetal);
    orient.add(cap);
    return w;
  }

  // ---------------------------------------------------------------------------
  // Rain — vertical streaks billboarded around the standing point
  // ---------------------------------------------------------------------------
  const RAIN_N = smallScreen ? 900 : 2200;
  const rainGeo = new THREE.PlaneGeometry(1, 1, 1, 1);
  const off = new Float32Array(RAIN_N * 3);
  const spd = new Float32Array(RAIN_N);
  const len = new Float32Array(RAIN_N);
  for (let i = 0; i < RAIN_N; i++) {
    const near = i < RAIN_N * 0.55;
    const x0 = near ? -3 : -16, x1 = near ? 6 : 8;
    const z0 = near ? -6 : -32, z1 = near ? 8 : 14;
    off[i * 3] = x0 + Math.random() * (x1 - x0);
    off[i * 3 + 1] = Math.random() * 12;
    off[i * 3 + 2] = z0 + Math.random() * (z1 - z0);
    spd[i] = 8 + Math.random() * 6;
    len[i] = (near ? 0.55 : 0.4) + Math.random() * 0.55;
  }
  rainGeo.setAttribute("aOff", new THREE.InstancedBufferAttribute(off, 3));
  rainGeo.setAttribute("aSpd", new THREE.InstancedBufferAttribute(spd, 1));
  rainGeo.setAttribute("aLen", new THREE.InstancedBufferAttribute(len, 1));
  const rainMat = new THREE.ShaderMaterial({
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    fog: false,
    uniforms: { uTime: { value: 0 }, uWind: { value: new THREE.Vector2(0.55, 0.15) } },
    vertexShader: [
      "attribute vec3 aOff;",
      "attribute float aSpd;",
      "attribute float aLen;",
      "uniform float uTime;",
      "uniform vec2 uWind;",
      "varying float vA;",
      "void main() {",
      "  vec3 p = aOff;",
      "  float cycle = 12.5;",
      "  p.y = mod(p.y - uTime * aSpd, cycle);",
      "  p.x += uWind.x * (1.0 - p.y / cycle);",
      "  p.z += uWind.y * (1.0 - p.y / cycle);",
      "  vec3 toCam = cameraPosition - p;",
      "  toCam.y = 0.0;",
      "  if (dot(toCam, toCam) < 1e-4) toCam = vec3(0.0, 0.0, 1.0);",
      "  vec3 right = normalize(cross(vec3(0.0, 1.0, 0.0), normalize(toCam)));",
      "  vec3 wpos = p + right * position.x * 0.015 + vec3(uWind.x * 0.08, 1.0, uWind.y * 0.08) * position.y * aLen;",
      "  vec4 mvPosition = viewMatrix * vec4(wpos, 1.0);",
      "  gl_Position = projectionMatrix * mvPosition;",
      "  float dist = length(cameraPosition - p);",
      "  vA = smoothstep(26.0, 8.0, dist) * smoothstep(0.25, 1.4, dist) * smoothstep(0.15, 1.0, p.y);",
      "}"
    ].join("\n"),
    fragmentShader: [
      "varying float vA;",
      "void main() {",
      "  gl_FragColor = vec4(0.78, 0.82, 0.9, 0.13 * vA);",
      "  #include <colorspace_fragment>",

    ].join("\n")

    const pud = PUDDLES[i % PUDDLES.length];
    ripples[i].x = pud.x + (Math.random() - 0.5) * pud.rx * 1.4;
    ripples[i].y = pud.z + (Math.random() - 0.5) * pud.rz * 1.4;
    ripples[i].z = age;
  }
  for (let i = 0; i < RIP_N; i++) spawnRipple(i, -Math.random() * 2.2);
  let rippleCursor = 0;
  let rippleAcc = 0;

  // Trash can by the diner, newspaper box, hydrant — small street furniture.
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.24, 0.7, 10), matMetal), -9.15, WALK_H + 0.35, -2.2);
  add(box(0.45, 0.7, 0.32, std(0x1d3a5c, 0.6, 0.2)), 2.7, WALK_H + 0.35, 0.4);
  add(new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.48, 8), std(0x8a1c18, 0.55, 0.2)), 0.95, WALK_H + 0.24, -1.3);

  // Bench, built only into a group (the earlier attempt is cleaned up below).
  (function buildBench() {
    const g = new THREE.Group();
    const wood = std(0x6b4a32, 0.78, 0.02);
    function put(mesh, x, y, z) { mesh.position.set(x, y, z); g.add(mesh); return mesh; }
    put(box(0.5, 0.06, 1.45, wood), 0, 0.48, 0);
    put(box(0.08, 0.42, 1.45, wood), -0.2, 0.72, 0);
    [[-0.18, 0.62], [-0.18, -0.62], [0.18, 0.62], [0.18, -0.62]].forEach(function (p) {
      put(box(0.06, 0.48, 0.06, matMetal), p[0], 0.24, p[1]);
    });
    g.position.set(2.72, WALK_H, 2.05);
    g.rotation.y = Math.PI / 2; // seat faces the street (-X) if local -Z is the back... 
    // Local seat extends on Z, backrest at -X. We want the back toward the building (+X)
    // and the seat opening toward the street (-X). Backrest is at local -X? I placed
    // backrest at x=-0.2. Parent rotation.y = PI points local -X to world +X.
    g.rotation.y = Math.PI;
    scene.add(g);
  })();

  // ---------------------------------------------------------------------------
  // Look-around
  // ---------------------------------------------------------------------------
  const el = renderer.domElement;
  let lastPX = 0, lastPY = 0;
  function pointerDown(e) {
    dragging = true;
    lastPX = e.clientX;
    lastPY = e.clientY;
    velX = 0; velY = 0;
    el.setPointerCapture(e.pointerId);
    hint.classList.add("hide");
  }
  function pointerMove(e) {
    if (!dragging) return;
    const dx = e.clientX - lastPX;
    const dy = e.clientY - lastPY;
    lastPX = e.clientX;
    lastPY = e.clientY;
    const sens = smallScreen ? 0.0048 : 0.0036;
    // Drag right looks right: negative yaw. Drag down looks down: positive lookX.
    velY = -dx * sens;
    velX = dy * sens;
    lookY += velY;
    lookX += velX;
    applyLook();
  }
  function pointerUp() { dragging = false; }
  el.addEventListener("pointerdown", pointerDown);
  el.addEventListener("pointermove", pointerMove);
  window.addEventListener("pointerup", pointerUp);
  el.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  window.addEventListener("keydown", function (e) {
    const step = 0.06;
    if (e.key === "ArrowLeft") lookY += step;
    else if (e.key === "ArrowRight") lookY -= step;
    else if (e.key === "ArrowUp") lookX -= step;
    else if (e.key === "ArrowDown") lookX += step;
    else return;
    applyLook();
    hint.classList.add("hide");
  });
  setTimeout(function () { hint.classList.add("hide"); }, 4200);

  function fit() {
    const w = window.innerWidth, h = window.innerHeight;
    const pr = Math.min(window.devicePixelRatio || 1, smallScreen ? 1.25 : 1.5);
    renderer.setPixelRatio(pr);
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    const aspect = camera.aspect;
    if (aspect < 0.85) camera.fov = 74;
    else if (aspect < 1.25) camera.fov = 52;
    else camera.fov = 40;
    camera.updateProjectionMatrix();
    const rw = Math.max(256, Math.min(smallScreen ? 480 : 768, Math.floor(w * pr * 0.55)));
    const rh = Math.max(192, Math.min(smallScreen ? 480 : 432, Math.floor(h * pr * 0.55)));
    reflTarget.setSize(rw, rh);
  }
  window.addEventListener("resize", fit);
  fit();

  // Stray meshes from the abandoned makeSedan/bench experiments sit at the origin.
  // Sweep anything that landed on the origin unintentionally: none should, because
  // makeSedan was never called. The first bench IIFE did call add() which parents
  // to the scene AND to the group. Remove objects whose position is exactly 0,0,0
  // and whose geometry is a bench slat — safer to remove the known leftovers by
  // not having called the bad path's scene-level boxes. The bad bench IIFE DID run.
  // Those boxes were added at local offsets via add(mesh, x, y, z, bench) which
  // sets world position to the offset and parents to the group (not the scene),
  // because add() does (parent || scene).add. Parent was passed, so they are only
  // on the group. The group itself was never added to the scene. No leftovers.
  // Good.

  const clock = new THREE.Clock();
  let elapsed = 0;
  window.__frames = 0;

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    elapsed += dt;
    if (!dragging) {
      lookX += velX;
      lookY += velY;
      velX *= Math.pow(0.04, dt);
      velY *= Math.pow(0.04, dt);
      if (Math.abs(velX) < 1e-4) velX = 0;
      if (Math.abs(velY) < 1e-4) velY = 0;
      applyLook();
    }

    // Oncoming car, nose toward +Z, composed so the opening seconds show headlights
    // just past the diner. Slow enough that a late screenshot still catches it.
    const zA = -16.5 + elapsed * 3.1;
    const spanA = 48;
    carA.position.set(-1.85, 0, ((zA + 30) % spanA + spanA) % spanA - 30);
    carA.rotation.y = 0;
    const zB = -15.5 - elapsed * 4.6;
    carB.position.set(-5.15, 0, -(((-zB + 20) % 52 + 52) % 52) + 8);
    // Keep car B on a simple wrap heading downtown (-Z).
    carB.position.z = ((zB + 42) % 56 + 56) % 56 - 42;
    carB.rotation.y = Math.PI;

    const spinA = elapsed * 3.4 / 0.34;
    const spinB = elapsed * 4.6 / 0.34;
    carA.userData.wheels.forEach(function (w) { w.rotation.y = spinA; });
    carB.userData.wheels.forEach(function (w) { w.rotation.y = -spinB; });

    carA.updateMatrixWorld(true);
    _hw.copy(carA.userData.headLocal[0]);
    carA.localToWorld(_hw);
    headSpot.position.copy(_hw);
    headSpot.target.position.set(_hw.x, 0.25, _hw.z + 14);
    headSpot.target.updateMatrixWorld();

    writeCarLights(carA, 6.5, 0.0, 0, 1);
    writeCarLights(carB, 0.15, 1.4, 2, 3);

    rainMat.uniforms.uTime.value = elapsed;
    rainMat.uniforms.uWind.value.set(0.45 + Math.sin(elapsed * 0.23) * 0.35, 0.12);
    groundMat.uniforms.uTime.value = elapsed;

    rippleAcc += dt;
    const interval = smallScreen ? 0.22 : 0.14;
    while (rippleAcc > interval) {
      rippleAcc -= interval;
      ripples[rippleCursor].x = 0; // overwritten
      spawnRipple(rippleCursor, elapsed);
      rippleCursor = (rippleCursor + 1) % RIP_N;
    }

    for (let i = 0; i < frameFns.length; i++) frameFns[i](elapsed);

    renderReflection();
    renderer.render(scene, camera);
    window.__frames++;
  }

  window.__setLook = function (x, y) { lookX = x; lookY = y; velX = 0; velY = 0; applyLook(); };
  window.__fwd = function () {
    const v = new THREE.Vector3();
    camera.getWorldDirection(v);
    return [v.x, v.y, v.z];
  };
  window.__carZ = function () { return carA.position.z; };
  window.__ready = true;

  requestAnimationFrame(frame);
})();
</script>
</body>
