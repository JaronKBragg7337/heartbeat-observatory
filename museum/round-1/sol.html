if(frame%2===0||Math.abs(targetYaw-yaw)>.002)renderReflection();renderer.setRenderTarget(sceneTarget);renderer.render(scene,camera);quad.material=brightMat;renderer.setRenderTarget(bloomA);renderer.render(screenScene,screenCamera);quad.material=blurMat;blurMat.uniforms.uImage.value=bloomA.texture;blurMat.uniforms.uStep.value.set(1/bloomA.width,0);renderer.setRenderTarget(bloomB);renderer.render(screenScene,screenCamera);blurMat.uniforms.uImage.value=bloomB.texture;blurMat.uniforms.uStep.value.set(0,1/bloomB.height);renderer.setRenderTarget(bloomA);renderer.render(screenScene,screenCamera);quad.material=finalMat;renderer.setRenderTarget(null);renderer.render(screenScene,screenCamera);frame++;if(frame===3){loading.classList.add('hide');document.documentElement.dataset.ready='true';}if(frame===120&&avgMs>30&&renderer.getPixelRatio()>1){renderer.setPixelRatio(1);size();}window.sceneStats={frames:frame,frameMs:Math.round(avgMs),drawCalls:renderer.info.render.calls,objects:scene.children.length};}
requestAnimationFrame(tick);document.addEventListener('visibilitychange',()=>{active=!document.hidden;last=performance.now();});
// Drag, touch, and keyboard all share the same gently damped fixed viewpoint.
let dragging=false,px=0,py=0;const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{dragging=true;px=e.clientX;py=e.clientY;canvas.setPointerCapture(e.pointerId);document.getElementById('hint').style.opacity='0';});canvas.addEventListener('pointermove',e=>{if(!dragging)return;targetYaw-= (e.clientX-px)*.003;targetPitch+= (e.clientY-py)*.0022;targetYaw=T.MathUtils.clamp(targetYaw,-1.24,.54);targetPitch=T.MathUtils.clamp(targetPitch,-.28,.50);px=e.clientX;py=e.clientY;});function release(){dragging=false;}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);canvas.addEventListener('lostpointercapture',release);canvas.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();if(e.key==='ArrowLeft')targetYaw-=.08;if(e.key==='ArrowRight')targetYaw+=.08;if(e.key==='ArrowUp')targetPitch+=.05;if(e.key==='ArrowDown')targetPitch-=.05;targetYaw=T.MathUtils.clamp(targetYaw,-1.24,.54);targetPitch=T.MathUtils.clamp(targetPitch,-.28,.50);});
// Optional synthesized rain: no recording, media file, or network request.
let audioCtx=null,audioGain=null;document.getElementById('sound').addEventListener('click',async()=>{const button=document.getElementById('sound');if(!audioCtx){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return;audioCtx=new Audio();const buffer=audioCtx.createBuffer(2,audioCtx.sampleRate*4,audioCtx.sampleRate);for(let ch=0;ch<2;ch++){const samples=buffer.getChannelData(ch);let prev=0;for(let i=0;i<samples.length;i++){prev=(prev+Math.random()*.13-.065)/1.02;samples[i]=prev*2.4+(Math.random()-.5)*.11;}}const src=audioCtx.createBufferSource();src.buffer=buffer;src.loop=true;const filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=2300;audioGain=audioCtx.createGain();audioGain.gain.value=0;src.connect(filter);filter.connect(audioGain);audioGain.connect(audioCtx.destination);src.start();}await audioCtx.resume();const on=button.getAttribute('aria-pressed')!=='true';audioGain.gain.setTargetAtTime(on?.45:0,audioCtx.currentTime,.6);button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'Turn rain sound off':'Turn rain sound on');});
