<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07090c" />
  <title>Grand Palace Cinema — Heartbeat Observatory</title>
  <!-- The 3D theater: Grand Palace Cinema, from github.com/JaronKBragg7337/Movie-Theater-Three.js-Asset- (CC0).
       Walk in, sit in any of its 448 seats, and play the built-in films, a link (mp4 / webm / YouTube / TikTok)
       or a video from your own device. Shown the same way as the game pages: the asset's own live build in a frame,
       so fixes made in that repo appear here with no copy to keep in sync. -->
  <style>
    :root { color-scheme: dark; background: #07090c; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #07090c; }
    body { min-height: 100vh; min-height: 100dvh; }
    main { position: fixed; inset: 0; overflow: hidden; background: #07090c; }
    iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #07090c; }
    .back { position: fixed; z-index: 2; top: calc(10px + env(safe-area-inset-top)); left: calc(10px + env(safe-area-inset-left));
      padding: 7px 12px; border-radius: 999px; background: rgba(7, 9, 12, .72); border: 1px solid #2c3940; color: #cfe0e6;
      font: 600 13px system-ui, -apple-system, sans-serif; text-decoration: none; }
  </style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <main>
    <iframe
      title="Grand Palace Cinema"
      src="https://jaronkbragg7337.github.io/Movie-Theater-Three.js-Asset-/"
      allow="fullscreen; autoplay; pointer-lock; encrypted-media; picture-in-picture; clipboard-write"
      allowfullscreen
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
      <p>Your browser cannot display the 3D theater. <a href="https://jaronkbragg7337.github.io/Movie-Theater-Three.js-Asset-/">Open it directly</a>.</p>
    </iframe>
  </main>
  <a class="back" id="back" href="/video">&larr; Theater</a>
  <script>
    // Coming through a world's theater door (?start=seats&from=ashgrove|town|world2): pass the start through to
    // the theater so it seats you, and make the way back lead to the world you came from.
    (function () {
      var q = new URLSearchParams(location.search);
      var worlds = { ashgrove: ["/world3/", "Ashgrove"], town: ["/engine/hub/", "Town Square"], world2: ["/world2/", "World 2"] };
      var from = worlds[q.get("from")];
      if (from) { var a = document.getElementById("back"); a.href = from[0]; a.textContent = "\u2190 " + from[1]; }
      if (q.get("start") === "seats") {
        var f = document.querySelector("iframe");
        f.src = f.src.split("?")[0] + "?start=seats";
      }
    })();
  </script>
<script type="module" src="/video/3d/shared-room.js?v=2"></script>
<script defer src="/hb-editor.js"></script>
</body>
</html>
