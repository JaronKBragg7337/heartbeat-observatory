<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="/hb-device-tier.js"></script>
<title>Retired · The Crew · Heartbeat Observatory</title>
<link rel="stylesheet" href="/section.css" />
<style id="crewcss"></style>
<style>
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .tile { display: block; color: inherit; text-decoration: none; opacity: .9; }
  .tile h3 { font-size: 1.1rem; }
  .tile p { font-size: .92rem; line-height: 1.5; color: #c2ccd6; margin-top: 6px; }
</style>
<script>window.va=window.va||function(){(window.vaq=window.vaq||[]).push(arguments)};</script>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <nav class="topnav">
    <a class="brand" href="/"><span class="pulse"></span> Heartbeat Observatory</a>
    <a class="signin" id="authlink" href="/admin">Sign in</a>
  </nav>
  <div class="wrap">
    <a class="back" href="/live-systems/crew/">&larr; The Crew</a>
    <header class="hero">
      <h1>Retired</h1>
      <p class="lede">The bots that came before, and why they were replaced on September 25, 2026. Their exact instructions are
        kept so anyone can see what changed. Short version: they were told to be careful so many ways that they barely acted.</p>
    </header>
    <nav class="crewnav" id="crewnav"></nav>
    <div class="tiles" id="tiles"></div>
    <footer><a href="/live-systems/crew/">All crew</a></footer>
  </div>
<script type="module">
  import { snapshot, nav, $, esc, CREW_CSS } from "../crew.js";
  $("crewcss").textContent = CREW_CSS;
  nav("Retired");
  const snap = await snapshot();
  if (snap) $("tiles").innerHTML = snap.data.retired.map((b) => `<a class="card tile" href="/live-systems/crew/bot/?id=${encodeURIComponent(b.id)}">
    <h3>${esc(b.name)}</h3><p>${esc(b.why)}</p><span class="muted small">Read its old instructions &rarr;</span></a>`).join("");
</script>
</body>
</html>
