<!DOCTYPE html>
<html lang="en" data-zone="a">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1d2a22">
<title>The Arena · Page A - Heartbeat Observatory</title>
<meta name="description" content="A paintball field split across two real pages. Load page A and you play for team A. Paintballs fly across the line from one page into the other.">
<link rel="stylesheet" href="/lab/arena/arena.css?v=2">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

</script>

<body>
<canvas id="gl"></canvas>
<div id="loading">THE ARENA · PAGE A</div>
<div id="score" aria-live="polite"></div>

<script defer src="/shell/shell.js?v=8"></script>
<script type="module" src="/lab/arena/arena.js?v=2"></script>

</html>
