<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Voice lab — can the world talk?</title>
<!--
  lab/voice — a measurement, not a feature.

  Question it answers: can a real neural voice run entirely inside the world,
  in the browser, live, with no server call and no pre-baked audio?

  Everything here is client-side. Kokoro-82M (Apache 2.0) is fetched once and
  cached by the browser, then speech is generated at runtime from words decided
  at that moment. The only call to us is /api/news for today's real headlines.

  It prints its own numbers, because a claim about speed is worthless without
  the device it was measured on.
-->
<style>
  :root{ --bg:#0b0d10; --fg:#e6e8ea; --dim:#8b939c; --ok:#6ee7a8; --warn:#f5c96b; --bad:#f58b8b; --line:#1d2229; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
       padding:20px 16px calc(40px + env(safe-area-inset-bottom));max-width:640px;margin-inline:auto}
  h1{font-size:17px;margin:0 0 4px;letter-spacing:.02em}
  .sub{color:var(--dim);margin:0 0 20px;font-size:13px}
  button{font:inherit;background:#171c22;color:var(--fg);border:1px solid var(--line);
         border-radius:10px;padding:14px 18px;width:100%;margin:6px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{background:#1f262e}
  button[disabled]{opacity:.45}
  .row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid var(--line)}
  .row span:first-child{color:var(--dim)}
  .row span:last-child{text-align:right}
  .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  #meter{height:26px;background:#12161b;border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:14px 0 4px}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#2f6f4f,#6ee7a8);transition:width .04s linear}
  .cap{color:var(--dim);font-size:12px;margin:0 0 18px}
  #log{white-space:pre-wrap;color:var(--dim);font-size:12.5px;margin-top:18px}
  h2{font-size:13px;color:var(--dim);font-weight:400;margin:22px 0 6px;text-transform:uppercase;letter-spacing:.08em}
</style>

<h1>Voice lab</h1>
<p class="sub">Can a real voice run inside the world — live, client-side, nothing pre-baked?</p>

<button id="load">1 &nbsp;Load the voice model</button>
<button id="speak" disabled>2 &nbsp;Read today's real headlines</button>

<div id="meter"><div id="bar"></div></div>
<p class="cap">&uarr; live amplitude &mdash; this is the signal that drives a mouth</p>

<h2>Measured on this device</h2>
<div id="stats"></div>

<div id="log"></div>

<script type="module">
const $ = s => document.querySelector(s);
const stats = $('#stats'), logEl = $('#log');
const S = {};

function row(k, v, cls){
  let el = document.getElementById('r-' + k.replace(/\W+/g,'-'));
  if(!el){
    el = document.createElement('div');
    el.className = 'row';
    el.id = 'r-' + k.replace(/\W+/g,'-');
    el.innerHTML = '<span></span><span></span>';
    stats.appendChild(el);
  }
  el.children[0].textContent = k;
  el.children[1].textContent = v;
  el.children[1].className = cls || '';
}
function log(m){ logEl.textContent += m + '\n'; }

// ---- device -------------------------------------------------------------
let device = 'wasm', dtype = 'q8', adapter = null;
try { if('gpu' in navigator) adapter = await navigator.gpu.requestAdapter(); } catch(e){}
if(adapter){ device = 'webgpu'; dtype = 'fp32'; }

row('backend', device === 'webgpu' ? 'WebGPU (fp32)' : 'WebAssembly (q8)', device === 'webgpu' ? 'ok' : 'warn');
row('cpu threads', String(navigator.hardwareConcurrency ?? 'unknown'));
row('model download', device === 'webgpu' ? '~326 MB once, then cached' : '~92 MB once, then cached');

// ---- audio graph --------------------------------------------------------
let ctx, analyser, master, nextTime = 0;
function initAudio(){
  if(ctx) return;
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  master.connect(analyser);
  analyser.connect(ctx.destination);
  const data = new Float32Array(analyser.fftSize);
  const bar = $('#bar');
  (function tick(){
    analyser.getFloatTimeDomainData(data);
    let s = 0;
    for(let i = 0; i < data.length; i++) s += data[i] * data[i];
    bar.style.width = Math.min(100, Math.sqrt(s / data.length) * 420) + '%';
    requestAnimationFrame(tick);
  })();
}
function playChunk(audio){
  const buf = ctx.createBuffer(1, audio.audio.length, audio.sampling_rate);
  buf.copyToChannel(audio.audio, 0);
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(master);
  const at = Math.max(ctx.currentTime + 0.02, nextTime);
  src.start(at);
  nextTime = at + buf.duration;
  return buf.duration;
}

// ---- load ---------------------------------------------------------------
let KokoroTTS, TextSplitterStream, tts;

$('#load').onclick = async () => {
  $('#load').disabled = true;
  $('#load').textContent = '1  Loading…';
  initAudio();
  try{
    const t0 = performance.now();
    ({ KokoroTTS, TextSplitterStream } = await import('https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm'));
    row('library import', Math.round(performance.now() - t0) + ' ms');

    let total = 0;
    const t1 = performance.now();
    tts = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
      dtype, device,
      progress_callback: p => {
        if(p.status === 'progress' && p.total){
          total = Math.max(total, p.total);
          $('#load').textContent = '1  Loading… ' + (p.loaded/1e6).toFixed(0) + ' / ' + (total/1e6).toFixed(0) + ' MB';
        }
      }
    });
    S.load = Math.round(performance.now() - t1);
    row('model load (cold)', (S.load/1000).toFixed(1) + ' s', S.load < 20000 ? 'ok' : 'warn');
    $('#load').textContent = '1  Voice model ready';
    $('#speak').disabled = false;
  }catch(e){
    row('model load', 'FAILED', 'bad');
    log(String(e));
    $('#load').textContent = '1  Failed — see log';
  }
};

// ---- speak --------------------------------------------------------------
$('#speak').onclick = async () => {
  $('#speak').disabled = true;
  $('#speak').textContent = '2  Fetching headlines…';
  if(ctx.state === 'suspended') await ctx.resume();
  nextTime = 0;
  try{
    let items = [];
    try{
      const r = await fetch('/api/news');
      items = (await r.json()).items || [];
    }catch(e){}
    if(!items.length) items = [{ title: 'The news feed is offline, so this is a stand-in line' }];
    row('headlines', items.length + ' from /api/news');

    const script = 'Good evening. Here is what is happening right now. ' +
      items.slice(0,4).map(i => i.title.replace(/\s+/g,' ').trim() + '.').join(' ');
    log('\nscript:\n' + script + '\n');

    $('#speak').textContent = '2  Speaking…';
    const splitter = new TextSplitterStream();
    const stream = tts.stream(splitter, { voice: 'am_onyx' });
    const t0 = performance.now();
    let first = null, spoken = 0, chunks = 0;

    const consume = (async () => {
      for await (const { audio } of stream){
        if(first === null){
          first = Math.round(performance.now() - t0);
          row('time to first sound', first + ' ms', first < 1800 ? 'ok' : 'warn');
        }
        spoken += playChunk(audio);
        chunks++;
      }
    })();

    for(const tok of script.match(/\s*\S+/g)) splitter.push(tok);
    splitter.close();
    await consume;

    const gen = performance.now() - t0;
    const rtf = gen / 1000 / spoken;
    row('audio produced', spoken.toFixed(1) + ' s in ' + (gen/1000).toFixed(1) + ' s');
    row('real-time factor', rtf.toFixed(2) + '× ' + (rtf < 1 ? '(faster than speech)' : '(slower than speech)'),
        rtf < 1 ? 'ok' : (rtf < 1.3 ? 'warn' : 'bad'));
    row('chunks streamed', String(chunks));

    $('#speak').textContent = '2  Read it again';
    $('#speak').disabled = false;
  }catch(e){
    row('speech', 'FAILED', 'bad');
    log(String(e));
    $('#speak').textContent = '2  Failed — see log';
    $('#speak').disabled = false;
  }
};
</script>
</html>
