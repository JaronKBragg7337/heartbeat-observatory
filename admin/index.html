<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in · Heartbeat Observatory</title>
<style>
  :root { --bg:#070a0f; --panel:#0e131b; --line:#1c2530; --text:#e6edf3; --muted:#7d8896;
    --beat:#e23a45; --ok:#3fb950; --amber:#d9a23a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:40px 20px; }
  .wrap { width:100%; max-width:640px; }
  .mark { display:inline-flex; align-items:center; gap:10px; font-size:13px; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--muted); }
  .pulse { width:9px; height:9px; border-radius:50%; background:var(--beat); }
  h1 { font-size:24px; font-weight:600; margin:14px 0 4px; }
  .lede { color:var(--muted); font-size:14px; margin-bottom:26px; line-height:1.6; }
  .card { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:22px; }
  label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input { width:100%; padding:11px 13px; background:#0a0e14; border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:15px; }
  input:focus { outline:none; border-color:#33414f; }
  button { cursor:pointer; font-size:14px; border-radius:10px; border:1px solid var(--line);
    background:#141b24; color:var(--text); padding:11px 16px; }
  button.primary { background:var(--text); color:#0a0e14; border-color:var(--text); font-weight:600; width:100%; margin-top:20px; }
  button:disabled { opacity:0.5; cursor:default; }
  .msg { margin-top:14px; font-size:13px; min-height:18px; }
  .msg.err { color:var(--beat); } .msg.ok { color:var(--ok); }
  .note { color:var(--muted); font-size:12px; margin-top:16px; line-height:1.6; }
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
  .who { font-size:13px; color:var(--muted); }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 0; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .row .name { font-size:16px; font-weight:600; }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { border:none; border-radius:0; padding:8px 12px; font-size:12px; background:transparent; color:var(--muted); width:auto; }
  .seg button.on { background:#1c2530; color:var(--text); }
  .seg button.on.live { color:var(--ok); } .seg button.on.preview { color:var(--amber); }
  .links { margin-top:22px; font-size:13px; }
  a { color:#7aa2d6; text-decoration:none; } a:hover { text-decoration:underline; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  .pwwrap { position:relative; }
  .pwwrap input { padding-right:70px; }
  .pwtoggle { position:absolute; top:50%; right:6px; transform:translateY(-50%);
    background:transparent; border:none; color:var(--muted); font-size:12px; padding:6px 10px; border-radius:8px; width:auto; }
  .pwtoggle:hover { color:var(--text); background:#141b24; }
  textarea { width:100%; padding:11px 13px; background:#0a0e14; border:1px solid var(--line);
    border-radius:10px; color:var(--text); font-size:15px; font-family:inherit; min-height:96px; resize:vertical; line-height:1.5; }
  textarea:focus { outline:none; border-color:#33414f; }
  .actions { display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
  .count { font-size:12px; color:var(--muted); }
  button.send { width:auto; margin-top:0; background:var(--text); color:#0a0e14; border-color:var(--text); font-weight:600; padding:9px 18px; }
  h2.section { font-size:12px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:0.1em; margin:26px 0 10px; }
  .post { border-top:1px solid var(--line); padding:14px 0; }
  .post:first-child { border-top:none; padding-top:2px; }
  .post .meta { font-size:12px; color:var(--muted); margin-bottom:6px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .post .body { font-size:14px; line-height:1.55; white-space:pre-wrap; overflow-wrap:anywhere; }
  .del { width:auto; font-size:12px; color:var(--muted); background:transparent; border:none; padding:4px 8px; }
  .del:hover { color:var(--beat); }
  .toggle-line { margin-top:16px; font-size:13px; }
  .toggle-line a { cursor:pointer; }
  .namebar { font-size:13px; color:var(--muted); margin-bottom:16px; }
  .namebar .nm { color:var(--text); font-weight:600; }
  .namebar a { cursor:pointer; }
  .namebar input { width:auto; display:inline-block; padding:7px 10px; font-size:14px; }
  .namebar .send { padding:7px 12px; margin-left:4px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark"><span class="pulse"></span> Heartbeat Observatory</div>
    <div id="root"></div>
  </div>

<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
  const SUPABASE_URL = "https://ygjpnvrwhkrowkrskftk.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Y-duV64ayMMEvVwMs5PWuw_6kvzbOrN";
  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const root = document.getElementById("root");
  const STATES = [["live","Live"],["preview","Preview"],["coming_soon","Coming soon"]];
  let surfaces = [];

  function esc(s){ const d=document.createElement("div"); d.textContent=(s==null?"":s); return d.innerHTML; }
  function escA(s){ return esc(s).replace(/"/g,"&quot;"); }
  function ago(iso){
    const t=new Date(iso).getTime(); const s=Math.floor((Date.now()-t)/1000);
    if(s<60) return "just now";
    const m=Math.floor(s/60); if(m<60) return m+"m ago";
    const h=Math.floor(m/60); if(h<24) return h+"h ago";
    const d=Math.floor(h/24); if(d<7) return d+"d ago";
    return new Date(iso).toLocaleDateString();
  }
  function wireToggle(pwId, tgId){
    const pw=document.getElementById(pwId), tg=document.getElementById(tgId);
    if(!pw||!tg) return;
    tg.onclick=()=>{ const s=pw.type==="password"; pw.type=s?"text":"password"; tg.textContent=s?"Hide":"Show"; pw.focus(); };
  }
  function topbar(title, email, isAdmin){
    return '<div class="topbar"><h1 style="margin:0">'+title+'</h1>'+
      '<span class="who">'+esc(email)+(isAdmin?' \u00b7 admin':'')+' \u00b7 <a href="#" id="signout">sign out</a></span></div>';
  }
  function wireSignout(){
    const so=document.getElementById("signout");
    if(so) so.onclick=async(e)=>{ e.preventDefault(); await supabase.auth.signOut(); boot(); };
  }
  const backlinks = '<div class="links"><a href="/">\u2190 Back to the public site</a></div>';

  /* ---------- Sign in ---------- */
  function renderLogin(error) {
    root.innerHTML =
      '<h1>Sign in</h1>' +
      '<p class="lede">Sign in to post or to steer the site. Viewing never requires this.</p>' +
      '<div class="card">' +
        '<label for="email">Email</label>' +
        '<input id="email" type="email" autocomplete="username" placeholder="you@example.com" />' +
        '<label for="password">Password</label>' +
        '<div class="pwwrap">' +
          '<input id="password" type="password" autocomplete="current-password" placeholder="\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022" />' +
          '<button type="button" class="pwtoggle" id="pwtoggle">Show</button>' +
        '</div>' +
        '<button class="primary" id="signin">Sign in</button>' +
        '<div class="msg ' + (error ? 'err' : '') + '" id="msg">' + (error ? esc(error) : '') + '</div>' +
      '</div>' +
      '<div class="toggle-line">New here? <a id="toSignup">Create an account</a></div>' +
      backlinks;
    document.getElementById("signin").onclick = doSignIn;
    document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") doSignIn(); });
    document.getElementById("toSignup").onclick = () => renderSignup(null, null);
    wireToggle("password","pwtoggle");
  }

  async function doSignIn() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    document.getElementById("signin").disabled = true;
    msg.className = "msg"; msg.textContent = "Signing in\u2026";
    const { error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) { renderLogin(error.message); return; }
    boot();
  }

  /* ---------- Create account ---------- */
  function renderSignup(error, prefill) {
    const n = prefill && prefill.name ? escA(prefill.name) : "";
    const em = prefill && prefill.email ? escA(prefill.email) : "";
    root.innerHTML =
      '<h1>Create your account</h1>' +
      '<p class="lede">Choose a name to post under and set a password. You can start posting right away.</p>' +
      '<div class="card">' +
        '<label for="name">Display name</label>' +
        '<input id="name" type="text" autocomplete="nickname" placeholder="What should appear on your posts" value="' + n + '" />' +
        '<label for="email">Email</label>' +
        '<input id="email" type="email" autocomplete="email" placeholder="you@example.com" value="' + em + '" />' +
        '<label for="password">Password</label>' +
        '<div class="pwwrap">' +
          '<input id="password" type="password" autocomplete="new-password" placeholder="At least 6 characters" />' +
          '<button type="button" class="pwtoggle" id="pwtoggle">Show</button>' +
        '</div>' +
        '<label for="password2">Confirm password</label>' +
        '<div class="pwwrap">' +
          '<input id="password2" type="password" autocomplete="new-password" placeholder="Type it again" />' +
          '<button type="button" class="pwtoggle" id="pwtoggle2">Show</button>' +
        '</div>' +
        '<button class="primary" id="signup">Create account</button>' +
        '<div class="msg ' + (error ? 'err' : '') + '" id="msg">' + (error ? esc(error) : '') + '</div>' +
      '</div>' +
      '<div class="toggle-line">Already have an account? <a id="toSignin">Sign in</a></div>' +
      backlinks;
    wireToggle("password","pwtoggle");
    wireToggle("password2","pwtoggle2");
    document.getElementById("signup").onclick = doSignUp;
    document.getElementById("toSignin").onclick = () => renderLogin(null);
    document.getElementById("password2").addEventListener("keydown", e => { if (e.key === "Enter") doSignUp(); });
  }

  async function doSignUp() {
    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const pw = document.getElementById("password").value;
    const pw2 = document.getElementById("password2").value;
    const fail = (m) => renderSignup(m, { name, email });
    if (!name) return fail("Please choose a display name.");
    if (!email) return fail("Please enter your email.");
    if (pw.length < 6) return fail("Use at least 6 characters for your password.");
    if (pw !== pw2) return fail("The two passwords don\u2019t match \u2014 check with Show.");
    const btn = document.getElementById("signup"); btn.disabled = true;
    const msg = document.getElementById("msg"); msg.className = "msg"; msg.textContent = "Creating your account\u2026";
    const { data, error } = await supabase.auth.signUp({ email, password: pw, options: { data: { display_name: name } } });
    if (error) return fail(error.message);
    let session = data.session;
    if (!session) {
      const r = await supabase.auth.signInWithPassword({ email, password: pw });
      if (r.error) { renderLogin("Account created \u2014 please sign in."); return; }
      session = r.data.session;
    }
    try { await supabase.from("people").update({ display_name: name }).eq("auth_user_id", session.user.id); } catch (e) {}
    boot();
  }

  /* ---------- Routing ---------- */
  async function route(session) {
    let isAdmin = false;
    try { const { data } = await supabase.rpc("is_admin"); isAdmin = data === true; } catch (e) {}
    if (isAdmin) renderCockpit(session); else renderUser(session);
  }

  /* ---------- Compose (shared) ---------- */
  function composeHtml(){
    return '<label for="body">Post to the board</label>' +
      '<textarea id="body" maxlength="2000" placeholder="Share something that works, something you\u2019re building, a question\u2026"></textarea>' +
      '<div class="actions"><span class="count" id="count">0 / 2000</span><button class="send" id="send">Post</button></div>' +
      '<div class="msg" id="cmsg"></div>';
  }
  function wireCompose(reloadFn){
    const body=document.getElementById("body"), count=document.getElementById("count"),
          send=document.getElementById("send"), cmsg=document.getElementById("cmsg");
    body.oninput=()=>{ count.textContent=body.value.length+" / 2000"; };
    send.onclick=async()=>{
      const text=body.value.trim();
      if(!text){ cmsg.className="msg err"; cmsg.textContent="Write something first."; return; }
      send.disabled=true; cmsg.className="msg"; cmsg.textContent="Posting\u2026";
      const { error }=await supabase.from("posts").insert({ body: text });
      send.disabled=false;
      if(error){ cmsg.className="msg err"; cmsg.textContent="Refused: "+error.message; return; }
      body.value=""; count.textContent="0 / 2000"; cmsg.className="msg ok"; cmsg.textContent="Posted \u2713";
      reloadFn();
    };
  }
  function renderPosts(containerId, rows, emptyText, reloadFn){
    const c=document.getElementById(containerId);
    if(!rows || rows.length===0){ c.innerHTML='<div class="hint">'+emptyText+'</div>'; return; }
    c.innerHTML="";
    for(const p of rows){
      const el=document.createElement("div"); el.className="post";
      el.innerHTML='<div class="meta"><span><span style="color:var(--text);font-weight:600">'+esc(p.author_handle)+'</span> \u00b7 '+ago(p.created_at)+'</span>'+
        '<button class="del" data-id="'+p.id+'">delete</button></div>'+
        '<div class="body">'+esc(p.body)+'</div>';
      c.appendChild(el);
    }
    c.querySelectorAll("button.del").forEach(b=>{ b.onclick=()=>removePost(b.getAttribute("data-id"), reloadFn); });
  }
  async function removePost(id, reloadFn){
    const { error } = await supabase.from("posts").delete().eq("id", id);
    if(!error) reloadFn();
  }

  async function loadMyName(session){
    try{
      const { data } = await supabase.from("people").select("display_name,handle").eq("auth_user_id", session.user.id).maybeSingle();
      if(!data) return "";
      return (data.display_name && data.display_name.trim()) ? data.display_name : data.handle;
    }catch(e){ return ""; }
  }
  async function setNameBar(session, reloadFn){
    const bar=document.getElementById("namebar"); if(!bar) return;
    const cur=await loadMyName(session);
    bar.innerHTML='Posting as <span class="nm" id="curname"></span> <a id="editname">change</a>';
    document.getElementById("curname").textContent=cur;
    document.getElementById("editname").onclick=()=>{
      bar.innerHTML='<input id="nameinput" type="text" maxlength="60" /> <button class="send" id="savename">Save</button> <a id="cancelname">cancel</a><div class="msg" id="nmsg"></div>';
      const inp=document.getElementById("nameinput"); inp.value=cur; inp.focus();
      document.getElementById("cancelname").onclick=()=>setNameBar(session, reloadFn);
      document.getElementById("savename").onclick=async()=>{
        const newname=inp.value.trim(); const nmsg=document.getElementById("nmsg");
        if(!newname){ nmsg.className="msg err"; nmsg.textContent="Name can\u2019t be empty."; return; }
        document.getElementById("savename").disabled=true; nmsg.className="msg"; nmsg.textContent="Saving\u2026";
        const { error }=await supabase.rpc("rename_me",{ newname });
        if(error){ nmsg.className="msg err"; nmsg.textContent="Refused: "+error.message; document.getElementById("savename").disabled=false; return; }
        await setNameBar(session, reloadFn); reloadFn();
      };
    };
  }

  /* ---------- Contributor area ---------- */
  async function renderUser(session) {
    root.innerHTML =
      topbar("You\u2019re in", session.user.email, false) +
      '<div class="namebar" id="namebar"></div>' +
      '<div class="card">' + composeHtml() + '</div>' +
      '<h2 class="section">Your posts</h2>' +
      '<div class="card" id="myposts"><div class="hint">Loading\u2026</div></div>' +
      backlinks;
    wireSignout();
    setNameBar(session, () => loadMyPosts(session));
    wireCompose(() => loadMyPosts(session));
    loadMyPosts(session);
  }
  async function loadMyPosts(session){
    const { data } = await supabase.from("posts")
      .select("id,author_handle,body,created_at")
      .eq("author_id", session.user.id)
      .order("created_at", { ascending:false });
    renderPosts("myposts", data, "You haven\u2019t posted yet. Say the first thing above.", () => loadMyPosts(session));
  }

  /* ---------- Operator cockpit ---------- */
  async function renderCockpit(session) {
    const { data, error } = await supabase
      .from("surfaces").select("id,key,name,status,position").order("position", { ascending: true });
    if (error) { root.innerHTML = '<div class="card"><div class="msg err">'+esc(error.message)+'</div></div>'; return; }
    surfaces = data;
    root.innerHTML =
      topbar("Steering", session.user.email, true) +
      '<div class="namebar" id="namebar"></div>' +
      '<div class="card">' + composeHtml() + '</div>' +
      '<h2 class="section">Sections</h2>' +
      '<div class="card" id="list"></div>' +
      '<div class="msg ok" id="saved"></div>' +
      '<h2 class="section">Recent posts \u2014 yours to moderate</h2>' +
      '<div class="card" id="allposts"><div class="hint">Loading\u2026</div></div>' +
      '<div class="links">Changes are live immediately. <a href="/" target="_blank" rel="noopener">Open the public site \u2197</a></div>';
    wireSignout();
    setNameBar(session, () => loadAllPosts());
    wireCompose(() => loadAllPosts());
    renderList();
    loadAllPosts();
  }
  async function loadAllPosts(){
    const { data } = await supabase.from("posts")
      .select("id,author_handle,body,created_at")
      .order("created_at", { ascending:false }).limit(50);
    renderPosts("allposts", data, "No posts yet.", () => loadAllPosts());
  }

  function renderList() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    for (const s of surfaces) {
      const row = document.createElement("div");
      row.className = "row";
      let seg = '<div class="seg">';
      for (const [val,label] of STATES) {
        const on = s.status === val ? (" on " + val) : "";
        seg += '<button class="' + on.trim() + '" data-id="' + s.id + '" data-val="' + val + '">' + label + '</button>';
      }
      seg += '</div>';
      row.innerHTML = '<span class="name">' + esc(s.name) + '</span>' + seg;
      list.appendChild(row);
    }
    list.querySelectorAll("button[data-val]").forEach(b => {
      b.onclick = () => setStatus(b.getAttribute("data-id"), b.getAttribute("data-val"));
    });
  }

  async function setStatus(id, value) {
    const saved = document.getElementById("saved");
    saved.className = "msg"; saved.textContent = "Saving\u2026";
    const { error } = await supabase.from("surfaces").update({ status: value }).eq("id", id);
    if (error) { saved.className = "msg err"; saved.textContent = "Refused: " + error.message; return; }
    const s = surfaces.find(x => x.id === id); if (s) s.status = value;
    renderList();
    saved.className = "msg ok"; saved.textContent = (s ? s.name : "Section") + " set to " + value.replace("_"," ") + " \u2713";
  }

  async function boot() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) route(session); else renderLogin(null);
  }
  boot();
</script>
</body>
</html>
