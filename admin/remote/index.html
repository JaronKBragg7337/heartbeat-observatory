</style></head><body><div class="wrap"><a class="back" href="/admin/">← Steering</a><h1>Remote screen</h1><p id="gate" hidden>Sign in as an admin to control the MSI. <a href="/admin/">Sign in</a></p><div id="app" hidden><p>Move the stick to move the mouse. Use the buttons to click. Drag with two fingers on the picture to scroll.</p><button id="start">Start</button> <span class="status" id="status">Off</span><div class="modes"><button id="view" aria-pressed="true">Zoom</button><button id="point" aria-pressed="false">Tap to point: Off</button><button id="speed">Speed: Medium</button></div><video id="screen" autoplay playsinline muted></video><div class="actions"><button id="click">Click</button><button id="right">Right-click</button></div><div class="controls"><div id="stick" class="stick" aria-label="Mouse stick"><div id="knob" class="knob"></div></div><div><button id="keyboard">Keyboard</button><p>Small tilt for precision; full tilt for speed.</p></div></div><textarea id="typing" class="keyboard" autocapitalize="off" autocomplete="off" spellcheck="false" aria-label="Type on MSI"></textarea><div class="keys"><button data-key="Enter">Enter</button><button data-key="Backspace">Backspace</button><button data-key="Escape">Esc</button><button data-key="Tab">Tab</button><button data-key="c" data-ctrl="1">Ctrl+C</button><button data-key="v" data-ctrl="1">Ctrl+V</button></div></div></div>
<script type="module">const SPEEDS={Slow:[2,33],Medium:[3,57],Fast:[5,95]};let spd='Medium';try{spd=localStorage.getItem('hbRemoteSpeed')||'Medium'}catch(e){}if(!SPEEDS[spd])spd='Medium';addEventListener('DOMContentLoaded',()=>{const b=document.getElementById('speed');if(!b)return;b.textContent='Speed: '+spd;b.onclick=()=>{const k=Object.keys(SPEEDS);spd=k[(k.indexOf(spd)+1)%k.length];b.textContent='Speed: '+spd;try{localStorage.setItem('hbRemoteSpeed',spd)}catch(e){}}});
import {getSupabase} from '/hb-supabase.js';
const sb=await getSupabase(), $=id=>document.getElementById(id); let pc,dc,timer,sessionId,active=false;
const {data:{session}}=await sb.auth.getSession(); let admin=false;if(session){const {data}=await sb.rpc('is_admin');admin=data===true} $(admin?'app':'gate').hidden=false;
function send(m){if(dc?.readyState==='open')dc.send(JSON.stringify(m))}
function stop(msg='Off'){active=false;clearInterval(timer);if(sessionId){void sb.from('remote_signals').update({token:null}).eq('id',sessionId).then(()=>{});sessionId=null;}send({type:'stop'});pc?.close();pc=null;dc=null;$('screen').srcObject=null;$('start').textContent='Start';$('status').textContent=msg}
$('start').onclick=async()=>{if(active){stop();return} active=true;$('start').textContent='Stop';$('status').textContent='Connecting…';try{
 const {data:{session:s}}=await sb.auth.getSession();if(!s)throw Error('Sign in again');let ice=[{urls:'stun:stun.cloudflare.com:3478'}];try{const {data:r}=await sb.from('remote_ice').select('servers').eq('id',1).maybeSingle();if(r&&r.servers)ice=ice.concat(r.servers)}catch(e){}pc=new RTCPeerConnection({iceServers:ice});pc.addTransceiver('video',{direction:'recvonly'});dc=pc.createDataChannel('controls');pc.ontrack=e=>{$('screen').srcObject=e.streams[0]};dc.onopen=()=>{$('status').textContent='Connected';send({type:'view',zoom})};pc.onconnectionstatechange=()=>{if(pc && ['failed','closed','disconnected'].includes(pc.connectionState))stop('Disconnected')};
 await pc.setLocalDescription(await pc.createOffer());await new Promise(resolve=>{if(pc.iceGatheringState==='complete')return resolve();let f=()=>{if(pc?.iceGatheringState==='complete'){pc.removeEventListener('icegatheringstatechange',f);resolve()}};pc.addEventListener('icegatheringstatechange',f);setTimeout(resolve,10000)});if(!active)return;
 sessionId=crypto.randomUUID();const {error}=await sb.from('remote_signals').insert({id:sessionId,offer:{type:pc.localDescription.type,sdp:pc.localDescription.sdp},token:s.access_token});if(error)throw error;if(!active){await sb.from('remote_signals').update({token:null}).eq('id',sessionId);sessionId=null;return}
 let tries=0;timer=setInterval(async()=>{if(!active)return;const {data,error}=await sb.from('remote_signals').select('answer,status').eq('id',sessionId).maybeSingle();if(error){stop('Signal error');return}if(data?.answer && pc.signalingState==='have-local-offer'){clearInterval(timer);await pc.setRemoteDescription(data.answer)}else if(['rejected','closed'].includes(data?.status)||++tries>60)stop('MSI unavailable or remote is off')},2000);
 }catch(e){stop('Could not connect: '+e.message)}};
const stick=$('stick'),knob=$('knob');let dx=0,dy=0,loop;function reset(){dx=dy=0;clearInterval(loop);knob.style.transform=''}stick.onpointerdown=e=>{e.preventDefault();stick.setPointerCapture(e.pointerId);move(e);loop=setInterval(()=>{if(dx||dy){const g=SPEEDS[spd],m=g[0]+g[1]*Math.hypot(dx,dy)**2;send({type:'move',x:Math.round(dx*m),y:Math.round(dy*m)})}},40)};function move(e){let r=stick.getBoundingClientRect(),x=(e.clientX-r.left-r.width/2)/(r.width/2),y=(e.clientY-r.top-r.height/2)/(r.height/2),d=Math.hypot(x,y);if(d>1){x/=d;y/=d}dx=x;dy=y;knob.style.transform=`translate(${x*45}px,${y*45}px)`}stick.onpointermove=e=>{if(stick.hasPointerCapture(e.pointerId))move(e)};stick.onpointerup=reset;stick.onpointercancel=reset;
let zoom=true, tapPoint=false;
$('view').onclick=()=>{zoom=!zoom;$('view').textContent=zoom?'Zoom':'Full screen';$('view').setAttribute('aria-pressed',zoom);send({type:'view',zoom})};
$('point').onclick=()=>{tapPoint=!tapPoint;$('point').textContent=`Tap to point: ${tapPoint?'On':'Off'}`;$('point').setAttribute('aria-pressed',tapPoint)};
$('click').onclick=()=>send({type:'click'});$('right').onclick=()=>send({type:'click',button:'right'});
let touches=new Map(),startY=0,moved=false;const screen=$('screen');
screen.addEventListener('touchstart',e=>{e.preventDefault();for(const t of e.changedTouches)touches.set(t.identifier,{x:t.clientX,y:t.clientY});if(touches.size===1)moved=false;else{moved=true;startY=[...e.touches].reduce((a,t)=>a+t.clientY,0)/e.touches.length}}, {passive:false});
screen.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length>=2){let y=[...e.touches].reduce((a,t)=>a+t.clientY,0)/e.touches.length,delta=y-startY;if(Math.abs(delta)>8){send({type:'scroll',amount:Math.round(delta*4)});startY=y}moved=true}else{let t=e.touches[0],p=t&&touches.get(t.identifier);if(p&&Math.hypot(t.clientX-p.x,t.clientY-p.y)>10)moved=true}}, {passive:false});
screen.addEventListener('touchend',e=>{e.preventDefault();if(touches.size===1&&!moved&&tapPoint&&screen.videoWidth){let t=e.changedTouches[0],r=screen.getBoundingClientRect(),scale=Math.min(r.width/screen.videoWidth,r.height/screen.videoHeight),w=screen.videoWidth*scale,h=screen.videoHeight*scale,x=(t.clientX-r.left-(r.width-w)/2)/w,y=(t.clientY-r.top-(r.height-h)/2)/h;if(x>=0&&x<=1&&y>=0&&y<=1)send({type:'point',x,y})}for(const t of e.changedTouches)touches.delete(t.identifier)}, {passive:false});screen.addEventListener('touchcancel',()=>touches.clear());
const typing=$('typing');function prime(){typing.value=' ';typing.setSelectionRange(1,1)}$('keyboard').onclick=()=>{prime();typing.focus()};typing.addEventListener('input',e=>{if(e.inputType==='deleteContentBackward')send({type:'key',key:'Backspace'});else if(e.data)send({type:'text',text:e.data});prime()});document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>send({type:'key',key:b.dataset.key,ctrl:!!b.dataset.ctrl}));window.addEventListener('pagehide',()=>stop());
</script></body></html>
