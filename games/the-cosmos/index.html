<style>
  /* ==========================================================================
     The Cosmos — UI shell.
     Mobile first, and mobile-first here means the screen belongs to the world.
     No permanent joystick, no button grid. Controls appear under the thumb
     that summons them and disappear when it lifts.
     ========================================================================== */
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #0a0705; color: #f0e6dc;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    overscroll-behavior: none;
    touch-action: none;
    user-select: none; -webkit-user-select: none;
  }
  #game-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  /* --- Boot ---------------------------------------------------------------- */
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #0a0705; z-index: 500; text-align: center; padding: 24px;
  }
  #boot h1 { margin: 0; font-size: 22px; letter-spacing: 5px; font-weight: 500; color: #e8c9a8; }
  #boot .boot-status { color: #b59a82; animation: bootPulse 1.6s ease-in-out infinite; }
  @keyframes bootPulse { 50% { opacity: .45; } }
  #boot p { text-wrap: balance; margin: 0; font-size: 12px; color: #8a7566; line-height: 1.7; max-width: 340px; }

  /* --- HUD ----------------------------------------------------------------- */
  #hud {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top, 0px));
    left: calc(10px + env(safe-area-inset-left, 0px));
    z-index: 60; pointer-events: none;
    font-size: 11px; line-height: 1.6;
    background: rgba(10, 7, 5, .58); backdrop-filter: blur(7px);
    border: 1px solid rgba(232, 201, 168, .16); border-radius: 8px;
    padding: 8px 11px; max-width: 74vw;
  }
  #hud b { color: #f0b978; font-weight: 600; letter-spacing: .5px; }
  #hud .dim { color: #9c8878; font-size: 10px; }
  #hud .next-goal { margin-top: 6px; padding-top: 5px; border-top: 1px solid rgba(240, 185, 120, .35); font-size: 10px; line-height: 1.45; color: #f3dcc0; white-space: normal; }

  /* --- Buttons ------------------------------------------------------------- */
  .btn {
    position: fixed; z-index: 70;
    background: rgba(10, 7, 5, .66); backdrop-filter: blur(7px);
    border: 1px solid rgba(232, 201, 168, .22); color: #e8d5c2;
    border-radius: 9px; font: inherit; font-size: 11px;
    padding: 9px 13px; cursor: pointer; min-height: 40px;
  }
  .btn:active { background: rgba(232, 201, 168, .18); }
  /* Contextual action. Hidden unless there is something to act on. */
  #btn-action {
    display: none;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    min-width: 116px; min-height: 52px; font-size: 12px;
    background: rgba(240, 185, 120, .20);
    border-color: rgba(240, 185, 120, .55); color: #ffd9ac;
  }
  #btn-action:active { background: rgba(240, 185, 120, .38); }
  /* The tool chip rides above the action button and appears with it. Tap to change tool (1 2 3 on a keyboard). */
  #btn-tool {
    display: none;
    bottom: calc(76px + env(safe-area-inset-bottom, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    min-width: 116px; min-height: 34px; font-size: 11px; padding: 6px 10px;
    color: #cbb8a6;
  }
  #hud .load { color: #f0b978; }
  #hud .load-bar { height: 6px; margin-top: 4px; border-radius: 3px; background: #5d4938; overflow: hidden; }
  #hud .load-bar i { display: block; height: 100%; background: #f0b978; }
  #btn-drop-all {
    display: none; right: calc(14px + env(safe-area-inset-right, 0px));
    bottom: calc(120px + env(safe-area-inset-bottom, 0px));
    min-width: 116px; min-height: 44px; color: #9ce6ef; border-color: #63e0ff88;
  }
  #btn-climb {
    display:none; right:calc(146px + env(safe-area-inset-right,0px));
    bottom:calc(14px + env(safe-area-inset-bottom,0px));
    min-width:96px;min-height:52px;color:#9ce6ef;border-color:#63e0ff88;
  }
  #btn-settings {
    top: calc(10px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
  }
  #back-link {
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    left: calc(10px + env(safe-area-inset-left, 0px));
    text-decoration: none;
  }

  /* --- Settings ------------------------------------------------------------ */
  #settings-panel {
    position: fixed; z-index: 80; display: none;
    top: calc(58px + env(safe-area-inset-top, 0px));
    right: calc(10px + env(safe-area-inset-right, 0px));
    width: min(300px, calc(100vw - 20px));
    background: rgba(12, 9, 7, .93); backdrop-filter: blur(14px);
    border: 1px solid rgba(232, 201, 168, .22); border-radius: 12px;
    padding: 14px; font-size: 12px;
  }
  #settings-panel.open { display: flex; flex-direction: column; }
  /* FIX-R2: on a phone the panel opens under the status card, not over it */
  html.phone-ui #settings-panel { top: calc(var(--hud-bottom, 50px) + 8px); max-height: calc(100dvh - var(--hud-bottom, 50px) - 28px - env(safe-area-inset-bottom, 0px)); }
  #settings-panel { max-height: calc(100dvh - 78px - env(safe-area-inset-bottom, 0px)); overflow: hidden; }
  /* FIX-R3: the heading (title and close X) is its own row; only .settings-body scrolls, so no setting ever slides under the X */
  #settings-panel .settings-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  #settings-panel .settings-heading { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 0 8px; border-bottom: 1px solid rgba(232, 201, 168, .12); }
  #settings-panel .settings-heading h2 { margin: 0; }
  #settings-panel button, #settings-panel a { min-height: 44px; }
  #btn-close-settings, #settings-account { position: static; }
  #settings-panel #back-link { position: static; display: block; margin-top: 10px; text-align: center; }
  #save-status { font-size: 11px; line-height: 1.5; overflow-wrap: anywhere; }
  #settings-panel h2 {
    margin: 0 0 12px; font-size: 11px; letter-spacing: 2.5px;
    color: #f0b978; font-weight: 600; text-transform: uppercase;
  }
  .set-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 9px 0; border-top: 1px solid rgba(232, 201, 168, .12);
  }
  .set-row:first-of-type { border-top: 0; }
  .set-row label { color: #cbb8a6; flex: 1; }
  .set-row .hint { display: block; color: #7d6b5d; font-size: 10px; margin-top: 3px; line-height: 1.5; }
  .set-row select {
    background-color: #17110d; color: #e8d5c2; border: 1px solid rgba(232, 201, 168, .25);
    border-radius: 6px; padding: 6px 26px 6px 8px; font: inherit; font-size: 11px; min-height: 44px;
    /* FIX-R2: iOS Safari drew a native white select with pale text (unreadable) and painted it above the sticky heading; own look, own arrow. */
    -webkit-appearance: none; appearance: none; position: relative; z-index: 0; max-width: 55%;
    background-image: linear-gradient(45deg, transparent 50%, #f0b978 50%), linear-gradient(135deg, #f0b978 50%, transparent 50%);
    background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat;
  }
  .set-row input[type=checkbox] { width: 20px; height: 20px; accent-color: #f0b978; }
  .set-row input[type=range] { width: 120px; min-height: 44px; accent-color: #f0b978; touch-action: pan-x; }
  /* Cinematic mode. 2.39:1 letterbox bars are .letterbox; everything else but the world and Settings goes away. */
  html.cinema-on body > *:not(#game-canvas):not(#settings-panel):not(.letterbox) { visibility: hidden !important; }
  html.cinema-on #settings-panel { z-index: 400; }
  html.cinema-on #settings-panel.open { visibility: visible !important; }
  #btn-copy-coord {
    position: static; width: 100%; margin-top: 10px; text-align: center;
  }

  /* --- The invisible stick. Opacity 0 until a thumb lands on the left. ------ */
  #stick-layer {
    position: fixed; inset: 0; z-index: 50; pointer-events: none;
    opacity: 0; transition: opacity .12s ease;
  }
  #stick-base, #stick-nub {
    position: absolute; top: 0; left: 0; border-radius: 50%;
    will-change: transform;
  }
  #stick-base {
    width: 124px; height: 124px; margin: -62px 0 0 -62px;
    border: 1.5px solid rgba(240, 185, 120, .38);
    background: radial-gradient(circle, rgba(240,185,120,.09) 0%, rgba(240,185,120,0) 72%);
  }
  #stick-nub {
    width: 52px; height: 52px; margin: -26px 0 0 -26px;
    background: rgba(240, 185, 120, .30);
    border: 1.5px solid rgba(240, 185, 120, .62);
  }

  /* --- Debug layer --------------------------------------------------------- */
  #debug-dom { position: fixed; inset: 0; z-index: 55; pointer-events: none; }
  #dbg-readout {
    position: absolute;
    left: calc(10px + env(safe-area-inset-left, 0px));
    bottom: calc(58px + env(safe-area-inset-bottom, 0px));
    background: rgba(4, 12, 14, .84); backdrop-filter: blur(8px);
    border: 1px solid rgba(57, 208, 255, .35); border-radius: 8px;
    padding: 9px 11px; font-size: 10px; line-height: 1.7; min-width: 250px;
  }
  .dbg-title { color: #39d0ff; letter-spacing: 2px; margin-bottom: 6px; font-size: 9px; }
  .dbg-row { display: flex; justify-content: space-between; gap: 14px; }
  .dbg-row span { color: #6d8f9c; }
  .dbg-row b { color: #cfeeff; font-weight: 500; }
  .dbg-slug { font-size: 9px; color: #ffd257 !important; }

  .dbg-bubble {
    position: absolute; top: 0; left: 0;
    background: rgba(4, 12, 14, .88); border: 1px solid rgba(57, 208, 255, .5);
    border-radius: 7px; padding: 5px 8px; font-size: 9px; line-height: 1.55;
    white-space: nowrap; will-change: transform;
    box-shadow: 0 3px 14px rgba(0, 0, 0, .5);
  }
  .dbg-bubble b { display: block; color: #ffd257; font-weight: 600; letter-spacing: .4px; }
  .dbg-bubble i { display: block; color: #cfeeff; font-style: normal; }
  .dbg-bubble span { display: block; color: #7fa6b4; }
  /* The stalk that ties the bubble to the thing it names. It stretches when
     the bubble has been lifted clear of another one, so the link is never
     ambiguous even in a crowd. */
  .dbg-bubble::after {
    content: ''; position: absolute; left: 50%;
    bottom: calc(-1 * var(--stalk, 9px));
    width: 1px; height: var(--stalk, 9px);
    background: linear-gradient(to bottom, rgba(57,208,255,.65), rgba(57,208,255,.15));
  }
  /* --- Cell names, painted over the grid squares they belong to. --------- */
  .dbg-cell {
    position: absolute; top: 0; left: 0;
    color: #b8ecff; font-size: 10px; letter-spacing: .4px; font-weight: 600;
    background: rgba(4, 14, 20, .74);
    border: 1px solid rgba(57, 208, 255, .55);
    border-radius: 4px; padding: 2px 6px;
    white-space: nowrap; will-change: transform;
  }
  /* The square you are standing in, called out. */
  .dbg-cell.here {
    color: #06121a; background: #57dcff; border-color: #9beeff;
    font-size: 13px; padding: 4px 10px;
    box-shadow: 0 0 16px rgba(87, 220, 255, .55);
  }
  .dbg-cell.origin {
    color: #1c1403; background: rgba(255, 210, 87, .92);
    border-color: #ffe9a8; font-size: 11px;
  }

  /* --- Nearest assets. Collapsed by default: on a phone this panel covered
         half the screen, because each asset id wrapped onto three lines. ---- */
  #dbg-nearest {
    position: absolute;
    right: calc(10px + env(safe-area-inset-right, 0px));
    bottom: calc(112px + env(safe-area-inset-bottom, 0px));
    width: min(248px, 54vw);
    background: rgba(4, 12, 14, .9); backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 169, 61, .38); border-radius: 8px;
    font-size: 9px; line-height: 1.45;
    overflow: hidden; pointer-events: auto;
  }
  #dbg-near-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 9px; cursor: pointer; user-select: none;
    color: #ffa93d; letter-spacing: 1.5px; font-size: 9px;
  }
  #dbg-near-head .chev { transition: transform .15s ease; opacity: .8; }
  #dbg-nearest.open #dbg-near-head .chev { transform: rotate(180deg); }
  #dbg-near-body { display: none; max-height: 32vh; overflow-y: auto; touch-action: pan-y; overscroll-behavior: contain; padding: 0 9px 8px; }
  #dbg-nearest.open #dbg-near-body { display: block; }

  .dbg-near { padding: 5px 0; border-top: 1px solid rgba(255, 169, 61, .16); }
  .dbg-near:first-child { border-top: 0; }
  /* The id gets its own line and never wraps — that wrapping was the bug. */
  .dbg-near b {
    display: block; color: #ffd257; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .dbg-near i {
    display: flex; justify-content: space-between; gap: 8px;
    color: #9fb0bb; font-style: normal; font-size: 8px;
  }
  .dbg-near i s { text-decoration: none; color: #7fa6b4; white-space: nowrap; }

  .dbg-cellid { color: #57dcff !important; font-size: 10px; }

  @media (max-width: 520px) {
    #dbg-readout { font-size: 9px; min-width: 210px; }
    #hud { font-size: 10px; }
  }
</style>

<body>
<canvas id="game-canvas"></canvas>

<div id="boot">
  <h1>THE COSMOS</h1>
  <p>Your ship. Your crew. Real worlds at their real size.<br>Mars is only the first port.</p>
  <p id="boot-status" class="boot-status">Loading the port&hellip;</p>
</div>

<div id="hud"></div>

<button class="btn" id="btn-settings">Settings</button>
<button class="btn" id="btn-action">Dig</button>
<button class="btn" id="btn-tool">Shovel</button>
<button class="btn" id="btn-drop-all" title="Pour all carried soil as one heap (R)">Drop all · R</button>
<button class="btn" id="btn-climb" title="Pull onto a reachable ledge (C)">Climb (C)</button>

<div id="settings-panel">
  <div class="settings-heading"><h2>Settings</h2><button class="btn" id="btn-close-settings" aria-label="Close settings">✕</button></div>
  <div class="settings-body">
  <p id="save-status" aria-live="polite"></p>
  <button class="btn" id="settings-account">Ship account / supplies / quests</button>

  <div class="set-row">
    <label for="set-view">View
      <span class="hint">Third person to inspect the body and its scale.</span>
    </label>
    <select id="set-view">
      <option value="first">First</option>
      <option value="third">Third</option>
    </select>
  </div>

  <div class="set-row">
    <label for="set-tool">Digging tool
      <span class="hint">Spade for detail, shovel for the everyday bite, bucket for a hole you can stand in. Keys 1 2 3.</span>
    </label>
    <select id="set-tool">
      <option value="0">Hand spade</option>
      <option value="1" selected>Shovel</option>
      <option value="2">Excavator bucket</option>
    </select>
  </div>

  <div class="set-row">
    <label for="set-cinema">Cinematic mode
      <span class="hint">Hide the HUD and buttons. Escape opens this panel again. Add ?cinema=1 to start this way.</span>
    </label>
    <input type="checkbox" id="set-cinema">
  </div>

  <div class="set-row">
    <label for="set-letterbox">Letterbox 2.39:1
      <span class="hint">Black bars for a film frame. The picture stays 2.39:1.</span>
    </label>
    <input type="checkbox" id="set-letterbox">
  </div>

  <div class="set-row">
    <label for="set-dev">Dev / debug layer
      <span class="hint">Lat–long grid on the ground and an ID bubble over every registered asset. Read the numbers back to me in a bug report.</span>
    </label>
    <input type="checkbox" id="set-dev">
  </div>

  <div class="set-row">
    <label for="set-voice-volume">Voice volume
      <span class="hint">How loud people sound: the crew, the port, and players near you.</span>
    </label>
    <input type="range" id="set-voice-volume" min="0" max="100" step="5" value="90">
  </div>

  <div class="set-row">
    <label for="set-voice-chat">Player voice chat
      <span class="hint">Hear players close to you, and talk to them with the Talk button (B on a keyboard). Off means no connection and no microphone.</span>
    </label>
    <input type="checkbox" id="set-voice-chat" checked>
  </div>

  <div class="set-row">
    <label for="set-voice-mute">Mute my microphone
      <span class="hint">You still hear others. The Talk button does nothing until this is off.</span>
    </label>
    <input type="checkbox" id="set-voice-mute">
  </div>

  <button class="btn" id="btn-copy-coord">Copy my position</button>
  <a class="btn" id="back-link" href="/games/">← Games</a>
  </div>
</div>
