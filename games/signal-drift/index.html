<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020409" />
  <title>Signal Drift — Heartbeat Observatory</title>
  <style>
    :root { color-scheme: dark; background: #020409; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020409; }
    body { min-height: 100vh; min-height: 100dvh; }
    main { position: fixed; inset: 0; overflow: hidden; background: #020409; }
    iframe { position: absolute; inset: 0; display: block; width: 100%; height: 100%; border: 0; background: #020409; }
  </style>
</head>
<body>
  <main>
    <iframe
      title="Signal Drift"
      src="https://jaronkbragg7337.github.io/signal-drift/"
      allow="fullscreen; gamepad; autoplay; pointer-lock; accelerometer; gyroscope"
      allowfullscreen
      loading="eager"
      referrerpolicy="strict-origin-when-cross-origin">
      <p>Your browser cannot display this game. <a href="https://jaronkbragg7337.github.io/signal-drift/">Open it directly</a>.</p>
    </iframe>
  </main>
<script defer src="/hb-editor.js"></script>
</body>
</html>
