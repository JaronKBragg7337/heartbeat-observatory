name: Vex sync embedded SYL controls

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: contains(github.event.head_commit.message, 'Add one-time embedded SYL controls patch runner')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Patch embedded SYL controls
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main_path = Path('games/syl/src/main.js')
          ship_path = Path('games/syl/src/ship/ship.js')
          main = main_path.read_text()
          ship = ship_path.read_text()

          # --- main.js: add velocity-follow chase camera temps if missing. ---
          old_consts = """let shipCamBaseReady = false;\nconst shipCamBaseQuat = new THREE.Quaternion();"""
          new_consts = """let shipCamBaseReady = false;\nconst shipCamBaseQuat = new THREE.Quaternion();\nconst SHIP_CAM_MIN_TRAVEL_SPEED = 1.5;\nconst _shipCamUp = new THREE.Vector3(), _shipCamTravel = new THREE.Vector3(), _shipCamRight = new THREE.Vector3();\nconst _shipCamMatrix = new THREE.Matrix4();"""
          if 'SHIP_CAM_MIN_TRAVEL_SPEED' not in main:
            if old_consts not in main:
              raise SystemExit('main camera const block not found')
            main = main.replace(old_consts, new_consts, 1)

          # --- main.js: replace old ship-quaternion chase camera block. ---
          start_marker = """      _cv.set(0, 4.5, -15);\n      if (!shipCamBaseReady) {"""
          end_marker = """      _cv.applyAxisAngle(_touchCamX, shipTouchCamPitch);"""
          start = main.index(start_marker)
          end = main.index(end_marker, start)
          new_camera_block = """      // Velocity-follow chase camera test:\n      // Movement input changes the ship/velocity; the camera follows the\n      // resulting travel direction instead of raw yaw input. When nearly\n      // stationary, keep the previous camera base so A/D or stick-side does\n      // not directly orbit the camera in place.\n      _cv.set(0, 4.5, -15);\n      const camUp = upAt(dominantBody(BODIES, ship.worldPos), ship.worldPos, _shipCamUp);\n      const travel = _shipCamTravel.copy(ship.velocity).addScaledVector(camUp, -ship.velocity.dot(camUp));\n      if (!shipCamBaseReady) {\n        shipCamBaseQuat.copy(ship.quaternion);\n        shipCamBaseReady = true;\n      }\n      if (travel.lengthSq() > SHIP_CAM_MIN_TRAVEL_SPEED * SHIP_CAM_MIN_TRAVEL_SPEED) {\n        travel.normalize();\n        _shipCamRight.crossVectors(camUp, travel);\n        if (_shipCamRight.lengthSq() > 1e-6) {\n          _shipCamRight.normalize();\n          _shipCamMatrix.makeBasis(_shipCamRight, camUp, travel);\n          _cq.setFromRotationMatrix(_shipCamMatrix);\n          shipCamBaseQuat.slerp(_cq, Math.min(1, 5 * dt));\n        }\n      }\n      const looking = input.touchMode\n        ? (input.touchLookActive && !input.touchJoystickActive)\n        : (input.pointerLocked && Math.abs(input.mouseDX) + Math.abs(input.mouseDY) > 0);\n      const arrowYaw = (input.down('ArrowRight') ? 1 : 0) - (input.down('ArrowLeft') ? 1 : 0);\n      const arrowPitch = (input.down('ArrowDown') ? 1 : 0) - (input.down('ArrowUp') ? 1 : 0);\n      const arrowLooking = arrowYaw !== 0 || arrowPitch !== 0;\n\n      if (looking) {\n        shipTouchCamYaw -= input.mouseDX * 0.003;\n        shipTouchCamPitch = Math.max(-0.75, Math.min(0.55, shipTouchCamPitch - input.mouseDY * 0.003));\n      }\n\n      if (arrowLooking) {\n        shipTouchCamYaw += arrowYaw * 1.8 * dt;\n        shipTouchCamPitch = Math.max(-0.75, Math.min(0.55, shipTouchCamPitch + arrowPitch * 1.2 * dt));\n      }\n\n      if (!looking && !arrowLooking) {\n        shipTouchCamYaw += (0 - shipTouchCamYaw) * Math.min(1, 4 * dt);\n        shipTouchCamPitch += (0 - shipTouchCamPitch) * Math.min(1, 4 * dt);\n      }\n"""
          main = main[:start] + new_camera_block + main[end:]

          # --- main.js: replace yaw-based assisted controls with strafe test. ---
          old_controls = """  // Assisted ship piloting uses the same direct feel as dev fly:\n  // W/S or stick up/down = forward/reverse, A/D or stick left/right = turn.\n  const touchThrottle = input.touchShipThrottle || 0;\n  const keyForward = (input.down('KeyW') ? 1 : 0) - (input.down('KeyS') ? 1 : 0);\n  const assistForward = input.touchMode ? touchThrottle : keyForward;\n  ship.throttle = Math.max(0, assistForward);\n\n  const keyYaw = (input.down('KeyD') ? 1 : 0) - (input.down('KeyA') ? 1 : 0);\n  controls.pitch = 0;\n  controls.yaw = input.touchMode ? (input.touchShipYaw || 0) : keyYaw;\n  controls.roll = 0;"""
          new_controls = """  // Assisted ship piloting strafe test:\n  // W/S or stick up/down = forward/reverse movement.\n  // A/D or stick left/right = lateral movement, NOT yaw.\n  // Camera/look input owns camera rotation separately.\n  const touchThrottle = input.touchShipThrottle || 0;\n  const keyForward = (input.down('KeyW') ? 1 : 0) - (input.down('KeyS') ? 1 : 0);\n  const assistForward = input.touchMode ? touchThrottle : keyForward;\n  ship.throttle = Math.max(0, assistForward);\n\n  const keySide = (input.down('KeyD') ? 1 : 0) - (input.down('KeyA') ? 1 : 0);\n  const assistStrafe = input.touchMode ? (input.touchShipYaw || 0) : keySide;\n\n  controls.pitch = 0;\n  controls.yaw = 0;\n  controls.roll = 0;"""
          if old_controls not in main:
            raise SystemExit('main readShipControls old yaw block not found')
          main = main.replace(old_controls, new_controls, 1)

          old_forward_assign = """  controls.assistForward = assistForward;"""
          new_forward_assign = """  controls.assistForward = assistForward;\n  controls.assistStrafe = assistStrafe;"""
          if old_forward_assign not in main:
            raise SystemExit('main assistForward assignment not found')
          main = main.replace(old_forward_assign, new_forward_assign, 1)

          # --- ship.js: add strafe acceleration constant. ---
          old_const = """const ASSIST_FORWARD_ACCEL = 48; // m/s^2 through the ship nose"""
          new_const = """const ASSIST_FORWARD_ACCEL = 48; // m/s^2 through the ship nose\nconst ASSIST_STRAFE_ACCEL = 38;  // m/s^2 lateral test: A/D or stick-side slides instead of yawing"""
          if 'ASSIST_STRAFE_ACCEL' not in ship:
            if old_const not in ship:
              raise SystemExit('ship ASSIST_FORWARD_ACCEL const not found')
            ship = ship.replace(old_const, new_const, 1)

          old_comment = """  // controls: { pitch, yaw, roll: -1..1; thrustUp: bool; brake: bool; assist?: bool; assistForward?: -1..1 }"""
          new_comment = """  // controls: { pitch, yaw, roll: -1..1; thrustUp: bool; brake: bool; assist?: bool; assistForward?: -1..1; assistStrafe?: -1..1 }"""
          if old_comment in ship:
            ship = ship.replace(old_comment, new_comment, 1)

          old_yaw_comment = """      // Vehicle-game rules: yaw turns the hull's actual front; thrust pushes\n      // through that front. The stick never edits the travel vector directly."""
          new_yaw_comment = """      // Strafe-flight test: sideways input is lateral movement, not yaw.\n      // Raw yaw is disabled by main.js during assisted mode for this test."""
          if old_yaw_comment in ship:
            ship = ship.replace(old_yaw_comment, new_yaw_comment, 1)

          old_accel = """        const forward = Math.max(-1, Math.min(1, controls.assistForward ?? this.throttle));\n        if (Math.abs(forward) > 0.01) {\n          accel.addScaledVector(fwdFlat, forward * ASSIST_FORWARD_ACCEL);\n          burning += Math.abs(forward) * 0.45;\n        }\n        if (controls.thrustUp) {"""
          new_accel = """        const forward = Math.max(-1, Math.min(1, controls.assistForward ?? this.throttle));\n        const strafe = Math.max(-1, Math.min(1, controls.assistStrafe ?? 0));\n        if (Math.abs(forward) > 0.01) {\n          accel.addScaledVector(fwdFlat, forward * ASSIST_FORWARD_ACCEL);\n          burning += Math.abs(forward) * 0.45;\n        }\n        if (Math.abs(strafe) > 0.01) {\n          accel.addScaledVector(_mobileRight, strafe * ASSIST_STRAFE_ACCEL);\n          burning += Math.abs(strafe) * 0.30;\n        }\n        if (controls.thrustUp) {"""
          if old_accel not in ship:
            raise SystemExit('ship assisted accel block not found')
          ship = ship.replace(old_accel, new_accel, 1)

          old_active = """      const forward = Math.abs(controls.assistForward ?? 0);\n      const active = forward > 0.01 || controls.thrustUp;"""
          new_active = """      const forward = Math.abs(controls.assistForward ?? 0);\n      const strafe = Math.abs(controls.assistStrafe ?? 0);\n      const active = forward > 0.01 || strafe > 0.01 || controls.thrustUp;"""
          if old_active not in ship:
            raise SystemExit('ship active block not found')
          ship = ship.replace(old_active, new_active, 1)

          old_grip = """      // Grip: rotate the tangential velocity toward the ship's front.\n      _vTan.copy(this.velocity).addScaledVector(up, -this.velocity.dot(up));\n      const tanSpeed = _vTan.length();\n      if (tanSpeed > 0.5) {\n        const nose = _mobileFwd.set(0, 0, 1).applyQuaternion(this.quaternion)\n          .addScaledVector(up, -_mobileFwd.dot(up)).normalize();\n        const sign = _vTan.dot(nose) >= 0 ? 1 : -1;\n        _vTan.lerp(_gripTarget.copy(nose).multiplyScalar(sign * tanSpeed), Math.min(1, ASSIST_GRIP * dt));\n        this.velocity.copy(_vTan).addScaledVector(up, vUp);\n      }"""
          new_grip = """      // Strafe-flight test: do NOT rotate lateral velocity back toward the nose.\n      // Let A/D or stick-side remain lateral movement so it does not become camera/yaw motion.\n      _vTan.copy(this.velocity).addScaledVector(up, -this.velocity.dot(up));\n      const tanSpeed = _vTan.length();"""
          if old_grip not in ship:
            raise SystemExit('ship grip block not found')
          ship = ship.replace(old_grip, new_grip, 1)

          workflow = Path('.github/workflows/vex-sync-syl-controls.yml')
          if workflow.exists():
            workflow.unlink()

          main_path.write_text(main)
          ship_path.write_text(ship)
          PY

      - name: Commit embedded SYL patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add games/syl/src/main.js games/syl/src/ship/ship.js .github/workflows/vex-sync-syl-controls.yml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Test embedded SYL strafe controls"
          git push origin HEAD:main
