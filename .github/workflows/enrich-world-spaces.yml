name: Enrich world spaces

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ask production to enrich claimed spaces
        run: |
          curl --fail --show-error --silent --max-time 25 \
            https://heartbeatobservatory.com/api/enrich-world-spaces
