<!doctype html>
<html><head><meta charset="utf-8"><title>HO share card</title>
<!-- The home share card (1200x630), warm cream "C2" style (Jaron's pick 10/11). Content comes from card.json:
     render.py injects it as window.CARD; opened over http it fetches card.json itself. -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:#f6e9d6;font-family:"Segoe UI",system-ui,Arial,sans-serif;color:#2a1608;position:relative}
.panel{position:absolute;left:20px;top:20px;width:1160px;height:590px;border-radius:30px;background:#fff9ed;border:1.5px solid #ecd9bf;box-shadow:0 2px 14px rgba(90,50,10,.06)}
h1{position:absolute;left:0;right:0;top:30px;text-align:center;white-space:nowrap;font-family:"Segoe UI Black","Arial Black",sans-serif;font-weight:900;color:#2a1608;line-height:1;letter-spacing:.01em}
.label{position:absolute;left:44px;right:44px;top:106px;display:flex;align-items:center;gap:16px;font-size:17px;font-weight:900;letter-spacing:.14em;color:#b55410;white-space:nowrap}
.label:before,.label:after{content:"";flex:1;height:2px;background:#ebc594;border-radius:2px}
.label .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#1f9d62;margin-right:10px;vertical-align:1px}
.label small{font-size:17px;color:#8a6a52;font-weight:800}
.row{position:absolute;left:44px;right:44px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.worlds{top:138px}
.w{min-width:0;background:#fff;border:1.5px solid #ecd9bf;border-radius:18px;padding:8px 8px 10px;box-shadow:0 2px 8px rgba(90,50,10,.08)}
.w .ph{height:160px;border-radius:11px;background-size:cover;background-position:center;border:1px solid #e6d3b8}
.w h2{font-size:30px;font-weight:900;line-height:1;margin:9px 6px 0;color:#2a1608}
.w p{font-size:15px;color:#6e5544;margin:5px 6px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{top:398px;height:150px}
.f{display:flex;gap:12px;background:#fff;border:1.5px solid #ecd9bf;border-radius:18px;padding:8px;box-shadow:0 2px 8px rgba(90,50,10,.08);min-width:0}
.f .ph{position:relative;width:206px;flex:none;border-radius:11px;background-size:cover;background-position:center;border:3px solid #0e1d3c}
.f .ph b{position:absolute;right:6px;top:6px;background:#d92b3a;color:#fff;font-size:12px;font-weight:900;letter-spacing:.1em;border-radius:7px;padding:3px 8px}
.f .tx{display:flex;flex-direction:column;justify-content:center;min-width:0;padding-right:4px}
.f .k{font-size:13px;font-weight:900;letter-spacing:.13em;color:#b55410}
.f.live .k{color:#d92b3a}
.f h2{font-size:24px;font-weight:900;line-height:1.05;margin:5px 0 6px;color:#2a1608}
.f p{font-size:14.5px;line-height:1.25;color:#6e5544}
.also{background:#0e1d3c;border-radius:18px;padding:14px 12px;color:#fff;min-width:0}
.also .k{font-size:14px;font-weight:900;letter-spacing:.13em;color:#ffb27a;margin:0 0 12px 4px}
.also ul{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:8px 8px}
.also li{background:rgba(255,255,255,.1);border-radius:9px;padding:3px 9px;font-size:18px;font-weight:800;white-space:nowrap}
.also li:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3ccf86;margin-right:9px;vertical-align:3px}
.foot{position:absolute;top:566px;font-size:15px;letter-spacing:.14em;font-weight:800;color:#705b58}
</style></head><body>
<div class="panel"></div>
<h1 id="h"></h1>
<div class="label" id="label"></div>
<div class="row worlds" id="worlds"></div>
<div class="row bottom" id="bottom"></div>
<div class="foot" id="fl" style="left:46px"></div>
<div class="foot" id="fr" style="right:46px"></div>
<script>
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function draw(C) {
  const h = document.getElementById("h");
  h.textContent = C.title; h.style.fontSize = "64px";
  h.style.fontSize = Math.min(64, 64 * 1080 / h.scrollWidth) + "px";
  document.getElementById("label").innerHTML =
    '<span><span class="dot"></span>' + esc(C.classics.label) + (C.classics.note ? ' <small>· ' + esc(C.classics.note) + '</small>' : '') + '</span>';
  document.getElementById("worlds").innerHTML = C.classics.worlds.map((w) =>
    '<div class="w"><div class="ph" style="background-image:url(' + esc(w.img) + ')"></div><h2>' + esc(w.name) + '</h2><p>' + esc(w.sub) + '</p></div>').join("");
  document.getElementById("bottom").innerHTML = C.features.map((f) =>
    '<div class="f' + (f.live ? " live" : "") + '"><div class="ph" style="background-image:url(' + esc(f.img) + ')">' + (f.live ? "<b>● LIVE</b>" : "") +
    '</div><div class="tx"><div class="k">' + esc(f.kicker) + '</div><h2>' + esc(f.name) + '</h2><p>' + esc(f.sub) + '</p></div></div>').join("") +
    '<div class="also"><div class="k">' + esc(C.also.label) + '</div><ul>' + C.also.items.map((i) => '<li>' + esc(i.name) + '</li>').join("") + '</ul></div>';
  document.getElementById("fl").textContent = C.foot.left;
  document.getElementById("fr").textContent = C.foot.right;
  document.body.dataset.ready = "1";
}
if (window.CARD) draw(window.CARD); else fetch("card.json").then((r) => r.json()).then(draw);
</script>
</body></html>
